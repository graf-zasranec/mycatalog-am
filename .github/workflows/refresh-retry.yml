name: Better — retry interrupted refresh

on:
  workflow_run:
    workflows: ["Better — refresh prices"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: refresh-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait thirty minutes before retrying
        run: sleep 1800
      # Execute only trusted default-branch code; do not consume code from artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Retry once unless another refresh superseded it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/retry-refresh.mjs
