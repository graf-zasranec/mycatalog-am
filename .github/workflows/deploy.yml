name: Better — refresh prices

# This job only re-scrapes and commits the new prices. When it finishes, pages.yml builds the
# site from main and publishes it (photos to Cloudflare R2, the rest to Pages) - see DEPLOY.md.

on:
  schedule:
    - cron: '0 20 * * *'     # 00:00 Yerevan (UTC+4) - main run, done ~03:30: fresh prices and stock by morning
    - cron: '0 7 * * *'      # 11:00 Yerevan (owner, 2026-10-30) - catches morning price changes
  workflow_dispatch:
    inputs:
      scope:
        description: Shop refresh scope
        type: choice
        default: all
        options:
          - all
          - eldorado

permissions:
  contents: write             # to commit the refreshed prices + history
  actions: read               # restore this run's checkpoint on its single retry

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  # The Mac crawler (tools/mac-refresh.sh) sets MAC_CRAWLER_AT when it starts. While that is under
  # six hours old a scheduled run stands aside; when the Mac is asleep or away this one still runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.mac.outputs.skip }}
    steps:
      - id: mac
        env:
          MAC_AT: ${{ vars.MAC_CRAWLER_AT }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$EVENT" = schedule ] && [ -n "$MAC_AT" ] && [ $(( $(date +%s) - MAC_AT )) -lt 21600 ]; then skip=true; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  refresh:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 120 was hit on every run from 2026-10-06 (Eldorado's 7 s crawl delay alone is ~17 min);
    # hosted runners allow 360, and a public repository's minutes are free
    timeout-minutes: 360
    steps:
      # pinned to the commit, not the tag: a tag can be moved to point at new code,
      # and this job has contents:write on the repository it is checking out.
      # ref: main, not the commit that queued this run. A run waits hours behind the stock check in
      # the "refresh" group; starting from the old commit made every push made during that wait
      # read as a concurrent source update, and the run threw away a full crawl (5-7 Nov 2026).
      # A retry stays on the run's commit: its checkpoint carries source files from that crawl, and
      # restoring them over a newer main would undo whatever was published since.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.run_attempt == 1 && 'main' || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the cache reader
        run: python -m pip install 'scrapling[fetchers]==0.4.15' 'pillow==12.3.0' 'beautifulsoup4==4.15.0'

      # build.mjs minifies with esbuild; without it the run scrapes for hours, then fails at the build.
      - name: Install the build tools
        run: npm ci --ignore-scripts

      # Validate both real staging commands before spending hours crawling.
      - name: Validate publication and recovery before crawling
        run: node tools/release-assets-test.mjs

      - name: Restore interrupted refresh checkpoint
        if: github.run_attempt > 1
        continue-on-error: true # older runs may not have saved a checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: refresh-checkpoint
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Refresh caches, hand rows, shop prices and build
        id: prices
        # Leave time to save completed shops before the hosted runner's six-hour limit.
        timeout-minutes: 330
        env:
          BETTER_ROW_LIMIT: '400' # the full pass is stock-check.yml's job; this run is already ~5.5 of its 6 hours
          SCRAPE_LANES: '4'       # four shops fetched at once; each still one page at a time
          BETTER_FORCE_SCRAPLING: '1' # AllSell/iStore refuse GitHub's servers to a plain request (approved shops)
          BETTER_REFRESH_SCOPE: ${{ inputs.scope || 'all' }}
          BETTER_REFRESH_RESUME: ${{ github.run_attempt > 1 && '1' || '0' }}
        run: node tools/refresh.mjs

      # What the shops sell that the catalogue lacks - input for the new-model check. An artifact,
      # not a commit: the repo root is the public Pages site and this file is gitignored for that.
      - name: Save unmatched shop listings
        if: always() && steps.prices.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unmatched
          retention-days: 7
          overwrite: true
          if-no-files-found: warn
          path: data/unmatched.json

      - name: Commit refreshed prices and history
        run: |
          git config user.name  "mycatalog-bot"
          git config user.email "actions@users.noreply.github.com"
          # Only inputs are committed: prices, history and the photo derivatives. The pages are
          # built by pages.yml when this run finishes (2026-11-08), so a concurrent publish no
          # longer means rebuilding and re-committing 11,000 generated files.
          crawl_base=$(git rev-parse HEAD)
          git add data/prices.json data/history.json data/eldorado.json data/eldorado-refresh-report.json data/colour-report.json data/zigzag.json data/listings.csv data/links.csv data/phones.json
          if ! git diff --cached --quiet; then
            git commit -m "prices: $(date -u +%Y-%m-%d)"
          fi
          source_commit=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            git add data/thumbnails.json data/photo-native-metrics.json images/thumb images/social
            if ! git diff --cached --quiet; then
              git commit -m "Refresh photo derivatives"
            fi
            git push && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            # Git can splice two snapshots into valid JSON with different meaning.
            # Keep the crawl checkpoint and the published data if both writers touched a source file.
            while IFS= read -r source_file; do
              if ! git diff --quiet "$crawl_base" origin/main -- "$source_file"; then
                echo "::error::Concurrent catalogue source update: $source_file" >&2
                exit 1
              fi
            done < <(git diff --name-only "$crawl_base" "$source_commit")
            git stash push --include-untracked -m leftovers
            git reset --keep "$source_commit"
            git rebase -X ours origin/main || { git rebase --abort; exit 1; }
            crawl_base=$(git rev-parse origin/main)
            source_commit=$(git rev-parse HEAD)
            # Match refresh.mjs: regenerate the photo derivatives from the merged photos.
            for producer in photo-box thumbnails social; do
              python3 "tools/$producer.py" || echo "::warning::Could not regenerate $producer"
            done
          done

      - name: Save interrupted refresh checkpoint
        if: always() && (steps.prices.outcome != 'success' || failure())
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refresh-checkpoint
          retention-days: 2
          overwrite: true
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .scrape-partial.json
            .refresh-prepared.json
            data/eldorado.json
            data/eldorado-refresh-report.json
            data/zigzag.json
            data/listings.csv
            data/links.csv
            data/prices.json
            data/history.json
            data/phones.json
