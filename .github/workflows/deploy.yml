name: MyCatalog — refresh prices

# Pages is set to "Deploy from a branch" (main / root), so pushing the rebuilt
# files here is the deploy. This job only re-scrapes and commits.

on:
  schedule:
    - cron: '0 3 * * *'      # 07:00 Yerevan (UTC+4)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # to commit the refreshed prices + history

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # pinned to the commit, not the tag: a tag can be moved to point at new code,
      # and this job has contents:write on the repository it is checking out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Matcher self-test (no network)
        run: node scrape.mjs --selftest

      - name: Refresh prices from the shops
        run: node scrape.mjs
        continue-on-error: true      # a shop being down must not block the deploy

      - name: Build the site
        run: node build.mjs

      - name: Commit refreshed prices and history
        run: |
          git config user.name  "mycatalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json data/history.json index.html
          git diff --staged --quiet && echo "no price changes" && exit 0
          git commit -m "prices: $(date -u +%Y-%m-%d)"
          git push
