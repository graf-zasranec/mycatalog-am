name: Better — refresh prices

# Pages is set to "Deploy from a branch" (main / root), so pushing the rebuilt
# files here is the deploy. This job only re-scrapes and commits.

on:
  schedule:
    - cron: '0 20 * * *'     # 00:00 Yerevan (UTC+4) - main run, done ~03:30: fresh prices and stock by morning
    - cron: '0 10 * * *'     # 14:00 Yerevan - catches daytime price changes
  workflow_dispatch:
    inputs:
      scope:
        description: Shop refresh scope
        type: choice
        default: all
        options:
          - all
          - eldorado

permissions:
  contents: write             # to commit the refreshed prices + history
  actions: read               # restore this run's checkpoint on its single retry

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 120 was hit on every run from 2026-10-06 (Eldorado's 7 s crawl delay alone is ~17 min);
    # hosted runners allow 360, and a public repository's minutes are free
    timeout-minutes: 360
    steps:
      # pinned to the commit, not the tag: a tag can be moved to point at new code,
      # and this job has contents:write on the repository it is checking out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the cache reader
        run: python -m pip install 'scrapling[fetchers]==0.4.15' 'pillow==12.3.0' 'beautifulsoup4==4.15.0'

      # build.mjs minifies with esbuild; without it the run scrapes for hours, then fails at the build.
      - name: Install the build tools
        run: npm ci --ignore-scripts

      - name: Restore interrupted refresh checkpoint
        if: github.run_attempt > 1
        continue-on-error: true # older runs may not have saved a checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: refresh-checkpoint
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Refresh caches, hand rows, shop prices and build
        id: prices
        # Leave time to save completed shops before the hosted runner's six-hour limit.
        timeout-minutes: 330
        env:
          BETTER_ROW_LIMIT: '400' # the full pass is stock-check.yml's job; this run is already ~5.5 of its 6 hours
          SCRAPE_LANES: '4'       # four shops fetched at once; each still one page at a time
          BETTER_FORCE_SCRAPLING: '1' # AllSell/iStore refuse GitHub's servers to a plain request (approved shops)
          BETTER_REFRESH_SCOPE: ${{ inputs.scope || 'all' }}
          BETTER_REFRESH_RESUME: ${{ github.run_attempt > 1 && '1' || '0' }}
        run: node tools/refresh.mjs

      - name: Save interrupted refresh checkpoint
        if: always() && steps.prices.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refresh-checkpoint
          retention-days: 2
          overwrite: true
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .scrape-partial.json
            .refresh-prepared.json
            data/eldorado.json
            data/eldorado-refresh-report.json
            data/zigzag.json
            data/listings.csv
            data/links.csv
            data/prices.json
            data/history.json
            data/phones.json

      - name: Commit refreshed prices and history
        run: |
          git config user.name  "mycatalog-bot"
          git config user.email "actions@users.noreply.github.com"
          # photos-needed.json goes with them: it is published for whoever is finding
          # images, and a stale copy is worse than none.
          git add data/prices.json data/history.json data/photos-needed.json data/site-prices.js data/site-products.js data/site-app.js data/site-boot.js data/details data/site-ui.css data/thumbnails.json images/thumb images/social data/page-manifest.json data/eldorado.json data/eldorado-refresh-report.json data/zigzag.json data/listings.csv data/links.csv data/phones.json index.html p c b ru en sitemap.xml
          git diff --staged --quiet && echo "no price changes" && exit 0
          git commit -m "prices: $(date -u +%Y-%m-%d)"
          # A push made during the 3-hour crawl leaves this copy behind and the push is refused
          # (2026-10-03/04, 10-10). Replay tonight's commit onto the new main; keep newer main corrections on conflicts,
          # rebuild with the new code, and try again - three times, as pushes can land meanwhile.
          # The refresh also leaves files it does not commit (spec caches and the like); git will
          # not rebase over them, which is what lost the whole run on 10-10, so set them aside.
          for attempt in 1 2 3; do
            git push && exit 0
            git stash push --include-untracked -m leftovers || true
            git fetch origin main
            git rebase -X ours origin/main || { git rebase --abort; exit 1; }
            node build.mjs
            git add data/site-prices.js data/site-products.js data/site-app.js data/site-boot.js data/details data/site-ui.css data/thumbnails.json images/thumb data/page-manifest.json index.html p c b ru en sitemap.xml
            git commit --amend --no-edit
          done
          exit 1
