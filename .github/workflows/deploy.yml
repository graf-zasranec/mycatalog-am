name: Better — refresh prices

# Pages is set to "Deploy from a branch" (main / root), so pushing the rebuilt
# files here is the deploy. This job only re-scrapes and commits.

on:
  schedule:
    - cron: '0 19 * * *'     # 23:00 Yerevan (UTC+4) - the day's prices, after the shops close
    - cron: '0 3 * * *'      # 07:00 Yerevan - so the morning page is not last night's
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # to commit the refreshed prices + history

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # pinned to the commit, not the tag: a tag can be moved to point at new code,
      # and this job has contents:write on the repository it is checking out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the cache reader
        run: python -m pip install 'scrapling[fetchers]==0.4.15' 'pillow==12.3.0'

      - name: Refresh caches, hand rows, shop prices and build
        env:
          BETTER_ROW_LIMIT: '400'
        run: node tools/refresh.mjs

      - name: Commit refreshed prices and history
        run: |
          git config user.name  "mycatalog-bot"
          git config user.email "actions@users.noreply.github.com"
          # photos-needed.json goes with them: it is published for whoever is finding
          # images, and a stale copy is worse than none.
          git add data/prices.json data/history.json data/photos-needed.json data/site-prices.js data/site-products.js data/site-app.js data/thumbnails.json images/thumb images/social data/page-manifest.json data/eldorado.json data/zigzag.json data/listings.csv data/links.csv data/phones.json index.html p c b ru en sitemap.xml
          git diff --staged --quiet && echo "no price changes" && exit 0
          git commit -m "prices: $(date -u +%Y-%m-%d)"
          # a code push during the crawl made this copy stale and the push was refused (twice,
          # 2026-10-03/04): replay onto the new main, keep tonight's data, rebuild with the new code
          git push || {
            git fetch origin main
            git rebase -X theirs origin/main
            node build.mjs
            git add data/site-prices.js data/site-products.js data/site-app.js data/thumbnails.json images/thumb data/page-manifest.json index.html p c b ru en sitemap.xml
            git commit --amend --no-edit
            git push
          }
