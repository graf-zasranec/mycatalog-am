name: Better — stock check

# Re-reads every hand-recorded price and every offer's own page for "sold out", in its own
# 6-hour budget (owner, 2026-10-16). The price refresh is already ~5.5 of its 6 hours, so these
# checks cannot ride along with it. This job only commits data/listings.csv and data/soldout.json;
# the 00:00 refresh reads them and rebuilds the site.

on:
  schedule:
    - cron: '0 17 * * *'     # 21:00 Yerevan - finished before the 00:00 price refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh             # never at the same time as the price refresh; waits instead
  cancel-in-progress: false

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install the page reader
        run: python -m pip install 'scrapling[fetchers]==0.4.15' 'beautifulsoup4==4.15.0'

      - name: Re-read every hand row (price, date, sold out)
        timeout-minutes: 200
        run: node tools/confirm-hand.mjs --recheck 1 --drop-gone

      - name: Sold-out sweep of every offer
        timeout-minutes: 120
        continue-on-error: true      # a partial sweep is still saved below
        env:
          PYTHONUTF8: '1'
        run: python tools/check-links.py --all

      - name: Commit hand rows and the sold-out list
        run: |
          git config user.name  "mycatalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.csv data/soldout.json
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "stock check: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git push && exit 0
            git stash push --include-untracked -m leftovers || true
            git fetch origin main
            git rebase -X ours origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
