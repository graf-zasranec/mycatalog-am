name: Better — browser check

# Firefox cannot run on the owner's PC (Windows blocks Playwright's build of it), so the three
# engines are checked here instead: Chromium, Firefox and WebKit (Safari's engine), every route
# at nine widths from 2560 to 280px. Read-only: it never commits anything.

on:
  push:
    branches: [main]
    paths: ['index.html', '_app.js', '_shell.html', 'build.mjs', 'fonts/**', 'data/**', 'images/**', 'tools/**', 'package*.json', '.github/workflows/browsers.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Let a main check finish. GitHub coalesces newer pushes into the one waiting slot.
# Each PR can replace its own outdated running check without interrupting main.
concurrency:
  group: browsers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: Install Playwright and its three browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      # the pages are built at publish time, not committed (2026-11-08)
      - name: Build the site
        run: node build.mjs | tail -3
      - name: Check every route in Chromium, Firefox and WebKit
        env:
          PW: ${{ github.workspace }}/node_modules/playwright
          PW_ENGINES: chromium,firefox,webkit
        run: node tools/browser-check.mjs
      - name: Check image loading, responsive controls and filters in all browsers
        env:
          IMAGE_ENGINES: chromium,firefox,webkit
          RESPONSIVE_ENGINES: chromium,firefox,webkit
          FILTER_ENGINES: chromium,firefox,webkit
          INTERACTION_ENGINES: chromium,firefox,webkit
          PRODUCT_STARTUP_ENGINES: chromium,firefox,webkit
          CHEAPEST_ENGINES: chromium,firefox,webkit
        run: |
          # Each test gets one retry: they load real photos from img.better.am, and a slow first
          # response on the runner timed out a passing test (2026-11-19).
          for t in image-loading-browser-test responsive-interaction-test filter-browser-test \
                   interaction-regressions-browser-test product-startup-browser-test cheapest-config-browser-test; do
            node tools/$t.mjs || { echo "::warning::$t failed once, retrying"; sleep 10; node tools/$t.mjs; }
          done
