name: Better — uptime

# Every 15 minutes: is better.am up and serving the catalogue? A failed run makes GitHub email the
# repository owner, which is the whole alerting system - no outside monitoring account needed.
# It checks content, not just a 200: a wrong DNS record would still answer 200 with someone
# else's page.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Front page, the price data and one product page answer with the catalogue
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          home=$(curl -sfL --max-time 30 --retry 2 https://better.am/) || fail "https://better.am/ did not answer"
          price_asset=$(grep -oE 'data/site-prices(\.[a-f0-9]+)?\.js' <<< "$home" | head -n 1) || fail "front page is not the catalogue"
          test -n "$price_asset" || fail "front page has no price data reference"
          curl -sfL --max-time 30 --retry 2 -o /dev/null "https://better.am/$price_asset" || fail "referenced price data missing"
          product=$(curl -sfL --max-time 30 --retry 2 https://better.am/p/apple-iphone-17/) || fail "product page missing"
          grep -q 'Better.am' <<< "$product" || fail "product page is not the catalogue"
          echo "better.am is up"
