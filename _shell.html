<title>Better.am</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,800&amp;text=bter.&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Armenian:wght@400;500;600;700;800&display=swap">
<style>
/* ================= tokens ================= */
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --surface2:#F1EBE1; --shot:#EFE9DF;
  --text:#161C28; --body:#4A5262; --muted:#626974;
  --line:#E6DFD4; --line2:#D9D0C2;
  --brand:#9E2B25; --brand-ink:#FFFFFF; --brand-soft:#F6E4E1; --brand-2:#7E1F1B;
  --apricot:#B8443C; --apricot-soft:#F7E5E3;
  --good:#2C7452; --good-soft:#E4F0EA; --bad:#C0392B;
  --hot:#161C28; --hot-soft:#EFE9DF;
  /* masthead shares the page surface: nav, hero and catalogue are one field */
  --nav:transparent; --nav-ink:var(--text); --nav-muted:var(--muted);
  --shadow-s:0 1px 2px rgba(20,19,20,.05);
  --shadow-m:0 2px 4px rgba(20,19,20,.04), 0 12px 28px -14px rgba(20,19,20,.16);
  --shadow-l:0 4px 10px rgba(20,19,20,.05), 0 28px 60px -28px rgba(20,19,20,.26);
  --r-xl:20px; --r-lg:14px; --r-md:10px; --r-sm:8px; --pill:50px;
  --ui:'Manrope','Noto Sans Armenian','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono','Noto Sans Armenian',ui-monospace,monospace;
  --maxw:1240px;
}
/* Two themes only: the cream one above and the dark one below. The black/orange third
   theme is gone; [data-theme="dark"] repeats the media block because a media query and
   an attribute selector cannot share a rule - keep the two lists identical. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151D; --surface:#1A1E29; --surface2:#232837;
    /* The photo tile stays LIGHT in dark mode. Product shots are cut out of a white
       studio backdrop, so a black phone, black headphones or a black Xbox on a #232837
       tile is a black shape on a black square - half the catalogue was invisible. */
    --shot:#EDEFF3;
    --text:#F2EEE7; --body:#B3BBC9; --muted:#8B93A3;
    --line:#282D3B; --line2:#38404F;
    --brand:#E4574F; --brand-ink:#12151D; --brand-soft:#3A1E1C; --brand-2:#F0726A;
    --apricot:#D9736B; --apricot-soft:#3A2220;
    --good:#5FC79A; --good-soft:#16301F; --bad:#F08076;
    --hot:#F2EEE7; --hot-soft:#282D3B;
    --nav:transparent; --nav-ink:var(--text); --nav-muted:var(--muted);
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
    --shadow-l:0 4px 10px rgba(0,0,0,.35), 0 28px 60px -28px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
    --bg:#12151D; --surface:#1A1E29; --surface2:#232837;
    /* The photo tile stays LIGHT in dark mode. Product shots are cut out of a white
       studio backdrop, so a black phone, black headphones or a black Xbox on a #232837
       tile is a black shape on a black square - half the catalogue was invisible. */
    --shot:#EDEFF3;
    --text:#F2EEE7; --body:#B3BBC9; --muted:#8B93A3;
    --line:#282D3B; --line2:#38404F;
    --brand:#E4574F; --brand-ink:#12151D; --brand-soft:#3A1E1C; --brand-2:#F0726A;
    --apricot:#D9736B; --apricot-soft:#3A2220;
    --good:#5FC79A; --good-soft:#16301F; --bad:#F08076;
    --hot:#F2EEE7; --hot-soft:#282D3B;
    --nav:transparent; --nav-ink:var(--text); --nav-muted:var(--muted);
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
    --shadow-l:0 4px 10px rgba(0,0,0,.35), 0 28px 60px -28px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* rem, not px: a reader who raises their browser's default text size gets a bigger UI.
   Structural values (borders, small gaps) stay in px on purpose. */
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:1rem;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  /* a short page (compare with nothing in it, privacy, not found) left the footer floating mid-
     window with bare background under it; the main area now takes up whatever the page lacks */
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
body > main{flex:1 0 auto}
body > footer{flex:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance;line-height:1.18}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:where(a,button,input,select,summary,[tabindex]):focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
/* render() focuses the new page's heading so a screen reader announces it. That is not a
   keyboard action, so it must not draw a focus ring round the title. */
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;background:var(--surface);padding:10px 14px;border-radius:8px;z-index:99}
.skip:focus{left:10px;top:10px}
.shell{max-width:var(--maxw);margin:0 auto;padding:0 20px}
@media (max-width:600px){.shell{padding:0 14px}}
/* A 1240px column on a 2560px monitor is 660px of empty gutter each side and still only four
   cards per row. The content column grows in two steps instead, which the auto-fill grid below
   turns into more cards per row rather than wider ones. */
@media (min-width:1500px){:root{--maxw:1420px}}
@media (min-width:1920px){:root{--maxw:1680px}}
/* a 2560 monitor is not a wide laptop: six cards a row instead of five, and the reading
   column still capped so a line of body text never runs the width of the screen. */
@media (min-width:2300px){:root{--maxw:2040px}}

/* ============ masthead: nav, cover and catalogue are ONE ivory field ============ */
.mast{background:var(--bg);color:var(--text)}
.topnav{display:flex;align-items:center;gap:16px;height:74px}
.topnav .logo{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:800;letter-spacing:-.03em;color:var(--text);flex:none}
/* The mark is the dot. It used to hold a 24-viewBox phone icon drawn at 9x9 with no fill set,
   so it inherited #000 - a colour that is in no palette here - and spilled the circle it sat
   in. At this size the glyph could not be read as anything, so it is gone rather than fixed. */
.topnav .logo .m{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
.topnav .logo .wm{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:1.3em;letter-spacing:-.03em;line-height:1}
.topnav .logo em{font-style:normal;color:var(--brand)}
.nav{display:flex;gap:2px;flex:none}
.nav a{padding:8px 12px;border-radius:0;font-weight:600;font-size:0.875rem;color:var(--muted);
  box-shadow:inset 0 -1px 0 transparent}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);box-shadow:inset 0 -2px 0 var(--brand)}
.srch{flex:1 1 auto;min-width:0;position:relative;max-width:520px}
.srch input{width:100%;height:48px;padding:0 15px 0 44px;border-radius:0;border:0;
  border-bottom:1px solid var(--line2);background:none;color:var(--text);font-size:1rem}
.srch input::placeholder{color:var(--muted)}
.srch input:focus{outline:none;border-bottom-color:var(--brand)}
.mast-r{display:flex;align-items:center;gap:2px;flex:none;margin-left:auto}   /* pinned right, whatever the search box leaves */
.langs{display:flex;align-items:center}
.langs button{background:none;border:0;color:var(--muted);cursor:pointer;padding:7px 7px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;line-height:1}
.langs button:hover{color:var(--text)}
.langs button[aria-pressed="true"]{color:var(--text);text-decoration:underline;text-underline-offset:4px;
  text-decoration-color:var(--brand);text-decoration-thickness:2px}
.th{width:34px;height:34px;background:none;border:0;color:var(--muted);cursor:pointer;
  display:grid;place-items:center;margin-left:4px}
.th svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.th:hover{color:var(--text)}
/* A toast already says what happened, but the badge is the thing being watched. */
@keyframes cmppop{0%{transform:scale(1)}32%{transform:scale(1.45)}100%{transform:scale(1)}}
.nav a .c.pop{animation:cmppop .42s cubic-bezier(.2,.9,.3,1)}
/* Money animations. The price rail flashes when the figure changes under you, the cheapest
   offer takes one sweep of light, and a savings bar grows once it is actually on screen.
   _app.js skips all of them under reduced motion - these carry no transform for the global
   rule to strip, so the rule alone would let them through. */
@keyframes fxflash{0%,62%{color:var(--brand)}100%{color:inherit}}
/* Any price, not just the rail: switching capacity or colour changes all of them at once. */
.fx-flash{animation:fxflash .8s ease-out}
@keyframes fxglint{from{background-position:-60% 0}to{background-position:170% 0}}
.orow.fx-glint{background-image:linear-gradient(100deg,transparent 41%,color-mix(in srgb,var(--brand) 20%,transparent) 50%,transparent 59%);
  background-size:260% 100%;background-repeat:no-repeat;animation:fxglint .95s ease-out}
/* The bar's width is written into the markup at render time and nothing ever changes it
   afterwards, so the width transition that used to be here never once fired - the savings
   bars have always just appeared at full length. A keyframe needs nothing to change: it runs
   on arrival, it scales rather than resizes, so it composites, and the reduced-motion rule
   above already strips every animation for anyone who does not want it. */
@keyframes barin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.nav a .c{min-width:19px;height:19px;margin-left:6px;padding:0 6px;border-radius:var(--pill);background:var(--brand);
  color:var(--brand-ink);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;vertical-align:1px}
.nav a .c:empty{display:none}
@media (max-width:820px){
  .topnav{flex-wrap:wrap;height:auto;padding-block:12px;gap:10px}
  .topnav .logo{order:1}.mast-r{order:2;margin-left:auto}
  .srch{order:3;flex:1 1 100%;max-width:none}
  .nav{order:4;flex:1 1 100%}
}

/* ---- search: a list while you type, a whole page behind Enter ---- */
.srch-go{position:absolute;left:5px;top:6px;width:36px;height:36px;display:grid;place-items:center;
  background:none;border:0;border-radius:var(--pill);cursor:pointer;color:var(--muted)}
.srch-go:hover{color:var(--brand)}
.srch-go svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;background:var(--surface);
  border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.sg-i{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:8px 12px;
  color:inherit;text-decoration:none;border-bottom:1px solid var(--line2)}
.sg-i:last-of-type{border-bottom:0}
.sg-i:hover,.sg-i:focus-visible{background:var(--line2);outline:none}
.sg-i img{width:34px;height:34px;object-fit:contain}
.sg-n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-p{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sg-none{margin:0;padding:12px;color:var(--muted);font-size:13px}
.sg-all{display:block;width:100%;padding:10px;border:0;border-top:1px solid var(--line2);
  background:var(--line2);color:var(--brand);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.sg-all:hover{filter:brightness(1.08)}
/* the panel is the width of the box on desktop; on a phone the box spans the row, so it does too */
@media (max-width:820px){.sugg{max-height:60vh;overflow-y:auto}}

.orow .stale{font-style:normal;font-size:10.5px;padding:1px 5px;border-radius:var(--pill);
  background:var(--surface2);color:var(--muted);margin-left:6px;white-space:nowrap}

/* ---- filters fold away: eleven chips above the results is most of a phone screen ---- */
.fbar.folded > :nth-child(n+6){display:none}   /* folded still shows the first four (child 1 is the sheet head) */
.fbar.folded > .spacer,.fbar.folded > [data-drop="sort"],.fbar.folded > .fmore{display:inline-flex}
/* "All filters" in the filter row, the same pill as "More sections" at the filters' height */
.fbar .cmore{height:42px;margin:0;font-size:0.9375rem;font-weight:600}
.fsheet-hd,.fsheet-ft,.mbar,.fscrim{display:none}
.fsearch{width:100%;height:36px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);color:var(--text);
  padding:0 11px;font:inherit;font-size:0.875rem;margin-bottom:6px;position:sticky;top:-8px;z-index:1}
.fsearch:focus{outline:2px solid var(--brand);outline-offset:-1px}


.fapply{display:flex;gap:8px;margin-top:10px;padding:10px 0 2px;border-top:1px solid var(--line);
  /* the brand list is longer than the panel is tall, and an Apply you have to scroll to find
     is an Apply nobody presses */
  position:sticky;bottom:-8px;background:var(--surface)}
.fapply button{flex:1 1 auto;height:32px;border-radius:var(--pill);font:inherit;font-size:0.875rem;cursor:pointer;
  border:1px solid var(--line2);background:none;color:var(--muted)}
.fapply .fgo{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.fapply .fclear{flex:0 0 auto;padding:0 12px}
.fapply button:hover{filter:brightness(1.08)}
.fdrop.dirty > summary{border-color:var(--brand);color:var(--brand)}
/* --- motion -------------------------------------------------------------------------- */
/* Only transform and opacity: the two properties a browser can animate without re-laying out
   the page, which is what keeps this smooth on a weak machine as well as a fast one. */
.ctabs .ctab,.fmore,.fdrop summary,.fapply button,.pcard,.dl,.btn,.toggle{
  transition:transform .18s cubic-bezier(.2,.7,.3,1),opacity .18s ease,
             background-color .18s ease,border-color .18s ease,color .18s ease}
.ctabs .ctab:active,.fmore:active,.fapply button:active,.toggle:active{transform:scale(.97)}
.pcard:hover{transform:translateY(-2px)}
.pcard.leave{opacity:0;transform:scale(.96);transition:opacity .15s ease,transform .15s ease}
.dl:hover{transform:translateY(-2px)}
.fdrop .panel{transform-origin:top left;animation:pop .16s cubic-bezier(.2,.7,.3,1)}
.fdrop.r .panel{transform-origin:top right}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
.fdrop summary svg{transition:transform .18s cubic-bezier(.2,.7,.3,1)}
.fdrop[open] summary svg{transform:rotate(180deg)}
/* Someone who has asked their system for less movement gets none of it. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
}
.fmore{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--pill);
  border:1px solid var(--line2);background:none;color:inherit;font:inherit;font-size:13px;cursor:pointer}
.fmore:hover{border-color:var(--brand);color:var(--brand)}
.fmore b{font-weight:700;color:var(--brand)}
.fmore svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .2s ease}
.fmore[aria-expanded="true"] svg{transform:rotate(180deg)}

/* ---- cover: the phone overlaps the headline, apricot rule ties them ---- */
.mast-hero{padding-block:8px 0}
.cv-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brand);display:flex;align-items:center;gap:10px}
.cv-eyebrow::after{content:"";flex:1;height:1px;background:var(--line2)}
.cv{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin-top:18px}
.cv-h{font-size:clamp(34px,5.4vw,68px);font-weight:800;letter-spacing:-.05em;line-height:.9;max-width:16ch}
.cv-h em{font-style:normal;color:var(--brand)}
.cv-sub{color:var(--body);font-size:1.03rem;max-width:52ch;margin-top:18px}
.cv-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
/* ---- the tag after a name: launch year (phones, tablets, watches, headphones) or screen (TV,
   monitor). Brick on a soft wash, in the mono face, sized from the text it follows - so one rule
   serves a 58 px page title and a 15 px card title alike. */
.ny{display:inline-flex;align-items:center;justify-content:center;margin-left:.45em;padding:0 .5em;height:1.75em;border-radius:.45em;
  font-family:var(--mono);font-size:max(10.5px,.5em);font-weight:600;letter-spacing:.04em;line-height:1;
  color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--line2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 22%,transparent);
  vertical-align:middle;white-space:nowrap;text-decoration:none}
.ny.cur{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 30%,transparent)}
.ny.sz{color:var(--text);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line2)}
.pname .ny{font-size:max(12px,.3em);vertical-align:.55em;letter-spacing:.06em}
.pcard h3 .ny,.dl-n .ny,.sg-n .ny,.cwt b .ny,.cname .ny{font-size:10.5px;vertical-align:.1em}
.spot-c .ny{color:#FFD9D4;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font-size:11px;vertical-align:.1em}
/* ---- the hero's right half: one saving, against what shops usually ask ---- */
.spot{display:none}
@media (min-width:1000px){
  /* the headline, text and buttons are ONE column item, so a taller card cannot pull them apart */
  .cv.has-spot{grid-template-columns:minmax(0,1fr) minmax(320px,400px);column-gap:56px;align-items:center}
  .cv.has-spot > .cv-l{grid-column:1;grid-row:1}
  .spot{display:grid;grid-column:2;grid-row:1;color:var(--text);text-decoration:none;
    border-radius:var(--r-xl);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
  .spot:hover{transform:translateY(-2px)}
}
/* the spotlight IS this deal, so the row below does not repeat it */
.dl.is-spot{display:none}
.spot-e{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.spot-p{font-weight:800;letter-spacing:-.03em;line-height:1.05}
/* a poster - dark tinted panel in both themes, the product bleeding off the edge */
.spot-c{position:relative;overflow:hidden;min-height:340px;padding:24px;align-content:space-between;gap:18px;color:#fff;
  background:radial-gradient(120% 90% at 85% 25%,#6B2B2F 0%,#3A1C22 45%,#1B1116 100%);box-shadow:var(--shadow-m)}
.spot-c .spot-e{color:#FFB4AC;position:relative}
.spot-c img{position:absolute;right:-36px;top:96px;width:180px;height:220px;object-fit:contain;
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.55));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.spot-c:hover img{transform:translate(-6px,-6px) rotate(-2deg)}
.spot-pct{position:relative;font-size:68px;font-weight:800;letter-spacing:-.05em;line-height:.9}
.spot-pct small{display:block;font-size:13px;letter-spacing:0;font-weight:600;color:#F2D9D6;margin-top:10px;max-width:17ch;line-height:1.35}
.spot-bot{position:relative;display:grid;gap:4px;max-width:60%}
.spot-c .spot-n{font-size:17px;font-weight:800;line-height:1.25}
.spot-bot small{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#F2D9D6}
.spot-c .spot-p{font-size:26px}
.spot-at{font-size:12.5px;color:#F2D9D6}
@media (prefers-reduced-motion:reduce){.spot,.spot-c img{transition:none}.spot:hover,.spot-c:hover img{transform:none}}
/* Phones and tablets: the same poster, small - under the headline, one row tall */
@media (max-width:999px){
  .cv.has-spot > .spot{display:grid;order:2;margin-top:22px;color:#fff;text-decoration:none;border-radius:var(--r-xl)}
  .spot-c{min-height:0;padding:16px 18px;grid-template-columns:minmax(0,1fr) 104px;grid-template-rows:auto auto auto;gap:4px 12px;align-content:start}
  .spot-c .spot-e{grid-column:1/-1}
  .spot-c img{position:static;grid-column:2;grid-row:2/4;width:104px;height:104px;align-self:center;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
  .spot-c:hover img{transform:none}
  .spot-pct{grid-column:1;font-size:42px}
  .spot-pct small{margin-top:6px;font-size:12px;max-width:none}
  .spot-bot{grid-column:1;max-width:none;gap:2px;margin-top:6px}
  .spot-c .spot-n{font-size:15px}
  .spot-c .spot-p{font-size:21px}
}
.cv-bar{display:flex;flex-wrap:wrap;gap:8px 30px;align-items:baseline;
  border-top:2px solid var(--apricot);padding-top:14px;margin-top:26px}
.cv-bar div{display:flex;align-items:baseline;gap:8px}
.cv-bar b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.cv-bar span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---- savings strip: real spread between shops, the thing only this site knows ---- */
/* Announced, not yet on sale. Reads as a strip of its own rather than as catalogue cards, so
   nobody mistakes a pre-order price for a price you can pay in a shop today. */
/* An eSIM-only build is a different phone to most buyers here - Armenian carriers hand out
   physical SIMs - and it is usually the cheaper row, so it says so on the row itself. */
.orow .esim{font-family:var(--mono);font-size:9px;letter-spacing:.08em;font-style:normal;
  padding:2px 5px;border-radius:4px;background:var(--surface2);color:var(--muted);vertical-align:middle}
/* Nano-SIM is the tray build and the commoner one, so it reads as plain type rather than
   competing with the eSIM chip for attention. */
.orow .esim.nano{background:none;border:1px solid var(--line2);color:var(--muted)}
/* The colour, on the all-offers page only. A swatch first, because that is what the eye
   separates two rows by before it reads either of them. */
.orow .ocol{font-style:normal;display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
.orow .ocol b{width:9px;height:9px;border-radius:50%;background:var(--c,var(--line2));
  border:1px solid rgba(0,0,0,.18);flex:none}
/* The shop sells this finish but publishes no page for it, so the link goes to the same
   model in another colour. The row says so rather than letting the picture do the lying. */
.orow .chk{margin-left:6px;padding:1px 6px;border-radius:var(--pill);border:1px solid var(--line2);
  color:var(--muted);font-size:10.5px;font-style:normal;font-weight:600;white-space:nowrap}
/* Pages. 36 cards a page: the grid stops being 192 cards of DOM on every filter move. */
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin:26px 0 4px}
/* Centred by the BOX, not by the font. The arrows used to be the characters ← and →, which every
   font draws at its own size and height: in the mono face they sat small and up-left inside the
   circle while the digits beside them sat dead centre, and a different browser picks a different
   fallback font and a different wrong place. inline-flex puts the content in the middle whatever
   it is, and the arrows are now drawn (see pager() in _app.js), so no font is consulted at all. */
.pager .pg{display:inline-flex;align-items:center;justify-content:center;line-height:1;
  min-width:38px;height:38px;padding:0 10px;border-radius:var(--pill);cursor:pointer;
  font-family:var(--mono);font-size:0.8125rem;font-weight:600;border:1.5px solid var(--line2);
  background:var(--surface);color:var(--text);transition:border-color .12s,background .12s}
.pager .pg:hover:not(:disabled){border-color:var(--text)}
.pager .pg.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pager .pg:disabled{opacity:.35;cursor:default}
.pager .gap{color:var(--muted);padding:0 2px}
.pager .pg.step{padding:0}
.pager .pg.step svg{width:16px;height:16px;flex:none;display:block}
/* Which of the three rows pager() writes is on show. Chosen by width, because the thing that
   decides whether a row fits is how many 44 px targets sit side by side - and those stay 44 px
   on every touch screen, which is not negotiable. The full row needs ~376 px at its widest (a
   middle page), the slim one ~276, the counter ~150. Checked at 2560, 1920, 1366, 1024, 884,
   768, 430, 375, 344 and 280. */
.pager .ps,.pager .pgnow{display:none}
.pager .pgnow{font-family:var(--mono);font-size:0.8125rem;font-weight:600;color:var(--text);
  padding:0 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:520px){
  .pager .pf{display:none}
  .pager .pg.ps{display:inline-flex}
  .pager .gap.ps{display:inline}
}
@media (max-width:330px){
  .pager .pg.ps,.pager .gap.ps{display:none}
  .pager .pgnow{display:inline-block}
}
@media (max-width:520px){.pager .pg{min-width:34px;height:34px;padding:0 8px}}
/* Filter results arriving. The stagger is per-card via --d, set in gridIn(). */
@keyframes gridin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes gridinFade{from{opacity:0}to{opacity:1}}
.grid.gridin>*{animation:gridin .34s cubic-bezier(.22,.61,.36,1) both;animation-delay:var(--d,0ms)}
@media (prefers-reduced-motion:reduce){
  /* opacity only: the trigger is movement, and the cue that the grid changed is still worth keeping */
  .grid.gridin>*{animation:gridinFade .2s ease both}
}
.soon-sec{margin-top:52px;border-top:1px solid var(--line);padding-top:26px}
.soon-hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.soon-tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bg);background:var(--brand);border-radius:var(--pill);padding:4px 10px}
.soon-hd h2{font-size:20px;font-weight:800;letter-spacing:-.03em}
/* The wait, in the mono face the rest of the site uses for figures. Tabular digits so the
   minutes tick without the line shuffling sideways. */
.soon-cd{margin-left:auto;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;
  color:var(--brand);border:1px solid var(--line);border-radius:var(--pill);padding:5px 12px;
  font-variant-numeric:tabular-nums}
.soon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.soon{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;
  transition:border-color .14s}
.soon:hover{border-color:var(--brand)}
.soon .t{background:var(--shot);border-radius:var(--r-md);height:92px;padding:8px;overflow:hidden}
.soon .t img{width:100%;height:100%;object-fit:contain}
/* the three text lines live in ONE grid cell, or they get placed as grid items and the price
   lands on top of the pre-order line */
.soon>span:last-child{display:block;min-width:0}
.soon .nm{display:block;font-size:0.938rem;font-weight:700;line-height:1.25}
.soon .pr{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;margin-top:4px;white-space:nowrap}
.soon .po{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-top:4px}
/* ---- deals: the front page opens on real savings, a row you scroll yourself ---- */
.dls{margin-top:34px;outline:none}
.dls-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}
.dls-hd h2{font-size:26px;font-weight:800;letter-spacing:-.035em}
.dls-hd p{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.dls-arr{display:flex;gap:8px}
.dls-arr button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--text);
  display:grid;place-items:center;cursor:pointer;transition:border-color .15s,opacity .15s}
.dls-arr button:hover:not(:disabled){border-color:var(--text)}
.dls-arr button:disabled{opacity:.35;cursor:default}
.dls-arr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* The next card always peeks in at the edge, which is what tells a thumb the row scrolls. */
.dls-row{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(200px,21%,250px);gap:12px;overflow-x:auto;
  scroll-snap-type:x mandatory;scroll-padding-inline:2px;padding:2px 2px 10px;scrollbar-width:none;overscroll-behavior-x:contain}
.dls-row::-webkit-scrollbar{display:none}
@media (max-width:640px){.dls-row{grid-auto-columns:66%}.dls-arr{display:none}}
.dl{scroll-snap-align:start;display:grid;gap:4px;align-content:start;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:10px 12px 14px;color:var(--text);text-decoration:none}
.dl:hover{border-color:var(--text)}
.dl-im{background:var(--shot);border-radius:var(--r-md);aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;margin-bottom:6px}
.dl-im img{max-width:78%;max-height:84%;width:auto;height:auto;object-fit:contain}
.dl small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-n{font-weight:700;font-size:15px;line-height:1.25}
.dl-p{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.dl-at{font-size:12.5px;color:var(--body)}
.dl-save{justify-self:start;margin-top:6px;font-weight:700;font-size:12px;line-height:1.3;padding:4px 9px;border-radius:var(--pill);
  background:var(--good-soft);color:var(--good)}
.dl-sp{width:100%;height:28px;margin-top:4px}
.dl-sp path{fill:none;stroke:var(--good);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.dl-sp circle{fill:var(--good)}
/* a fold's cover screen (280px): the sort button's label is wider than the screen, and the
   compare heading is one long word - both shrink or wrap instead of pushing the page sideways */
@media (max-width:360px){
  .fdrop{flex:0 1 auto;min-width:0;max-width:100%}
  .fdrop>summary{height:auto;min-height:42px;padding:8px 15px;white-space:normal;max-width:100%}
  .cbar-l h1{font-size:22px}
}
.fmore[hidden],.fbar[hidden]{display:none}

/* ================= buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 26px;
  border-radius:var(--pill);border:1px solid transparent;background:var(--brand);color:var(--brand-ink);
  font-weight:700;font-size:0.906rem;cursor:pointer;white-space:nowrap;transition:transform .12s ease,background .12s ease}
.btn:hover{background:var(--brand-2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--line2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{height:38px;padding:0 16px;font-size:0.844rem}
.btn.block{width:100%}

/* ================= filter bar ================= */
/* category navigation: one always-visible row, current item marked */
/* construct: category cards, then one block per question */
.cnh{font-size:clamp(30px,4.6vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:18px 0 0}
.clead{color:var(--body);font-size:1.0625rem;max-width:58ch;margin:10px 0 0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
/* the count must not push the name out of the card, at any width */
.ccard>b{min-width:0;overflow-wrap:anywhere}.ccard .num{flex:none}
.ccard{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--text);
  font-size:1rem;font-weight:700;text-align:left;transition:border-color .12s,background .12s,color .12s}
.ccard:hover{border-color:var(--text)}
.ccard.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.ccard .num{font-weight:600;font-size:0.875rem;opacity:.6}
.cq{margin-top:26px}
.cq h3{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px}
.cqrow{display:flex;flex-wrap:wrap;gap:8px}
.cchip{height:42px;padding:0 17px;border-radius:var(--pill);cursor:pointer;font-size:0.9375rem;font-weight:600;
  border:1.5px solid var(--line2);background:var(--surface);color:var(--text);transition:background .12s,border-color .12s,color .12s}
.cchip:hover{border-color:var(--text)}
.cchip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.cfixed{margin-top:26px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface2);
  color:var(--body);font-size:0.9375rem}
.cfixed b{color:var(--text)}
.cgo{margin:28px 0 10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cnone{color:var(--brand);font-weight:600;font-size:0.9375rem}
/* 1fr is minmax(auto,1fr): the tenth category's name is wider than a 390px half-column, so it
   set the column floor and the page scrolled sideways. The column may shrink, the label wraps. */
@media (max-width:640px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ccard{padding:13px 14px;font-size:0.9375rem}
  .ccard b{min-width:0;overflow-wrap:anywhere}}
.ctabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;align-items:center;margin:22px 0 4px}
.ctabs::-webkit-scrollbar{display:none}
.ctabs .ctab{flex:none}
/* one row in every language: the tabs scroll under "More sections", which stays in view */
.ctabs .cmore{flex:none;position:sticky;right:0;margin-left:auto;background:var(--bg);box-shadow:-14px 0 10px var(--bg)}
.ctabs .ctab{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--pill);
  border:1px solid var(--line);background:var(--surface);color:var(--body);font-weight:600;font-size:0.9375rem;
  transition:border-color .12s,color .12s,background .12s}
.ctabs .ctab:hover{border-color:var(--line2);color:var(--text)}
.ctabs .ctab.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.ctabs .ctab b{font-weight:600;font-size:0.8125rem;opacity:.6}
.ctabs .cmore{height:38px;text-decoration:none}
@media (max-width:640px){.ctabs .cmore{height:34px}}
@media (max-width:640px){.ctabs{gap:5px;margin-top:16px}.ctabs .ctab{height:34px;padding:0 12px;font-size:0.875rem}}
/* No overflow here: overflow-x:auto makes overflow-y compute to auto too, which clipped every
   filter dropdown to the 46px-tall bar on desktop. Wrapping costs a row and keeps them visible. */
.fbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:26px 0 0;padding-bottom:4px}
.fbar{scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fdrop{position:relative;flex:none}
.fdrop>summary{list-style:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:0.875rem;
  cursor:pointer;white-space:nowrap;user-select:none}
.fdrop>summary::-webkit-details-marker{display:none}
.fdrop>summary:hover{border-color:var(--line2)}
.fdrop[open]>summary,.fdrop.on>summary{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.fdrop>summary svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .15s}
.fdrop[open]>summary svg{transform:rotate(180deg)}
.fdrop:not([open]) .panel{display:none}
.fdrop .panel{position:absolute;top:50px;left:0;z-index:50;min-width:250px;max-height:340px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-l);padding:8px}
.fdrop.r .panel{left:auto;right:0}
@media (max-width:640px){.fdrop .panel{position:fixed;left:10px;right:10px;top:auto;bottom:10px;min-width:0;max-height:60vh}}
.opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:0.906rem}
.opt:hover{background:var(--surface2)}
.opt input{width:17px;height:17px;accent-color:var(--brand);margin:0;flex:none}
.opt .n{margin-left:auto;font-size:12.5px;color:var(--muted)}
.fbar .spacer{flex:1 1 auto;min-width:4px}
.toggle{flex:none;display:inline-flex;align-items:center;height:42px;padding:0 15px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:0.875rem;cursor:pointer;white-space:nowrap}
.toggle[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.rngbox{padding:12px 10px 6px}
.rng{position:relative;height:26px}
.rng .track{position:absolute;left:0;right:0;top:12px;height:3px;border-radius:2px;background:var(--line2)}
.rng .fill{position:absolute;top:12px;height:3px;border-radius:2px;background:var(--brand)}
.rng input{position:absolute;left:0;top:4px;width:100%;height:18px;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;
  background:var(--surface);border:2px solid var(--brand);box-shadow:var(--shadow-s);cursor:pointer}
.rng input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--surface);
  border:2px solid var(--brand);cursor:pointer}
.rngv{display:flex;justify-content:space-between;font-size:0.8125rem;font-weight:600;padding-top:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.note{font-size:0.8125rem;color:var(--muted);margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 8px 0 13px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand-2);border:0;font-size:0.8125rem;font-weight:600;cursor:pointer;
  /* a chip that disappears in one frame makes the grid below it jump for no visible reason.
     Collapsing its width first makes the reflow look caused. max-width, not width: the chip is
     inline-flex and sized by its own text. */
  max-width:320px;overflow:hidden;white-space:nowrap;
  transition:opacity .18s ease,max-width .24s cubic-bezier(.4,0,.2,1),padding .24s,margin .24s}
.chip.gone{opacity:0;max-width:0;padding-left:0;padding-right:0;margin-right:-9px}
.chip span{font-size:15px;line-height:1;opacity:.65}
.chip:hover span{opacity:1}
.chip.clear{background:none;color:var(--muted);padding:0 12px}
.chip.clear:hover{color:var(--text)}

.resbar{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:22px 0 14px}
.resbar h1,.resbar h2{font-size:26px;font-weight:800;letter-spacing:-.035em;margin:0}
.resbar .cnt{font-size:0.875rem;color:var(--muted);font-weight:500}

/* ================= product grid ================= */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
/* auto-fill lands one card short on a tablet - 768px minus the shell padding and a scrollbar is
   just under what three 232px columns need - so the tablet range asks for three outright. */
@media (min-width:620px) and (max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
/* min-width:0 - a grid item's default min-width is auto, which is what let one long spec
   chip set the floor for its whole column and push the grid off the screen. */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;min-width:0;
  display:flex;flex-direction:column;position:relative;transition:box-shadow .16s ease,transform .16s ease,border-color .16s}
/* Hover used to change a border and nothing else. Lifting the card and deepening its shadow
   says "this one is under your hand", and the script advances the colour crossfade at the same
   moment, so hovering a row reads as browsing rather than as pointing. */
.pcard:hover{border-color:var(--line2);box-shadow:var(--shadow-m);transform:translateY(-3px)}
/* a finger is not a pointer: on touch the lift would stick after the tap */
@media (hover:none){.pcard:hover{transform:none;box-shadow:var(--shadow-s);border-color:var(--text)}}
.pshot{position:relative;background:var(--shot);border-radius:var(--r-md);height:190px;display:block;padding:14px;overflow:hidden}
@media (max-width:520px){.pshot{height:140px;padding:10px}}
/* The card is 312x445 and its only link was the 22px title, so the photograph - the thing a
   thumb actually goes for - did nothing. The title's own link is stretched over the whole card
   instead of wrapping the card in a second <a>: one link per card, so a screen reader still
   announces one target, and the compare button keeps working by sitting above it. */
.pcard > h3 a::after{content:"";position:absolute;inset:0;border-radius:var(--r-lg);z-index:1}
.fav{z-index:2;position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;cursor:pointer;z-index:2}
.fav svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;transition:transform .15s ease}
/* already compared: the plus turns into the x that removes it */
.fav[aria-pressed="true"] svg{transform:rotate(45deg)}
.fav:hover svg{stroke:var(--brand)}
.fav[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
.fav[aria-pressed="true"] svg{stroke:var(--brand-ink)}
/* a card that cannot join the current comparison fades back rather than disappearing */
.fav.off{opacity:.25;transition:opacity .35s ease}
.fav{transition:opacity .35s ease}
.badge{position:absolute;top:10px;left:10px;height:22px;padding:0 9px;border-radius:var(--pill);z-index:2;
  display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;
  /* fixed colours, not theme tokens: the photo panel is light in BOTH themes, and the old
     var(--text) pill turned pale-on-pale in the dark theme */
  background:#9E2B25;color:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.18)}
/* A product no Armenian shop is listing. The catalogue only carries stock you can buy, so this
   is the one card state that has to contradict the badge beside it rather than decorate it. */
.badge.na{background:#FFFFFF;color:#4A5262;border:1px solid #D9D0C2;box-shadow:none}
.pbody{padding:12px 4px 2px;display:flex;flex-direction:column;flex:1}
.eyebrow{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.11em;text-transform:uppercase}
.pcard h3{font-size:1rem;font-weight:700;letter-spacing:-.02em;margin-top:3px;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.pcard h3 a::after{content:"";position:absolute;inset:0;z-index:1}
.sc{min-width:0;display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
/* nowrap on a chip whose text is longer than the card - "Over-ear, active noise cancellation"
   is 254px against a 176px card on a phone - pushed the whole page sideways. The chip wraps and
   is capped to the card instead; a taller pill costs nothing, a sideways page costs the layout. */
.sc li{font-size:11.5px;font-weight:600;color:var(--body);background:var(--surface2);border-radius:7px;
  padding:3px 7px;max-width:100%;overflow-wrap:anywhere}
.pfoot{margin-top:auto;padding-top:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.pprice{font-size:19px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
/* Two cards across a 360 px phone leave ~136 px of footer: a TV at "6 398 900 ֏" plus the 34 px
   arrow did not fit and pushed the page sideways. The arrow is decoration - the whole card is the
   link - so on the narrowest screens it goes, and the price steps down a size. */
.pfoot{min-width:0}
@media (max-width:420px){.pcard .go{display:none}.pprice{font-size:17px}}
.pprice s{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
/* A figure the data itself flags as unconfirmed. Quiet - it qualifies the number, it does not
   shout at it - and it carries its reason in a title so it is not a mystery mark. */
.unsure{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line2);border-radius:var(--pill);padding:1px 7px;
  margin-left:6px;white-space:nowrap;text-decoration:none;vertical-align:1px}
/* The other shops' prices. A card that says "3 shops" names a spread without showing it. */
.poffers{list-style:none;margin:10px -4px 0;padding:8px 4px 0;border-top:1px solid var(--line2);
  display:flex;flex-direction:column;gap:4px}
.poffers li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  font-size:12px;color:var(--muted);min-width:0}
.poffers li>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poffers b{font-weight:600;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.poffers .mo{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;justify-content:flex-end}
.pcard .go{position:relative;z-index:2;width:34px;height:34px;border-radius:50%;background:var(--surface2);
  display:grid;place-items:center;flex:none}
.pcard .go svg{width:15px;height:15px;stroke:var(--brand);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pcard:hover .go{background:var(--brand)}
.pcard:hover .go svg{stroke:var(--brand-ink)}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}
.empty b,.empty .emptyh{display:block;color:var(--text);font-size:18px;font-weight:700;margin:0 0 6px;line-height:1.3}

/* ================= product page — bold panel ================= */
.crumb a:hover{color:var(--brand)}

.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;margin-top:30px}
.panel-c{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow-s)}
.panel-c h3{font-size:1.0625rem;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:6px}
.panel-c h3 i{width:7px;height:7px;border-radius:2px;background:var(--brand);display:block}
.kv{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:0.9375rem;align-items:baseline}
.kv:last-child{border-bottom:0}
/* A hard 44% column is narrower than a single Armenian word: "հաճախականություն" alone is wider
   than 118px, so the label ran out of its own box. The label takes the room it needs, gives the
   rest back when it is short, and breaks the word when even that is not enough. */
.kv dt{color:var(--muted);flex:1 1 44%;min-width:0;overflow-wrap:anywhere;font-size:0.875rem}
.kv dd{margin:0;font-weight:600;text-align:right;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.simrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:14px}
.sim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;
  align-items:center;gap:12px;transition:border-color .15s,box-shadow .15s}
.sim:hover{border-color:var(--line2);box-shadow:var(--shadow-m)}
.sim .t{background:var(--shot);border-radius:var(--r-sm);width:clamp(44px,4.5vw,58px);height:clamp(52px,5.2vw,68px);display:block;flex:none;padding:5px;overflow:hidden}
.sim b{display:block;font-size:0.9375rem;font-weight:700;line-height:1.3}
.sim span{font-size:0.875rem;color:var(--brand);font-weight:700}
h2.sh{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:48px}
.lede{color:var(--body);font-size:1.0625rem;max-width:70ch;margin:26px 0 0}
h2.sh em{font-style:normal;color:var(--brand);padding:0;font-size:13px;margin-left:8px}

/* ---- product stage (Roastery): the name is the page, the phone stands against it ---- */
.pstage{margin-top:6px}
.pmeta{display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-bottom:12px}
/* 8.5vw peaking at 96px ran the title off the side of a wide window and at browser zoom */
.pname{font-size:clamp(30px,5vw,58px);font-weight:800;letter-spacing:-.04em;line-height:1.02;
  overflow-wrap:anywhere}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);gap:44px;align-items:stretch;margin-top:14px}
/* Full width of its column: the cutouts are 1200px and the column tops out around 800, so
   the big photo the page was designed around is still a downscale, never an upscale. */
/* No photo yet. NOPHOTO is a 64px glyph; object-fit:contain happily scales it to fill a 340px
   hero and a 190px card, where it reads as a BROKEN image rather than a missing one. Pin it to
   its own size wherever it lands and let the rest of the box stay empty. */
img[src^="data:image/svg"][src]{width:64px;height:64px;object-fit:none;margin:auto;opacity:.5}
.pshotwrap{position:relative;align-self:start;aspect-ratio:1;min-height:340px}
.shot-note{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:2;white-space:nowrap;
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--body);background:var(--surface);
  border:1px solid var(--line2);border-radius:var(--pill);padding:5px 11px}
@media (max-width:760px){.pshotwrap{position:relative}.shot-note{bottom:0}}
.pshotwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 30px 46px rgba(20,19,20,.20))}
.pside{padding-top:8px}
/* The options column ran 250 px below the photo, most of it the "compare with" cards. They sit
   under the photo instead, side by side, and the options column spans both rows - so the photo,
   the options and the cards finish level rather than leaving a hole under the picture. */
/* from 901px: at 900 and under the page is one column (see max-width:900 below) */
@media (min-width:901px){
  .pgrid{grid-template-rows:auto 1fr}
  .pshotwrap{grid-column:1;grid-row:1}
  .pside{grid-column:2;grid-row:1/span 2}
  .pgrid>.cwith{grid-column:1;grid-row:2;align-self:start;margin-top:0}
}
.og{border-top:1px solid var(--line2);padding:13px 0}
/* the first group sits right under the title: a rule above it separates nothing */
.pside>.og:first-child{border-top:0;padding-top:4px}
.og>label{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.og>label b{color:var(--text);font-family:var(--ui);font-size:0.9375rem;font-weight:700;letter-spacing:0;text-transform:none}
.cs{display:flex;gap:9px;flex-wrap:wrap}
.cs button{width:34px;height:34px;border-radius:50%;padding:0;background:var(--c);cursor:pointer;
  border:1.5px solid var(--line2);transition:transform .12s,box-shadow .12s}
.cs button:hover{transform:scale(1.07)}
.cs button.on{border-color:var(--text);box-shadow:0 0 0 3px var(--line2);box-shadow:0 0 0 3px color-mix(in oklab,var(--text) 14%,transparent)}
.bs{display:flex;gap:8px;flex-wrap:wrap}
.bs button{height:40px;padding:0 16px;border-radius:var(--pill);cursor:pointer;font-size:0.844rem;font-weight:600;
  border:1.5px solid var(--line2);background:var(--surface);color:var(--text);transition:background .12s,border-color .12s}
.bs button:hover{border-color:var(--text)}
.bs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
/* A configuration the maker sells that no Armenian shop stocks. Struck through and faded rather
   than removed: the reader needs to see the option exists AND that nobody here has it. Still
   clickable, because its specs are still worth reading. */
.bs button.na{color:var(--muted);border-color:var(--line);text-decoration:line-through;
  text-decoration-thickness:1.5px;opacity:.62}
.bs button.na.on{background:var(--muted);color:var(--bg);border-color:var(--muted);opacity:.8}
.cs button.na{opacity:.42;filter:grayscale(.55)}
.cs button.na::after{content:'';position:absolute;inset:auto 0;top:50%;height:1.5px;
  background:var(--muted);transform:rotate(-45deg)}
.cs button{position:relative}
.pprice2{border-top:1px solid var(--line2);padding:18px 0 4px}
.pprice2 .lb{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
/* > b, not any b: the price rail's "save up to" line lives inside .pprice2 too, and its <b>
   was inheriting 44px and display:block - a giant orange number on its own line. */
.pprice2 .pp-row>b{display:block;font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1.05;margin-top:8px}
.pprice2 .shopn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.pcta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
/* "Compare with": the newer and the previous model, photo + name + price. Two across wherever two
   cards of ~200 px fit, one above the other where they do not - auto-fit decides, so no width is
   hard-coded and nothing can push the column wider than the screen. min-width:0 lets a long name
   wrap inside its card instead of stretching it. */
.cwith{margin-top:22px}
.pgrid>.cwith .cwrow{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}
.cwith h3{margin:0 0 10px;font-family:var(--mono);font-size:0.75rem;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
.cwrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:10px}
.cw{display:flex;align-items:flex-start;gap:12px;min-width:0;padding:10px 12px;border:1.5px solid var(--line2);
  border-radius:14px;background:var(--surface);color:var(--text);text-decoration:none;
  transition:border-color .12s}
.cw:hover,.cw:focus-visible{border-color:var(--text)}
.cw img{width:64px;height:64px;object-fit:contain;flex:none;align-self:center}
/* text top-aligned: the role, name and price lines sit level across the row of cards */
.cwt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.cwt em{font-style:normal;font-size:0.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cwt b{font-size:0.9375rem;font-weight:600;overflow-wrap:anywhere}
.cwt .num{font-size:0.875rem;font-weight:700}
.cwt .cwd{font-size:0.75rem;font-weight:700}
/* cheaper than the phone you are on reads green, dearer reads red - the trade-off before the click */
.cwt .cwd.dn{color:var(--good)}.cwt .cwd.up{color:var(--bad)}
.nf{margin:40px 0 24px}.nf p{margin:6px 0 16px;color:var(--muted)}
.nfcats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px;align-items:center}
.nfcats span{width:100%;color:var(--muted);font-size:0.8125rem}
.ctable .c.cprice .cpgo{font-size:0.8125rem;font-weight:600;color:var(--brand);margin-top:4px}
.ccol .cname{color:inherit;text-decoration:none}.ccol .cname:hover b{text-decoration:underline}

/* the spread rail, redrawn as a hairline on cream */
/* ---- price block: one saving line, and the spread between shops drawn to scale ---- */
.pp-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.pp-at{font-weight:700;color:var(--body)}
.pp-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rail2{position:relative;height:30px;margin:14px 9px 0;max-width:342px}
.rail2 .ln{position:absolute;left:0;right:0;top:14px;height:2px;border-radius:1px;background:linear-gradient(90deg,var(--good),var(--line2) 40%,var(--brand))}
.rd{position:absolute;top:15px;transform:translate(-50%,-50%);min-width:12px;height:12px;padding:0;border-radius:var(--pill);
  border:2px solid var(--surface);background:var(--muted);cursor:pointer;display:grid;place-items:center;color:var(--bg)}
.rd.cl{min-width:26px;height:19px;padding:0 5px;background:var(--text)}
.rd.best{background:var(--good)} .rd.top{background:var(--brand)}
.rd .rc{font:700 10px/1 var(--mono)}
.rd .rt{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
  border-radius:var(--r-md);padding:7px 10px;font:600 12px/1.45 var(--ui);white-space:nowrap;text-align:left;
  box-shadow:var(--shadow-m);opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:3}
.rd.l .rt{left:-6px;transform:none} .rd.r .rt{left:auto;right:-6px;transform:none}
.rd:hover .rt,.rd:focus-visible .rt{opacity:1}
/* the shop labels are hidden until hovered but still take up width: on a fold's cover screen a
   long one ran past the edge, so there they wrap (after the rule above, so they win) */
@media (max-width:360px){.rd .rt{white-space:normal;width:max-content;max-width:40vw}}
.ends2{display:flex;justify-content:space-between;gap:12px;max-width:360px;margin-top:6px;font-size:12px;color:var(--body)}
.ends2 span{display:grid}
.ends2 span:last-child{text-align:right}
.ends2 b{font-size:12.5px;color:var(--text)}
@media (max-width:900px){
  .pgrid{grid-template-columns:1fr;gap:18px}
  .pshotwrap{position:static;display:grid;place-items:center;min-height:0;order:-1}
  .pshotwrap img{position:static;width:auto;height:auto;max-width:100%;max-height:260px}
  .rail2,.ends2{max-width:none}
}

/* where to buy */
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;
  display:flex;flex-direction:column;gap:4px;transition:border-color .14s,box-shadow .14s,transform .14s}
.oc:hover{border-color:var(--brand);box-shadow:var(--shadow-m);transform:translateY(-2px)}
.oc .s{font-weight:700;font-size:0.97rem}
.oc .v{font-size:12.5px;color:var(--muted)}
.oc .p{font-size:23px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.oc .d{font-size:12.5px;font-weight:700;color:var(--muted)}
.oc .d.b{color:var(--good)}

@media (max-width:560px){
  /* Armenian button labels are long; let them stack and wrap instead of being
     clipped by the panel's overflow:hidden */
  .pcta{flex-direction:column;align-items:stretch}
  .pcta .btn{width:100%}
  .btn{white-space:normal;height:auto;min-height:46px;padding:11px 18px;line-height:1.25;text-align:center}
}
/* ================= compare ================= */
.cwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-s);
  margin-top:18px;overflow:hidden;overflow:clip}
.chead{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:var(--cols)}
.chead .pad{border-right:1px solid var(--line)}
@media (max-width:760px){.chead .pad,.cphotos .pad{display:none}}
.ccol{padding:11px 10px;text-align:center;position:relative;border-right:1px solid var(--line)}
/* The photos are their own row ABOVE the sticky bar, so they scroll out of view the way any
   other content does. Animating them in and out of the sticky header meant resizing a
   sticky element that sits on top of an 80-row grid, and every frame of that is a full
   relayout - which is what made scrolling stall. Nothing here animates, so nothing can stutter. */
.cphotos{display:grid;grid-template-columns:var(--cols);border-bottom:1px solid var(--line);background:var(--surface)}
.cphotos .pad{border-right:1px solid var(--line)}
.cphotos .c{padding:16px 10px;border-right:1px solid var(--line);display:grid;place-items:center;position:relative}
.cphotos .c:last-child{border-right:0}
.cphotos img{max-height:clamp(84px,13vw,170px);width:auto;max-width:100%}
.ccol:last-child{border-right:0}
.ccol b,.ccol .cname{font-size:0.8125rem;font-weight:700;display:block;line-height:1.25;color:var(--text)}
.ccol .cname{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;overflow-wrap:anywhere}
.ccol .cname:hover{text-decoration-color:var(--brand);color:var(--brand)}
/* on the photo's corner, where it cannot sit on top of the name */
.cphotos .x{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);color:var(--muted);cursor:pointer;line-height:1;font-size:13px;display:grid;place-items:center}
.cphotos .x:hover{color:var(--hot);border-color:var(--hot)}
.ctable .c.best{color:var(--good);font-weight:800}
.ctable .c.cprice{flex-direction:column;gap:2px}
.ctable .c.cprice b{font-size:0.95rem;white-space:nowrap}
.ctable .c.cprice span{font-size:11.5px;font-weight:500;color:var(--muted)}
.ctable .c.cprice.best{background:var(--good-soft)}
.ctable{display:grid;grid-template-columns:var(--cols)}
.ctable .grp{grid-column:1/-1;background:var(--surface2);padding:9px 16px;font-size:12.5px;font-weight:800;
  letter-spacing:.03em;text-transform:none;color:var(--body);border-block:1px solid var(--line)}
.ctable .k,.ctable .c{padding:11px 12px;font-size:0.844rem;border-bottom:1px solid var(--line);min-height:44px;
  display:flex;align-items:center}
.ctable .k{color:var(--muted);font-size:12.5px;justify-content:flex-end;text-align:right;border-right:1px solid var(--line)}
.ctable .c{font-weight:600;justify-content:center;text-align:center;border-right:1px solid var(--line)}
.ctable .c:last-child{border-right:0}
.ctable .c.worse{color:var(--bad);font-weight:700}

/* ---- compare: the add button and the picker it opens ---- */
/* The refused-pick message, all that is left of the compare bar. Fixed, centred, fades. */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;margin:0;
  background:var(--text);color:var(--bg);padding:11px 20px;border-radius:var(--pill);
  font-size:0.9375rem;font-weight:600;box-shadow:var(--shadow-m);opacity:0;transition:opacity .25s ease;
  max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}
.addbtn{display:inline-flex;align-items:center;gap:7px}
/* The comparison arrives rather than appearing: columns and rows fade up together. Opacity and
   a small lift, so reduced motion keeps the fade and drops the movement. */
.cwrap .cphotos,.cwrap .chead,.cwrap .ctable{animation:cmpIn .34s cubic-bezier(.2,.7,.3,1) both}
.cwrap .chead{animation-delay:.04s}
.cwrap .ctable{animation-delay:.08s}
@keyframes cmpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* the rule above is killed under reduced motion, which would leave opacity:0 forever */
@media (prefers-reduced-motion:reduce){
  .cwrap .cphotos,.cwrap .chead,.cwrap .ctable{animation:none;opacity:1;transform:none}
}
.addslot{width:100%;min-height:84px;border:1.5px dashed var(--line2);border-radius:var(--r-md);
  background:none;cursor:pointer;display:grid;place-items:center;transition:border-color .2s ease,background .2s ease}
.addslot:hover{border-color:var(--brand);background:var(--brand-soft)}
.addslot svg{width:30px;height:30px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round}
.addslot:hover svg{stroke:var(--brand)}
.addlbl{color:var(--muted);font-weight:600}
.addbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
/* Opacity carries the fade, so it survives the reduced-motion rule; the small lift is the part
   that rule drops. Hiding is delayed in JS by the same 200ms, or the fade never runs. */
.cmodal{position:fixed;inset:0;z-index:60;background:rgba(12,16,24,.55);
  display:grid;place-items:center;padding:20px;opacity:0;transition:opacity .2s ease}
.cmodal.on{opacity:1}
.cmbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  width:min(560px,100%);max-height:min(80vh,640px);overflow:auto;padding:22px;position:relative;
  box-shadow:var(--shadow-m);transform:translateY(8px);transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.cmodal.on .cmbox{transform:none}
.cmbox h2{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:0 0 14px}
.cmx{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;
  background:var(--surface2);color:var(--muted);font-size:19px;cursor:pointer}
.cmx:hover{background:var(--brand);color:var(--brand-ink)}
#cmq{width:100%;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:var(--pill);
  background:var(--bg);color:var(--text);margin-bottom:12px}
.cmres{display:grid;gap:4px}
.cmrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;
  width:100%;text-align:left;padding:7px 9px;border:0;border-radius:var(--r-md);
  background:none;color:inherit;cursor:pointer;transition:background .16s ease}
.cmrow:hover{background:var(--surface2)}
.cmrow img{width:44px;height:44px;object-fit:contain}
.cmrow b{display:block;font-size:0.9375rem;font-weight:700}
.cmrow i{font-style:normal;font-size:0.8125rem;color:var(--muted)}
.cmnone{color:var(--muted);font-size:0.875rem;padding:10px 2px}
.cmnow{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.cmlbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cmnow .cmrow{cursor:default}
.cmnow .cmrow:hover{background:none}
.cmnow .x{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;
  color:var(--muted);cursor:pointer;font-size:17px}
.cmnow .x:hover{border-color:var(--bad);color:var(--bad)}
.pcard{cursor:pointer}
@media (max-width:760px){
  .chead,.ctable,.cphotos{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
  .ctable .k{grid-column:1/-1;justify-content:flex-start;text-align:left;border-right:0;border-bottom:0;
    padding-bottom:2px;padding-top:12px;font-weight:700;color:var(--body)}
  .ctable .c{font-size:0.8125rem;padding:6px 8px 11px}
}
.cbar{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;margin-top:20px}
/* Two groups, not one row with a stretchy spacer: when the row ran out of width the spacer
   collapsed and the title, the counters and the controls crowded into each other. Each group
   wraps as a unit, so they stack instead of overlapping. */
.cbar-l,.cbar-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.cbar-l h1{overflow-wrap:anywhere;min-width:0;max-width:100%}
.cbar-r{margin-left:auto}
.sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:0.875rem;font-weight:600;user-select:none}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .tr{width:40px;height:23px;border-radius:999px;background:var(--line2);position:relative;transition:background .16s;flex:none}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:var(--shadow-s)}
.sw input:checked+.tr{background:var(--brand)}
.sw input:checked+.tr::after{transform:translateX(17px)}
.sw input:focus-visible+.tr{outline:2px solid var(--brand);outline-offset:2px}
.hide-same .row-same{display:none}

footer.ft{margin-top:56px;border-top:1px solid var(--line);background:var(--surface)}
footer.ft .shell{padding-block:26px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;font-size:0.8125rem;color:var(--muted)}
/* What this site is, on every page. It takes the whole width so it reads as a statement rather
   than as one more item in the row, and it sits before the links so the links stay at the end. */
.ft-note{flex-basis:100%;order:1;font-size:0.75rem;line-height:1.5;color:var(--muted)}
.ft-links{display:flex;gap:18px;margin-left:auto;order:2}
.ft-links a{color:var(--body);border-bottom:1px solid transparent;padding-block:2px}
.ft-links a:hover{color:var(--text);border-bottom-color:var(--line2)}
@media (max-width:640px){.ft-links{margin-left:0;width:100%;border-top:1px solid var(--line);padding-top:14px}}
/* a plain page of text: privacy, contact */
/* ---- blog: an index of cards (the newest one wider) and a readable article column ---- */
.bl-hd{margin:22px 0 22px}
.bl-hd h1{font-size:clamp(32px,5vw,56px);font-weight:800;letter-spacing:-.045em;line-height:1}
.bl-hd p{color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:10px}
.bl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:40px}
.bl-card{display:grid;align-content:start;gap:10px;padding:22px;border-radius:var(--r-xl);background:var(--surface);
  border:1px solid var(--line);color:var(--text);text-decoration:none;transition:border-color .15s,transform .2s cubic-bezier(.2,.8,.2,1)}
.bl-card:hover{border-color:var(--text);transform:translateY(-2px)}
.bl-card.first{grid-column:1/-1;background:linear-gradient(135deg,var(--surface) 55%,var(--brand-soft));padding:28px}
.bl-card h2{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.bl-card.first h2{font-size:clamp(24px,3vw,34px);max-width:26ch}
.bl-card p{color:var(--body);font-size:.95rem;line-height:1.6;max-width:70ch}
.bl-d{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--brand)}
.bl-go{font-weight:700;font-size:.9rem;color:var(--brand);margin-top:4px}
.post{max-width:68ch;margin:22px 0 10px}
.post h1{font-size:clamp(28px,4.4vw,48px);font-weight:800;letter-spacing:-.04em;line-height:1.08;margin:10px 0 16px;overflow-wrap:anywhere}
.post-lead{font-size:1.18rem;line-height:1.6;color:var(--text);margin:0 0 26px;padding-bottom:22px;border-bottom:1px solid var(--line2)}
.post h2{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin:30px 0 10px}
.post p{color:var(--body);font-size:1.02rem;line-height:1.75;margin:0 0 14px}
.post ul{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:8px}
.post li{position:relative;padding-left:20px;color:var(--body);line-height:1.65}
.post li::before{content:'';position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.post-cta{margin-top:26px}
.bl-im{display:block;margin:-22px -22px 6px;border-radius:var(--r-xl) var(--r-xl) 0 0;overflow:hidden;aspect-ratio:16/9;background:var(--shot)}
.bl-card.first .bl-im{margin:-28px -28px 8px}
.bl-im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.bl-card:hover .bl-im img{transform:scale(1.03)}
.post-cover{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r-xl);margin:0 0 26px;background:var(--shot)}
.post-fig{margin:22px 0 24px}
.post-fig img{display:block;width:100%;height:auto;border-radius:var(--r-lg);background:var(--shot)}
.post-fig figcaption{font-size:.85rem;color:var(--muted);margin-top:8px}
@media (max-width:640px){.bl-im,.bl-card.first .bl-im{margin:-18px -18px 6px}}
/* the newest article on a wide screen: picture beside the text, not a 675 px banner above it */
@media (min-width:900px){
  .bl-card.first{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:32px;align-items:center;padding:0 32px 0 0;overflow:hidden}
  .bl-card.first .bl-im{grid-column:1;grid-row:1/span 4;margin:0;border-radius:0;height:100%;aspect-ratio:auto;min-height:340px}
  .bl-card.first > :not(.bl-im){grid-column:2}
  .bl-card.first > time{margin-top:28px}.bl-card.first > .bl-go{margin-bottom:28px}
}
.post-src{font-size:.85rem!important;color:var(--muted)!important;margin-top:22px!important;line-height:1.7!important}
.post-src a{color:var(--body);border-bottom:1px solid var(--line2);text-decoration:none}
.post-src a:hover{color:var(--brand)}
.post-more{max-width:68ch;margin:30px 0 40px}
.bl-list{display:grid;border-top:1px solid var(--line)}
.bl-list a{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600}
.bl-list a:hover span{color:var(--brand)}
.bl-list time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
@media (max-width:640px){.bl-card,.bl-card.first{padding:18px}.bl-list a{grid-template-columns:1fr;gap:2px}}
.doc{max-width:62ch;margin-top:26px}
.doc h1{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:0 0 18px}
.doc p{color:var(--body);font-size:1rem;line-height:1.7;margin:0 0 14px}
.doc a{color:var(--brand);border-bottom:1px solid var(--line2)}
footer.ft b{color:var(--text);font-weight:700}

/* ---- real shop offers ---- */
.offers-h{font-size:0.875rem;font-weight:700;margin-top:20px;display:flex;align-items:center;gap:8px}
.offers-h b{background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 9px;font-size:12px}
.stores{margin-top:6px;border-top:1px solid var(--line)}
a.store{text-decoration:none;transition:background .12s}
a.store:hover{background:var(--surface2)}
a.store:hover .nm{color:var(--brand)}
.store .nm em{font-style:normal;font-weight:600;font-size:11.5px;color:var(--muted);background:var(--surface2);
  border-radius:6px;padding:2px 6px;margin-left:6px}
.pprice s{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.07em;text-decoration:none;text-transform:uppercase}


/* every product thumbnail is presented in a fixed box and letterboxed the same way,
   so a wide front+back render and a narrow single-phone render read at the same scale */
/* Product thumbnails: the box owns the size, the image only fits inside it.
   max-* are belt-and-braces so a tall cutout can never spill over the table. */
.pshot img,.sim .t img,.ccol .t img{
  width:100%;height:100%;max-width:100%;max-height:100%;
  object-fit:contain;object-position:center}
/* One photo per card. A colour dot swaps it: out, then in, never two cutouts at once. */
.pshot .pimg{transition:opacity .12s ease}
.pshot .pimg.out{opacity:0}
/* A vertical column on the photo's left edge: clear of the product, clear of the + on the right. */
.cdots{position:absolute;left:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:0;z-index:2}
.cdot{width:24px;height:24px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.cdot::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c,#999);
  box-shadow:0 0 0 1px rgba(0,0,0,.18),0 0 0 2px var(--surface)}
.cdot[aria-pressed="true"]::before{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}
.cdot:hover::before{transform:scale(1.15)}
.cdots .cmore{font:600 10px var(--mono);color:var(--muted);margin-top:2px}
@media (pointer:coarse){.cdot{width:30px;height:30px}}
/* a phone card's photo is 140px tall: the column grows up from the bottom, clear of the badge */
/* not on phones: two cards across leave a ~150 px photo, and a column of dots covered half of it */
@media (max-width:640px){.cdots{display:none}}
.pshot,.sim .t,.ccol .t{overflow:hidden}
/* the compare header must grow with its content, never clip the name onto the photo */
.ccol{min-width:0;height:auto}
.ccol b{overflow-wrap:anywhere}


/* touch sizing: fingers need more than the desktop hit areas */
@media (max-width:700px){
  .cs button{width:40px;height:40px}
  .cphotos .x{width:34px;height:34px;font-size:18px;top:4px;right:4px}
  .crumb{gap:6px;padding:16px 0 4px}
  .crumb a{padding:6px 2px}
  .chip{height:36px}
  .oc{padding:16px}
  .pname{letter-spacing:-.045em}
  .pprice2 .pp-row>b{font-size:32px}
  .rail2,.ends2{max-width:none}
}
@media (max-width:420px){
  .ocards{grid-template-columns:1fr}
}
/* below this the two-up cards get too cramped to read */
@media (max-width:330px){.grid{grid-template-columns:1fr}}


/* ---- compare: the differences are the whole point, so make them read first ---- */
/* the row is no longer tinted end to end - only the losing VALUE is marked */
.ctable .k.row-diff{color:var(--text);font-weight:700}
.ctable .k.row-diff::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);
  margin-left:8px;flex:none}
.ctable .row-same{color:var(--muted)}
.ctable .c.row-same{font-weight:500}
.dcount,.scount{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;
  font-size:0.8125rem;font-weight:700}
.dcount{background:var(--brand-soft);color:var(--brand)}
.dcount i{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.scount{background:var(--surface2);color:var(--muted)}

/* ---- where to buy, as a ranked list ---- */
.olist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden}
.olist li+li{border-top:1px solid var(--line)}
.orow{display:grid;grid-template-columns:34px minmax(0,1.1fr) minmax(0,1.4fr) minmax(112px,auto) 128px 22px;
  gap:14px;align-items:center;padding:15px 18px;transition:background .12s}
.orow:hover{background:var(--surface2)}
.orow .rk{font-size:12px;color:var(--muted);font-weight:700}
.orow .sh{font-weight:700;font-size:0.97rem;overflow-wrap:anywhere}
.orow .vr{font-size:0.8125rem;color:var(--muted);overflow-wrap:anywhere}
.orow .pr{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;text-align:right}
/* The difference column: one pill of one size on every row, so "Best price" and "+16 000" line up
   as a column instead of reading as two different kinds of thing. */
.orow .od{text-align:center;font-size:12.5px;font-weight:700;line-height:1.2;padding:6px 10px;border-radius:var(--pill);white-space:nowrap;
  background:var(--surface2);background:color-mix(in srgb,var(--bad) 9%,transparent);color:var(--bad)}
.orow .ar{color:var(--muted);font-size:15px}
.orow:hover .ar{color:var(--brand-2)}
.orow.best{background:var(--good-soft)}
.orow.best .od{background:var(--good);color:var(--bg)}
.orow.best .rk{color:var(--good)}
.orow.best:hover{background:var(--good-soft)}
/* A price with no page behind it. It still belongs on the list - somebody read it off a shelf -
   but it must not look like something to click, so it loses the pointer and the hover response. */
.orow.nolink{cursor:default}
.orow.nolink:hover{background:transparent}
.orow.nolink.best:hover{background:var(--good-soft)}
@media (max-width:760px){
  .orow{grid-template-columns:28px 1fr auto;row-gap:3px;padding:13px 14px}
  .orow .vr{grid-column:2/-1;order:3}
  .orow .od{grid-column:2/-1;order:4;justify-self:start;padding:3px 9px}
  .orow .ar{display:none}
}



/* ---- price history ---- */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px 12px;margin-top:10px}
.hist-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.hist-top>b{font-size:26px;font-weight:800;letter-spacing:-.03em}
.hp{font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:var(--pill)}
.hp.good{background:var(--good-soft);color:var(--good)}
.hp.warn{background:var(--brand-soft);color:var(--brand)}
.hist-sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.hist-c{position:relative;margin-top:8px;touch-action:pan-y}
