.hist-c svg{display:block;width:100%;height:210px;overflow:visible;cursor:crosshair}
.hist-c svg:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:8px}
.hist .hg{stroke:var(--line);stroke-width:1}
.hist .ht{fill:var(--muted);font:500 10.5px var(--mono)}
.hist .harea{fill:var(--brand);opacity:.08}
.hist .hl{fill:none;stroke:var(--brand);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.hist .hgap{fill:none;stroke:var(--brand);stroke-width:1.5;stroke-dasharray:3 4;opacity:.6}
.hist .hlow{fill:var(--good);stroke:var(--surface);stroke-width:2}
.hist .hnow{fill:var(--brand);stroke:var(--surface);stroke-width:2}
.hist .hlab{font:700 11.5px var(--ui)}
.hist .hlab.good{fill:var(--good)}
.hist .hx{stroke:var(--text);stroke-width:1;stroke-dasharray:2 3;opacity:.45}
.hist .hd{fill:var(--text);stroke:var(--surface);stroke-width:2}
.hist-tip{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 12px));background:var(--text);color:var(--bg);
  border-radius:var(--r-md);padding:7px 10px;font-size:12px;line-height:1.35;white-space:nowrap;display:grid;gap:1px;box-shadow:var(--shadow-m);z-index:2}
.hist-tip b{font-size:14px}
.hist-tip.below{transform:translate(-50%,14px)}
.hist-tip .dn,.hist-tip .up{font-weight:700}

/* ---- expandable offer list + all-offers page ---- */
.olist .more{display:none}
.olist.all .more{display:list-item}
.expand{margin-top:10px;height:42px;padding:0 18px;border-radius:var(--pill);border:1px solid var(--line2);
  background:var(--surface);color:var(--text);font-weight:600;font-size:0.875rem;cursor:pointer}
.expand:hover{border-color:var(--text)}
.expand b{color:var(--brand)}
.allofflink{margin-top:10px;font-size:0.875rem}
.allofflink a{color:var(--brand);font-weight:700;border-bottom:1px solid currentColor;padding-bottom:1px}
.ofhead{display:flex;align-items:center;gap:18px;margin:14px 0 6px}
.ofhead .t{width:76px;height:92px;background:var(--shot);border-radius:var(--r-md);padding:8px;flex:none;overflow:hidden}
.ofhead .t img{width:100%;height:100%;object-fit:contain}
.ofhead h1{font-size:clamp(24px,3.4vw,38px);font-weight:800;letter-spacing:-.035em}
.ofsub{color:var(--muted);font-size:0.875rem;margin-top:5px}
.ofsub b{color:var(--text)}
.offilters{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.ofg{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.ofl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  width:110px;flex:none}
.ofc{height:34px;padding:0 13px;border-radius:var(--pill);border:1px solid var(--line2);background:var(--surface);
  font-size:0.844rem;font-weight:600;cursor:pointer}
.ofc:hover{border-color:var(--text)}
.ofc.on{background:var(--text);color:var(--bg);border-color:var(--text)}
/* The colour row on the all-offers page is the same swatch the product page uses, so the two
   pages ask the question the same way. .cs already draws and sizes them; the only difference is
   that these sit in a filter row beside an "All" chip, so they need its 34px height and its gap. */
.ofcs{display:inline-flex;gap:7px;flex-wrap:wrap;align-items:center}
.ofcs button{width:34px;height:34px}
@media (max-width:600px){.ofl{width:100%}}

/* stock status on each offer */
.orow .ins,.orow .oos,.orow .unk{display:block;font-style:normal;font-size:0.6875rem;font-weight:600;margin-top:2px}
.orow .ins{color:var(--good)}
/* Out of stock was muted grey - the quietest thing on the row, under a price you cannot buy.
   It is the one fact that makes the rest of the row useless, so it is the loudest. */
.orow .oos{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:var(--pill);
  background:var(--bad);color:#fff;font-size:0.75rem;font-weight:800;letter-spacing:.02em;
  text-transform:uppercase}
.orow .unk{color:var(--muted);font-weight:500}
/* and the row itself steps back: a price nobody can take should not read as an offer */
.orow:has(.oos){opacity:.62}
.orow:has(.oos) .pr{text-decoration:line-through;text-decoration-thickness:2px}

/* return control */
.navrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 2px}
.backbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--pill);
  border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:0.875rem;flex:none}
.backbtn:hover{border-color:var(--text);background:var(--surface2)}
.backbtn span{font-size:1rem;line-height:1}
.navrow .crumb{padding:0}

/* Reduced motion is about things MOVING, not about things fading: a cross-fade has no
   direction and no displacement. So keyframe animations and every transform transition still
   go, and opacity is the one property left free - which is what makes the hero and the card
   colour changes dissolve rather than cut for anyone with the setting on. */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-property:opacity!important}
  /* Two exceptions, because reduced motion is about MOVEMENT. A price changing colour and a
     card fading in move nothing at all, and they are the only signal that the number you just
     changed the configuration for is a different number. Blanketing them out left the product
     page silent on the one interaction it exists for. */
  .fx-flash{animation:fxflash .8s ease-out!important}
  .grid.gridin>*{animation:gridinFade .2s ease both!important}
}
/* ================= a finger, not a mouse pointer =================
   Measured at 375 px: the plus that adds a card to a comparison was 26x26, the language buttons
   38x25, the theme switch and the page numbers 34x34, and the only part of a card that opened
   the product was the 22 px line of its title. A fingertip covers about 9 mm, which is why 44 px
   is the figure everyone settles on.

   Two different fixes, because the controls have two different problems. The ones that look
   right at the size they are drawn keep their size and get a bigger TARGET - an invisible 44 px
   square centred on them. The ones that are simply short get taller. Both only under
   (pointer: coarse), so nothing about the desktop layout moves. */
@media (pointer: coarse){
  .ctabs .ctab, .fmore, .pg, .toggle, .fbar summary, .nav a, #langs button,
  .ft-links a, .topnav .logo, .fapply button,
  .backbtn, .bs button, .cchip{min-height:44px}
  /* the pager was 44 tall and 34 wide - a target is both measurements or neither */
  .pager .pg{min-width:44px}
  /* Only the thumb of a range takes the pointer, and an 18 px thumb is the one control on this
     site you have to DRAG. Bigger thumb, taller strip, track re-centred on both. */
  .rng{height:30px}
  .rng .track,.rng .fill{top:14px}
  .rng input{top:1px;height:28px}
  .rng input::-webkit-slider-thumb{width:26px;height:26px}
  .rng input::-moz-range-thumb{width:24px;height:24px}
  .fav::after, .srch-go::after, .th::after, #langs button::after{
    content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;
    transform:translate(-50%,-50%);border-radius:50%}
  .th, #langs button{position:relative}
  /* The whole card opens the product, not just the title. .pcard is already positioned, and the
     plus is lifted above the stretched link so it still adds to the comparison instead. */
  .pcard h3 a::after{content:'';position:absolute;inset:0;z-index:1}
  .fav{z-index:3}
}

  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;background:var(--bg);
    margin:10px -14px 0;padding:8px 14px;border-bottom:1px solid var(--line)}
  .mbar-f{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line2);
    background:var(--surface);color:var(--text);font:inherit;font-weight:700;font-size:0.875rem;cursor:pointer}
  .mbar-f svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .mbar-f b{min-width:19px;height:19px;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-size:11px;display:inline-grid;place-items:center}
  .mbar-n{margin-left:auto;color:var(--muted);font-size:13px}
  .fbar{display:none}
  html.fs-open{overflow:hidden}
  html.fs-open .fscrim{display:block;position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:89}
  html.fs-open .fbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:90;margin:0;max-height:88vh;overflow-y:auto;
    background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px -10px rgba(0,0,0,.35);padding:0 16px;
    animation:sheetin .28s cubic-bezier(.2,.8,.2,1)}
  html.fs-open .fbar.folded > *{display:block}
  html.fs-open .fbar > .fsheet-hd,html.fs-open .fbar > .fsheet-ft{display:flex}
  html.fs-open .fbar .spacer,html.fs-open .fbar > .fmore{display:none}
  .fbar .fsheet-hd{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2;
    background:var(--surface);padding:14px 0 10px;border-bottom:1px solid var(--line);font-size:17px}
  .fsheet-hd button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--text);font-size:20px;line-height:1;cursor:pointer}
  html.fs-open .fdrop{display:block;border-bottom:1px solid var(--line);padding:6px 0}
  html.fs-open .fdrop>summary{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:0 2px;height:44px;color:var(--text)}
  html.fs-open .fdrop.on>summary,html.fs-open .fdrop[open]>summary{background:none;color:var(--text)}
  html.fs-open .fdrop .panel{position:static;max-height:none;min-width:0;border:0;box-shadow:none;padding:0 0 8px;animation:none;overflow:visible}
  html.fs-open .fapply{display:none}

  .fbar .fsheet-ft{display:flex;gap:10px;position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--line);margin-top:6px}
  .fsheet-ft button{height:46px;border-radius:var(--pill);font:inherit;font-weight:700;cursor:pointer}
  .fsheet-ft .fsclr{padding:0 18px;border:1px solid var(--line2);background:none;color:var(--text)}

@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
