<!doctype html>
<html lang="hy"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MyCatalog</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Armenian:wght@400;500;600;700;800&display=swap">
<style>
/* ================= tokens ================= */
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --surface2:#F1EBE1; --shot:#EFE9DF;
  --text:#161C28; --body:#4A5262; --muted:#828B9A;
  --line:#E6DFD4; --line2:#D9D0C2;
  --brand:#9E2B25; --brand-ink:#FFFFFF; --brand-soft:#F6E4E1; --brand-2:#7E1F1B;
  --apricot:#F0A04B; --apricot-soft:#FBEBD7;
  --plum:#3E6B8A; --plum-soft:#E7EEF3;
  --good:#2F7A57; --good-soft:#E4F0EA;
  --hot:#161C28; --hot-soft:#EFE9DF;
  /* masthead shares the page surface: nav, hero and catalogue are one field */
  --nav:transparent; --nav-ink:var(--text); --nav-muted:var(--muted);
  --shadow-s:0 1px 2px rgba(20,19,20,.05);
  --shadow-m:0 2px 4px rgba(20,19,20,.04), 0 12px 28px -14px rgba(20,19,20,.16);
  --shadow-l:0 4px 10px rgba(20,19,20,.05), 0 28px 60px -28px rgba(20,19,20,.26);
  --r-xl:20px; --r-lg:14px; --r-md:10px; --r-sm:8px; --pill:50px;
  --ui:'Manrope','Noto Sans Armenian','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono','Noto Sans Armenian',ui-monospace,monospace;
  --maxw:1240px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151D; --surface:#1A1E29; --surface2:#232837; --shot:#232837;
    --text:#F2EEE7; --body:#B3BBC9; --muted:#8B93A3;
    --line:#282D3B; --line2:#38404F;
    --brand:#E4574F; --brand-ink:#12151D; --brand-soft:#3A1E1C; --brand-2:#F0726A;
    --apricot:#F5B673; --apricot-soft:#3A2A18;
    --plum:#8FB6CE; --plum-soft:#1E2836;
    --good:#5FC79A; --good-soft:#16301F;
    --hot:#F2EEE7; --hot-soft:#282D3B;
    --nav:transparent; --nav-ink:var(--text); --nav-muted:var(--muted);
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
    --shadow-l:0 4px 10px rgba(0,0,0,.35), 0 28px 60px -28px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#141314; --surface:#1C1A19; --surface2:#232120; --shot:#232120;
    --text:#F6F1ED; --body:#B7B0A9; --muted:#918A82;
    --line:#2C2926; --line2:#3B3733;
    --brand:#FF7A4D; --brand-ink:#141314; --brand-soft:#3A2018; --brand-2:#FF9470;
    --plum:#B39BD8; --plum-soft:#2A2137;
    --good:#5FC79A; --good-soft:#17301F;
    --hot:#F6F1ED; --hot-soft:#2C2926;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
  --shadow-l:0 4px 10px rgba(0,0,0,.35), 0 28px 60px -28px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* rem, not px: a reader who raises their browser's default text size gets a bigger UI.
   Structural values (borders, small gaps) stay in px on purpose. */
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:0.9375rem;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance;line-height:1.18}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:where(a,button,input,select,summary,[tabindex]):focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;background:var(--surface);padding:10px 14px;border-radius:8px;z-index:99}
.skip:focus{left:10px;top:10px}
.shell{max-width:var(--maxw);margin:0 auto;padding:0 20px}
@media (max-width:600px){.shell{padding:0 14px}}

/* ============ masthead: nav, cover and catalogue are ONE ivory field ============ */
.mast{background:var(--bg);color:var(--text)}
.topnav{display:flex;align-items:center;gap:16px;height:74px}
.topnav .logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.03em;color:var(--text);flex:none}
.topnav .logo .m{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
.nav{display:flex;gap:2px;flex:none}
.nav a{padding:8px 12px;border-radius:0;font-weight:600;font-size:0.875rem;color:var(--muted);
  box-shadow:inset 0 -1px 0 transparent}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);box-shadow:inset 0 -2px 0 var(--brand)}
@media (max-width:900px){.nav{display:none}}
.srch{flex:1 1 auto;min-width:0;position:relative;max-width:340px}
.srch input{width:100%;height:40px;padding:0 15px 0 38px;border-radius:0;border:0;
  border-bottom:1px solid var(--line2);background:none;color:var(--text);font-size:0.875rem}
.srch input::placeholder{color:var(--muted)}
.srch input:focus{outline:none;border-bottom-color:var(--brand)}
.srch svg{position:absolute;left:12px;top:12px;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.mast-r{display:flex;align-items:center;gap:2px;flex:none}
.langs{display:flex;align-items:center}
.langs button{background:none;border:0;color:var(--muted);cursor:pointer;padding:7px 7px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;line-height:1}
.langs button:hover{color:var(--text)}
.langs button[aria-pressed="true"]{color:var(--text);text-decoration:underline;text-underline-offset:4px;
  text-decoration-color:var(--brand);text-decoration-thickness:2px}
.th{width:34px;height:34px;background:none;border:0;color:var(--muted);cursor:pointer;
  display:grid;place-items:center;margin-left:4px}
.th svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.th:hover{color:var(--text)}
.cmpbtn{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:var(--pill);
  border:1px solid var(--text);background:none;color:var(--text);font-weight:600;font-size:0.844rem;
  cursor:pointer;white-space:nowrap;margin-left:10px}
.cmpbtn:hover{background:var(--text);color:var(--bg)}
.cmpbtn .c{min-width:20px;height:20px;padding:0 6px;border-radius:var(--pill);background:var(--brand);color:#fff;
  font-size:11.5px;font-weight:700;display:grid;place-items:center}
.cmpbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
@media (max-width:640px){.cmpbtn span.lbl{display:none}.cmpbtn{padding:0 11px}}
@media (max-width:820px){
  .topnav{flex-wrap:wrap;height:auto;padding-block:12px;gap:10px}
  .topnav .logo{order:1}.mast-r{order:2;margin-left:auto}
  .srch{order:3;flex:1 1 100%;max-width:none}
  .cmpbtn{margin-left:4px}
}

/* ---- cover: the phone overlaps the headline, apricot rule ties them ---- */
.mast-hero{padding-block:8px 0}
.cv-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brand);display:flex;align-items:center;gap:10px}
.cv-eyebrow::after{content:"";flex:1;height:1px;background:var(--line2)}
.cv{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,330px);
  gap:10px;align-items:end;margin-top:18px}
.cv-h{font-size:clamp(40px,9vw,116px);font-weight:800;letter-spacing:-.055em;line-height:.86;
  position:relative;z-index:2;max-width:13ch}
.cv-h em{font-style:normal;color:var(--brand)}
.cv-m{position:relative;z-index:1;display:grid;place-items:end center;margin-bottom:-8px}
.cv-m img{max-height:400px;width:auto;filter:drop-shadow(0 26px 44px rgba(22,28,40,.24))}
.cv-sub{grid-column:1;color:var(--body);font-size:1.03rem;max-width:44ch;margin-top:20px;position:relative;z-index:2}
.cv-acts{grid-column:1;display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;position:relative;z-index:2}
.cv-bar{display:flex;flex-wrap:wrap;gap:8px 30px;align-items:baseline;
  border-top:2px solid var(--apricot);padding-top:14px;margin-top:26px}
.cv-bar div{display:flex;align-items:baseline;gap:8px}
.cv-bar b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.cv-bar span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (max-width:860px){
  .cv{grid-template-columns:1fr;gap:0;align-items:start}
  .cv-m{order:-1;place-items:center;margin-bottom:6px}
  .cv-m img{max-height:220px}
  .cv-h{max-width:none}
}

/* ---- savings strip: real spread between shops, the thing only this site knows ---- */
.save-sec{margin-top:52px}
.save-hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.save-hd h2{font-size:26px;font-weight:800;letter-spacing:-.035em}
.save-hd p{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.save-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.save-grid{grid-template-columns:1fr}}
.sv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;
  transition:border-color .14s}
.sv:hover{border-color:var(--brand)}
.sv .t{background:var(--shot);border-radius:var(--r-md);height:86px;padding:8px;overflow:hidden}
.sv .t img{width:100%;height:100%;object-fit:contain}
/* these are <span>s: without display:block the name and the price share a line and the
   figure wraps mid-number ("...Pro 5G 49" / "900 D"). */
.sv>span:last-child{display:block;min-width:0}
.sv .nm{display:block;font-size:0.906rem;font-weight:700;line-height:1.25}
.sv .amt{display:block;font-size:23px;font-weight:800;letter-spacing:-.035em;color:var(--brand);
  margin-top:4px;white-space:nowrap}
.sv .amt small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);font-weight:400;margin-top:2px}
.sv .bar{display:block;position:relative;height:6px;border-radius:3px;background:var(--surface2);margin-top:10px;overflow:hidden}
.sv .bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--apricot)}
.sv .rng{display:flex;justify-content:space-between;white-space:nowrap;font-family:var(--mono);font-size:10px;
  color:var(--muted);margin-top:5px;letter-spacing:.05em}

/* ================= buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 26px;
  border-radius:var(--pill);border:1px solid transparent;background:var(--brand);color:var(--brand-ink);
  font-weight:700;font-size:0.906rem;cursor:pointer;white-space:nowrap;transition:transform .12s ease,background .12s ease}
.btn:hover{background:var(--brand-2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--line2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{height:38px;padding:0 16px;font-size:0.844rem}
.btn.block{width:100%}

/* ================= filter bar ================= */
.fbar{display:flex;align-items:center;gap:9px;margin:26px 0 0;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fdrop{position:relative;flex:none}
.fdrop>summary{list-style:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:0.875rem;
  cursor:pointer;white-space:nowrap;user-select:none}
.fdrop>summary::-webkit-details-marker{display:none}
.fdrop>summary:hover{border-color:var(--line2)}
.fdrop[open]>summary,.fdrop.on>summary{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.fdrop>summary svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .15s}
.fdrop[open]>summary svg{transform:rotate(180deg)}
.fdrop .panel{position:absolute;top:50px;left:0;z-index:50;min-width:250px;max-height:340px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-l);padding:8px}
.fdrop.r .panel{left:auto;right:0}
@media (max-width:640px){.fdrop .panel{position:fixed;left:10px;right:10px;top:auto;bottom:10px;min-width:0;max-height:60vh}}
.opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:0.906rem}
.opt:hover{background:var(--surface2)}
.opt input{width:17px;height:17px;accent-color:var(--brand);margin:0;flex:none}
.opt .n{margin-left:auto;font-size:12.5px;color:var(--muted)}
.fbar .spacer{flex:1 1 auto;min-width:4px}
.toggle{flex:none;display:inline-flex;align-items:center;height:42px;padding:0 15px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:0.875rem;cursor:pointer;white-space:nowrap}
.toggle[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.rngbox{padding:12px 10px 6px}
.rng{position:relative;height:26px}
.rng .track{position:absolute;left:0;right:0;top:12px;height:3px;border-radius:2px;background:var(--line2)}
.rng .fill{position:absolute;top:12px;height:3px;border-radius:2px;background:var(--brand)}
.rng input{position:absolute;left:0;top:4px;width:100%;height:18px;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;
  background:var(--surface);border:2px solid var(--brand);box-shadow:var(--shadow-s);cursor:pointer}
.rng input::-moz-range-thumb{pointer-events:auto;width:15px;height:15px;border-radius:50%;background:var(--surface);
  border:2px solid var(--brand);cursor:pointer}
.rngv{display:flex;justify-content:space-between;font-size:0.8125rem;font-weight:600;padding-top:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 8px 0 13px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand);border:0;font-size:0.8125rem;font-weight:600;cursor:pointer}
.chip x{font-size:15px;line-height:1;opacity:.65}
.chip:hover x{opacity:1}
.chip.clear{background:none;color:var(--muted);padding:0 12px}
.chip.clear:hover{color:var(--text)}

.resbar{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.resbar h2{font-size:26px;font-weight:800;letter-spacing:-.035em}
.resbar .cnt{font-size:0.875rem;color:var(--muted);font-weight:500}

/* ================= product grid ================= */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;
  display:flex;flex-direction:column;position:relative;transition:box-shadow .16s ease,transform .16s ease,border-color .16s}
.pcard:hover{border-color:var(--text);box-shadow:none;transform:none}
.pshot{position:relative;background:var(--shot);border-radius:var(--r-md);height:190px;display:block;padding:14px;overflow:hidden}
@media (max-width:520px){.pshot{height:140px;padding:10px}}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;cursor:pointer;z-index:2;box-shadow:var(--shadow-s)}
.fav svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.fav:hover svg{stroke:var(--brand)}
.fav[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
.fav[aria-pressed="true"] svg{stroke:var(--brand-ink)}
.badge{position:absolute;top:10px;left:10px;height:22px;padding:0 10px;border-radius:var(--pill);background:var(--text);
  color:var(--bg);font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;display:inline-flex;align-items:center;z-index:2;letter-spacing:.01em}
.pbody{padding:12px 4px 2px;display:flex;flex-direction:column;flex:1}
.eyebrow{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.11em;text-transform:uppercase}
.pcard h3{font-size:1rem;font-weight:700;letter-spacing:-.02em;margin-top:3px;line-height:1.3}
.pcard h3 a::after{content:"";position:absolute;inset:0;z-index:1}
.sc{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.sc li{font-size:11.5px;font-weight:600;color:var(--body);background:var(--surface2);border-radius:7px;padding:3px 7px;white-space:nowrap}
.pfoot{margin-top:auto;padding-top:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.pprice{font-size:19px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.pprice s{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.pcard .go{position:relative;z-index:2;width:34px;height:34px;border-radius:50%;background:var(--surface2);
  display:grid;place-items:center;flex:none}
.pcard .go svg{width:15px;height:15px;stroke:var(--brand);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pcard:hover .go{background:var(--brand)}
.pcard:hover .go svg{stroke:var(--brand-ink)}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:18px;font-weight:700;margin-bottom:6px}

/* ================= product page — bold panel ================= */
.crumb a:hover{color:var(--brand)}

.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:30px}
.panel-c{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow-s)}
.panel-c h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px;margin-bottom:6px}
.panel-c h3 i{width:7px;height:7px;border-radius:2px;background:var(--brand);display:block}
.kv{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:0.875rem;align-items:baseline}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--muted);flex:none;width:44%;font-size:0.8125rem}
.kv dd{margin:0;font-weight:600;text-align:right;flex:1}
.pcl li{display:flex;gap:9px;padding:7px 0;font-size:0.875rem;align-items:flex-start}
.pcl li::before{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;margin-top:1px}
.pcl.up li::before{content:"+";background:var(--good-soft);color:var(--good)}
.pcl.dn li::before{content:"−";background:var(--hot-soft);color:var(--hot)}
.simrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:14px}
.sim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;
  align-items:center;gap:12px;transition:border-color .15s,box-shadow .15s}
.sim:hover{border-color:var(--line2);box-shadow:var(--shadow-m)}
.sim .t{background:var(--shot);border-radius:var(--r-sm);width:clamp(44px,4.5vw,58px);height:clamp(52px,5.2vw,68px);display:block;flex:none;padding:5px;overflow:hidden}
.sim b{display:block;font-size:0.844rem;font-weight:700;line-height:1.3}
.sim span{font-size:0.8125rem;color:var(--brand);font-weight:700}
h2.sh{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:48px}
.lede{color:var(--body);font-size:1rem;max-width:70ch;margin:26px 0 0}
h2.sh em{font-style:normal;color:var(--brand);padding:0;font-size:12px;margin-left:8px}

/* the spread rail, redrawn as a hairline on cream */

@media (max-width:560px){

  .btn{white-space:normal;height:auto;min-height:46px;padding:11px 18px;line-height:1.25;text-align:center}

  .tray .shell{gap:7px;padding:6px 12px;min-height:58px}

     The name comes from aria-label on the button, not from off-screen text. */

    border-radius:50%;border:1px solid var(--line2)}
  /* scroll the slots instead of hiding them: the badge said 4 while only 2 were visible */

  .tslot{flex:0 0 34px}
  .tray .btn{height:40px;min-height:40px;padding:0 13px;font-size:0.844rem;white-space:nowrap;width:auto;flex:none}
}
/* ================= compare ================= */

/* every product thumbnail is presented in a fixed box and letterboxed the same way,
   so a wide front+back render and a narrow single-phone render read at the same scale */

   max-* are belt-and-braces so a tall cutout can never spill over the table. */
.pshot img,.sim .t img,.ccol .t img,.tslot img{
  width:100%;height:100%;max-width:100%;max-height:100%;

  const pts = HIST[p.id] || [];
  if (!pts.length) return '';
  if (pts.length < 2) return `<h2 class="sh">${esc(x('histT'))}</h2>
    <p class="note">${esc(x('noHist'))} · ${esc(x('trackSince'))} ${esc(dmy(pts[0].d))}</p>`;
  const W = 640, H = 120, pad = 8;
  const lo = Math.min(...pts.map(v => v.lo)), hi = Math.max(...pts.map(v => v.hi));
  const span = hi - lo || 1;
  const xs = i => pad + i * (W - pad * 2) / (pts.length - 1);
  const ys = v => pad + (1 - (v - lo) / span) * (H - pad * 2);
  // plot the whole daily range: cheapest line, dearest line, band between them
  const d = pts.map((v, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)} ${ys(v.lo).toFixed(1)}`).join(' ');
  const dHi = pts.map((v, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)} ${ys(v.hi).toFixed(1)}`).join(' ');
  const band = dHi + ' ' + pts.slice().reverse().map((v, i) =>
    `L${xs(pts.length - 1 - i).toFixed(1)} ${ys(v.lo).toFixed(1)}`).join(' ') + ' Z';
  const last = pts[pts.length - 1], first = pts[0];
  const delta = last.lo - first.lo;
  return `<h2 class="sh">${esc(x('histT'))}</h2>
    <div class="hist">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
        aria-label="${esc(x('histT'))}: ${money(first.lo)} - ${money(last.lo)} AMD">
        <path class="ha" d="${band}"/><path class="hh" d="${dHi}"/><path class="hl" d="${d}"/>
        <circle class="hd" cx="${xs(pts.length - 1).toFixed(1)}" cy="${ys(last.lo).toFixed(1)}" r="4"/>
      </svg>
      <div class="hist-ax">
        <span>${esc(dmy(first.d))} · ${money(first.lo)}–${money(first.hi)} ֏</span>
        <span class="${delta < 0 ? 'dn' : delta > 0 ? 'up' : ''}">${delta === 0 ? '—' : (delta < 0 ? '↓ ' : '↑ ') + money(Math.abs(delta)) + ' ֏'}</span>
        <span>${esc(dmy(last.d))} · ${money(last.lo)}–${money(last.hi)} ֏</span>
      </div>
    </div>`;
}

/* ================= filtering ================= */
function matches(p, s) {
  const q = s.q.trim().toLowerCase();
  if (q && !(fullName(p) + ' ' + p.chipset.name).toLowerCase().includes(q)) return false;
  if (s.brands.length && !s.brands.includes(p.brand)) return false;
  const pr = bestOf(p);
  if (pr < s.pmin || pr > s.pmax) return false;
  if (s.ram && !p.variants.some(v => v.ram >= s.ram)) return false;
  if (s.stor && !p.variants.some(v => v.storage >= s.stor)) return false;
  if (s.batt && p.battery.capacity < s.batt) return false;
  if (s.hz && p.display.refresh < s.hz) return false;
  if (s.g5 && !/5G/i.test(p.connectivity.network)) return false;
  if (s.nfc && !p.connectivity.nfc) return false;
  const d = p.display.size;
  if (s.scr === 'lt63' && d >= 6.3) return false;
  if (s.scr === 'mid' && (d < 6.3 || d > 6.7)) return false;
  if (s.scr === 'gt67' && d <= 6.7) return false;
  return true;
}
const spreadOf = p => { const o = offersFor(p); return o.length > 1 ? o[o.length - 1].price - o[0].price : 0; };
const SORTS = {
  popular: (a, b) => b.popularity - a.popularity,
  price_asc: (a, b) => bestOf(a) - bestOf(b),
  price_desc: (a, b) => bestOf(b) - bestOf(a),
  newest: (a, b) => (b.released || '').localeCompare(a.released || ''),
  brand: (a, b) => a.brand.localeCompare(b.brand) || fullName(a).localeCompare(fullName(b)),
  battery: (a, b) => (b.battery.capacity || 0) - (a.battery.capacity || 0),
  screen: (a, b) => (b.display.size || 0) - (a.display.size || 0),
  savings: (a, b) => spreadOf(b) - spreadOf(a),
  shops: (a, b) => shopCount(offersFor(b)) - shopCount(offersFor(a))
};
const SORT_KEYS = ['popular', 'price_asc', 'price_desc', 'savings', 'shops', 'newest', 'brand', 'battery', 'screen'];

// the hero belongs to the dark masthead so nav and hero share one surface (no seam)
// The cover and the savings strip both live in the masthead surface, so nav -> cover ->
// catalogue read as one field. Savings are computed from the REAL spread between shops.
function biggestSavings(n = 3) {
  // A saving is only real if it is the SAME phone in the SAME capacity. Comparing a 256 GB
  // offer against a 2 TB one produces a huge number nobody can actually pocket, so the spread
  // is measured inside each storage tier and the best genuine one wins.
  return DATA.map(p => {
    const byTier = new Map();
    for (const o of offersFor(p)) {
      const k = o.storage ?? 'base';
      (byTier.get(k) || byTier.set(k, []).get(k)).push(o.price);
    }
    let best = null;
    for (const [tier, prices] of byTier) {
      if (prices.length < 2) continue;
      const lo = Math.min(...prices), hi = Math.max(...prices);
      if (hi > lo && (!best || hi - lo > best.gap)) best = { p, lo, hi, gap: hi - lo, tier };
    }
    return best;
  }).filter(Boolean).sort((a, b) => b.gap - a.gap).slice(0, n);
}

  'Cloud White': '#EDEDEA', 'Light Gold': '#E4CFA8', 'Sky Blue': '#A9C4D9', 'Mist Blue': '#A9C4D9',
  'Sage': '#9DAE96', 'Lavender': '#C9BCE0', 'Ultramarine': '#4A56C8', 'Teal': '#3F9E93',
  'Starlight': '#E8E3DA', 'Midnight': '#1F2430', 'Moonstone': '#C9CBD1', 'Iris': '#7A7FD0',
  'Jade': '#4E9E7E', 'Porcelain': '#EFEBE4', 'Obsidian': '#22252A', 'Peony': '#E7A9BC',
  'Rose Gold': '#DDB1A0', 'Pink Gold': '#E5BBB0', 'Titanium Pinkgold': '#E0B9AE',
  'Titanium Black': '#2E2E32', 'Titanium Gray': '#8E8E93', 'Titanium Silverblue': '#A9B4C2',
  'Titanium Whitesilver': '#DCDCDE', 'Poco Yellow': '#F5CB00', 'Arctic Dawn': '#DDE6EF'
};
// head-noun colour words, matched from the end of the name
const HUE = {
  black: '#1B1B1F', white: '#F0F0EE', silver: '#D9DADE', gray: '#8E8E93', grey: '#8E8E93',
  graphite: '#4A4A50', titanium: '#B7B8BC', obsidian: '#22252A', eclipse: '#1A1A1E', shadow: '#6E7076',
  blue: '#2E6FA3', navy: '#2A3A57', ocean: '#2A5F8F', sky: '#A9C4D9', cyan: '#4FB6C4', teal: '#3F9E93',
  ultramarine: '#4A56C8', iris: '#7A7FD0', starry: '#3E5C8A', icy: '#CFE0EC',
  green: '#3E8E5A', mint: '#B9E3C6', lime: '#C3D852', olive: '#6F7355', sage: '#9DAE96',
  jade: '#4E9E7E', nebula: '#4E7F63', emerald: '#2E7D5B',
  yellow: '#EFC94C', gold: '#D9B36A', lightning: '#E3C56B', sand: '#DCC9A8',
  orange: '#C8622A', coral: '#E4705E', peach: '#F0BFA0', red: '#C03A32',
  pink: '#EFB4C4', rose: '#D9A0A6', peony: '#E7A9BC',
  purple: '#7B5FA8', violet: '#7B5FA8', lavender: '#C9BCE0', aurora: '#8E6FB8', dreamy: '#9A7FC0',
  midnight: '#1F2430', starlight: '#E8E3DA', moonstone: '#C9CBD1', moonlight: '#E9E9E4',
  storm: '#3A3D42', porcelain: '#EFEBE4'
};
const _hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const _mix = (h, amt) => {           // amt > 0 lightens toward white, < 0 darkens
  const t = amt > 0 ? 255 : 0, k = Math.abs(amt);
  return '#' + _hex(h).map(v => Math.round(v + (t - v) * k).toString(16).padStart(2, '0')).join('');
};
function swatch(name) {
  if (SWATCH[name]) return SWATCH[name];
  const words = String(name || '').toLowerCase().replace(/[^a-z]+/g, ' ').trim().split(' ').filter(Boolean);
  let base = null;
  // scan from the end: colour names put the head noun last ("Coral Green" is green)
  for (let i = words.length - 1; i >= 0 && !base; i--) {
    const w = words[i];
    if (HUE[w]) { base = HUE[w]; break; }
    // compounds the shops write as one word: jetblack, pinkgold, jadegreen, whitesilver
    let bestLen = 0;
    for (const k in HUE) if (w.endsWith(k) && k.length > bestLen) { base = HUE[k]; bestLen = k.length; }
  }
  if (!base) return '#9AA0A6';
  if (words.some(w => ['light', 'icy', 'ice', 'pale'].includes(w))) base = _mix(base, .34);
  if (words.some(w => ['deep', 'dark', 'midnight', 'jet', 'obsidian', 'storm'].includes(w))) base = _mix(base, -.3);
  return base;
}

const CIMG = (typeof COLORIMG !== 'undefined' && COLORIMG) || {};
const colorPhoto = (p, c) => (c && CIMG[p.id] && CIMG[p.id][slugOf(c)]) || null;

let SEL = { id: null, color: null, storage: null, ram: null };
function initSel(p) {
  if (SEL.id === p.id) return;
  const offs = offersFor(p);
  // start on whatever the cheapest real offer actually is
  SEL = {
    id: p.id,
    color: (offs.find(o => o.color) || {}).color || (p.colors || [])[0] || null,
    storage: (offs.find(o => o.storage != null) || {}).storage ?? (p.variants[0] || {}).storage ?? null,
    ram: null
  };
  // RAM and storage are sold as a pair, so start on a combination that exists
  const v0 = p.variants.find(v => v.storage === SEL.storage) || p.variants[0];
  SEL.ram = v0 ? v0.ram : null;
}
// Narrow the offer list to the chosen options.
// RAM and storage decide the price, so those filters are HARD: if nothing matches, the answer is
// "no shop sells this configuration", not some other variant's price. Colour is soft, because it
// rarely changes the price and many listings omit it.
function visibleOffers(p) {
  let o = offersFor(p);
  if (SEL.storage != null && p.variants.length) {
    // Some shops (Mobile Centre) list no capacity. That price is for the base model, so it may
    // only stand in for the smallest tier - otherwise it would undercut a real 1 TB offer.
    const base = Math.min(...p.variants.map(v => v.storage));
    o = o.filter(v => v.storage === SEL.storage || (v.storage == null && SEL.storage === base));
  }
  if (SEL.ram != null) o = o.filter(v => v.ram == null || v.ram === SEL.ram);
  if (SEL.color) {
    const m = o.filter(v => !v.color || v.color === SEL.color);
    if (m.length) o = m;
  }
  return o;
}
function railHTML(offs) {
  if (offs.length < 2) return '';
  const lo = offs[0].price, hi = offs[offs.length - 1].price;
  if (hi === lo) return '';
  const dots = offs.map(o => `<span class="dt${o.price === lo ? ' b' : ''}" style="left:${((o.price - lo) / (hi - lo) * 100).toFixed(1)}%" title="${esc(shopName(o.shop))} · ${money(o.price)} ֏"></span>`).join('');
  return `<div class="rail" role="img" aria-label="${esc(x('saveUpTo'))} ${money(hi - lo)} AMD"><span class="ln"></span>${dots}</div>
    <div class="ends"><span class="num">${money(lo)} ֏</span><span class="num">${money(hi)} ֏</span></div>
    <div class="save">${esc(x('saveUpTo'))} <b class="num">${money(hi - lo)} ֏</b></div>`;
}

/* ================= all offers for one model ================= */
// The product page shows offers for the CHOSEN colour/capacity. This page shows every offer
// the shops list for the model, and lets you slice it by shop, capacity and colour.
let OSEL = { id: null, storage: '', ram: '', color: '' };
function initOSel(id) { if (OSEL.id !== id) OSEL = { id, storage: '', ram: '', color: '' }; }

function offerRow(o, lo, i) {
  return `<li><a class="orow${o.price === lo ? ' best' : ''}" href="${esc(safeHref(o.url))}" target="_blank" rel="noopener noreferrer">
    <span class="rk num">${String(i + 1).padStart(2, '0')}</span>
    <span class="sh">${esc(shopName(o.shop))}</span>
    <span class="vr">${esc([o.storage ? gb(o.storage) : '', o.ram ? o.ram + ' ' + u('gb') + ' RAM' : '', o.color || ''].filter(Boolean).join(' · ') || '—')}</span>
    <span class="pr num">${money(o.price)} ֏</span>
    <span class="dl">${o.price === lo ? esc(x('bestPrice')) : '+' + money(o.price - lo) + ' ֏'}
      ${o.inStock === false ? `<i class="oos">${esc(x('outOfStock'))}</i>` : `<i class="ins">${esc(x('inStock'))}</i>`}</span>
    <span class="ar" aria-hidden="true">→</span></a></li>`;
}

function offersView(p) {
  initOSel(p.id);
  const all = offersFor(p);
  const stors = [...new Set(all.map(o => o.storage).filter(v => v != null))].sort((a, b) => a - b);
  const rams = [...new Set(all.map(o => o.ram).filter(v => v != null))].sort((a, b) => a - b);
  const cols = [...new Set(all.map(o => o.color).filter(Boolean))];
  // filtering is by what you are buying - capacity, memory, colour - not by which shop
  const list = all.filter(o =>
    (!OSEL.storage || String(o.storage) === OSEL.storage) &&
    (!OSEL.ram || String(o.ram) === OSEL.ram) &&
    (!OSEL.color || o.color === OSEL.color));
  const lo = list.length ? Math.min(...list.map(o => o.price)) : null;
  const hi = list.length ? Math.max(...list.map(o => o.price)) : null;

  const chips = (key, vals, label, fmt = v => v) => vals.length < 2 ? '' :
    `<div class="ofg"><span class="ofl">${esc(label)}</span>
      <button class="ofc${OSEL[key] === '' ? ' on' : ''}" data-of="${key}" data-ofv="">${esc(x('any'))}</button>
      ${vals.map(v => `<button class="ofc${String(OSEL[key]) === String(v) ? ' on' : ''}" data-of="${key}" data-ofv="${esc(String(v))}">${esc(fmt(v))}</button>`).join('')}</div>`;

  return `<div class="shell">
    <div class="navrow">${backLink('#/p/' + p.id, fullName(p))}
      <nav class="crumb"><span>${esc(x('allOffers'))}</span></nav></div>
    <div class="ofhead">
      <span class="t"><img src="${IMG(p.id)}" alt="" loading="lazy"></span>
      <div>
        <h1>${esc(fullName(p))}</h1>
        <p class="ofsub">${esc(x('allOffers'))} · <b class="num">${all.length}</b> ${esc(x('offersLbl'))} · <b class="num">${shopCount(all)}</b> ${esc(x('shops'))}</p>
      </div>
    </div>
    <div class="offilters">
      ${chips('storage', stors, t('f.storage'), gb)}
      ${chips('ram', rams, t('f.ram'), v => v + ' ' + u('gb'))}
      ${chips('color', cols, t('sec.colors'))}
    </div>
    <div class="resbar"><h2>${esc(t('common.results_count').replace('{n}', list.length))}</h2>
      ${(() => {
        // A saving is only real between rows you could actually swap: same capacity.
        // Unfiltered, this list spans 256 GB to 2 TB and the spread would be meaningless.
        const tiers = new Set(list.map(o => o.storage ?? 'base'));
        return list.length > 1 && hi > lo && tiers.size === 1
          ? `<span class="cnt">${esc(x('saveUpTo'))} <b class="num">${money(hi - lo)} ֏</b></span>`
          : (tiers.size > 1 ? `<span class="cnt">${esc(x('pickCapacity'))}</span>` : '');
      })()}</div>
    ${list.length ? `<ol class="olist">${list.map((o, i) => offerRow(o, lo, i)).join('')}</ol>`
      : `<p class="empty" style="padding:30px 0"><b>${esc(x('noOffers'))}</b></p>`}
    <p class="note">${esc(x('priceSrc'))} · ${esc(x('updated'))} ${esc(updatedOn())}</p>
  </div>`;
}

/* ================= compare ================= */
function compareView() {
  const ps = st.cmp.map(byId).filter(Boolean);
  if (!ps.length) return `<div class="shell"><div class="empty" style="margin-top:40px">
    <b>${esc(t('compare.empty'))}</b><p style="margin-bottom:18px">${esc(x('emptyS'))}</p>
    <a class="btn" href="#/">${esc(t('compare.add_phone'))}</a></div></div>`;
  const n = ps.length, cols = `200px repeat(${n},minmax(0,1fr))`;

  let rows = '', nDiff = 0, nSame = 0;
  for (const [g, defs] of GROUPS) {
    rows += `<div class="grp">${esc(t(g))}</div>`;
    for (const [k, get, num, dir] of defs) {
      const vals = ps.map(p => { try { const v = get(p); return v == null || v === '' ? '—' : String(v); } catch (e) { return '—'; } });
      if (vals.every(v => v === '—')) continue;
      const same = vals.every(v => v === vals[0]);
      same ? nSame++ : nDiff++;
      const cls = same ? 'row-same' : 'row-diff';
      let bi = -1;
      if (num && dir && n > 1) {
        const nv = ps.map(p => { try { return num(p); } catch (e) { return null; } });
        const ok = nv.filter(v => typeof v === 'number' && isFinite(v));
        if (ok.length > 1 && new Set(ok).size > 1) bi = nv.indexOf(dir > 0 ? Math.max(...ok) : Math.min(...ok));
      }
      rows += `<div class="k ${cls}">${esc(t(k))}</div>` +
        vals.map((v, i) => `<div class="c ${cls}${i === bi ? ' best' : ''}">${esc(v)}</div>`).join('');
    }
  }
  return `<div class="shell">
    <div class="navrow">${backLink('#/', t('nav.catalog'))}</div>
    <div class="cbar"><h2 class="sh" style="margin:0">${esc(t('compare.title'))}</h2>
      <span class="dcount"><i></i>${nDiff} ${esc(x('diffs'))}</span>
      <span class="scount">${nSame} ${esc(x('same'))}</span>
      <span style="flex:1"></span>
      <label class="sw"><input type="checkbox" id="diffonly"><span class="tr"></span>${esc(t('compare.diff_only'))}</label>
      <a class="btn ghost sm" href="#/">${esc(t('compare.add_phone'))}</a>
      <button class="btn ghost sm" data-act="clearcmp">${esc(t('compare.clear'))}</button></div>
    <div class="cwrap" id="cwrap" style="--cols:${cols};--n:${n}">
      <div class="chead"><div class="pad"></div>
        ${ps.map(p => `<div class="ccol">
          <button class="x" data-cmp="${esc(p.id)}" aria-label="${esc(t('compare.clear'))}: ${esc(fullName(p))}">×</button>
          <span class="t"><img src="${IMG(p.id)}" alt="${esc(fullName(p))}" decoding="async"></span>
          <b>${esc(fullName(p))}</b><span class="p num">${money(p.priceAmd)} ֏</span></div>`).join('')}
      </div>
      <div class="ctable">${rows}</div>
    </div></div>`;
}

/* ================= router ================= */
function render(keepScroll) {
  paintChrome(); paintTray();
  const h = location.hash.replace(/^#/, '') || '/';
  const m = h.match(/^\/p\/(.+)$/);
  let mo;
  const main = $('#main');
  if (m && byId(m[1])) { const y = window.scrollY; main.innerHTML = detailView(byId(m[1])); document.title = fullName(byId(m[1])) + ' — MyCatalog'; window.scrollTo(0, keepScroll ? y : 0); }
  else if ((mo = h.match(/^\/offers\/(.+)$/)) && byId(mo[1])) {
    const y = window.scrollY;
    main.innerHTML = offersView(byId(mo[1]));
    document.title = x('allOffers') + ' — ' + fullName(byId(mo[1]));
    window.scrollTo(0, keepScroll ? y : 0);   // filter chips must not throw you to the top
  }
  else if (h === '/compare') { main.innerHTML = compareView(); document.title = t('compare.title') + ' — MyCatalog'; window.scrollTo(0, 0); }
  else { main.innerHTML = catalogView(); refresh(); document.title = 'MyCatalog'; }
  const mh = $('#masthero');
  const home = !m && h !== '/compare' && !h.startsWith('/offers/');
  mh.hidden = !home;
  mh.innerHTML = home ? mastHero() : '';
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const L = e.target.closest('[data-lang]');
  if (L) { st.lang = L.dataset.lang; save(); render(); return; }
  if (e.target.closest('#themeBtn')) {
    st.theme = st.theme === 'auto' ? 'light' : st.theme === 'light' ? 'dark' : 'auto';
    save(); paintChrome(); return;
  }
  if (e.target.closest('#hdrCmp')) { location.hash = '#/compare'; return; }
  const tg = e.target.closest('button[data-f]');
  if (tg) { const k = tg.dataset.f; st[k] = !st[k]; refresh(); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm) {
    const k = rm.dataset.rm;
    if (k === 'all') Object.assign(st, { brands: [], pmin: PMIN, pmax: PMAX, ram: 0, stor: 0, batt: 0, hz: 0, scr: '', g5: false, nfc: false });
    else if (k.startsWith('brand:')) st.brands = st.brands.filter(b => b !== k.slice(6));
    else if (k === 'price') { st.pmin = PMIN; st.pmax = PMAX; }
    else if (k === 'scr') st.scr = '';
    else st[k] = (k === 'g5' || k === 'nfc') ? false : 0;
    refresh(); return;
  }
  const act = e.target.closest('[data-act="clearcmp"]');
  if (act) { st.cmp = []; save(); paintTray(); render(); return; }
  const fav = e.target.closest('[data-cmp]');
  if (fav) {
    e.preventDefault();
    const id = fav.dataset.cmp, wasIn = st.cmp.includes(id);
    if (toggleCmp(id) && wasIn && location.hash === '#/compare') render();
    return;
  }
  const cb = e.target.closest('[data-cmp-btn]');
  if (cb) {
    const id = cb.dataset.cmpBtn;
    if (toggleCmp(id)) {
      const on = st.cmp.includes(id);
      cb.textContent = on ? t('detail.in_compare') : t('detail.add_compare');
      cb.classList.toggle('ghost', on);
    }
    return;
  }
  const ex = e.target.closest('[data-expand]');
  if (ex) {
    const list = document.getElementById(ex.dataset.expand);
    const open = list.classList.toggle('all');
    ex.setAttribute('aria-expanded', open);
    ex.firstChild.textContent = (open ? x('showLess') : x('showAll')) + ' ';
    return;
  }
  const ofc = e.target.closest('[data-of]');
  if (ofc) { OSEL[ofc.dataset.of] = ofc.dataset.ofv; render(true); return; }
  const opt = e.target.closest('[data-color],[data-storage],[data-ram]');
  if (opt) {
    const ph = byId(SEL.id);
    if (opt.dataset.color !== undefined) SEL.color = opt.dataset.color;
    // RAM and storage ship as a pair (Galaxy A26 is 6/128 or 8/256, never 8/128 here),
    // so picking one snaps the other to a combination that actually exists.
    if (opt.dataset.storage !== undefined) {
      SEL.storage = +opt.dataset.storage;
      if (ph && !ph.variants.some(v => v.storage === SEL.storage && v.ram === SEL.ram)) {
        const v = ph.variants.filter(v => v.storage === SEL.storage).sort((a, b) => a.ram - b.ram)[0];
        if (v) SEL.ram = v.ram;
      }
    }
    if (opt.dataset.ram !== undefined) {
      SEL.ram = +opt.dataset.ram;
      if (ph && !ph.variants.some(v => v.ram === SEL.ram && v.storage === SEL.storage)) {
        const v = ph.variants.filter(v => v.ram === SEL.ram).sort((a, b) => a.storage - b.storage)[0];
        if (v) SEL.storage = v.storage;
      }
    }
    render(true);
    return;
  }
  // one dropdown open at a time; click outside closes
  const d = e.target.closest('[data-drop]');
  $$('[data-drop][open]').forEach(o => { if (o !== d) o.open = false; });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('[data-drop][open]').forEach(o => o.open = false); });
document.addEventListener('change', e => {
  const el = e.target, f = el.dataset.f;
  if (el.id === 'diffonly') { $('#cwrap').classList.toggle('hide-same', el.checked); return; }
  if (!f) return;
  if (f === 'brand') st.brands = el.checked ? [...new Set([...st.brands, el.value])] : st.brands.filter(b => b !== el.value);
  else if (f === 'scr') st.scr = el.value;
  else if (f === 'sort') { st.sort = el.value; el.closest('[data-drop]').open = false; }
  else if (f === 'pmin') st.pmin = Math.min(+el.value, st.pmax);
  else if (f === 'pmax') st.pmax = Math.max(+el.value, st.pmin);
  else st[f] = +el.value;
  refresh();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { st.q = el.value; refresh(); return; }
  if (el.dataset.f === 'pmin' || el.dataset.f === 'pmax') {
    const a = +$('[data-f="pmin"]').value, b = +$('[data-f="pmax"]').value;
    $('[data-rng="min"]').textContent = money(Math.min(a, b)) + ' ֏';
    $('[data-rng="max"]').textContent = money(Math.max(a, b)) + ' ֏';
  }
});
window.addEventListener('hashchange', render);
render();

</script>

</body></html>
