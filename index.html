  border:1px solid var(--line2);color:var(--text);font-size:0.8125rem;font-weight:600;white-space:nowrap}
.orow .ar svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.orow .ar:empty{display:none}
.orow:hover .ar{border-color:var(--brand-2);color:var(--brand-2)}
.orow.best{background:var(--good-soft)}
.orow.best .od{background:var(--good);color:var(--bg)}
.orow.best .rk{color:var(--good)}
.orow.best:hover{background:var(--good-soft)}
/* A price with no page behind it. It still belongs on the list - somebody read it off a shelf -
   but it must not look like something to click, so it loses the pointer and the hover response. */
.orow.nolink{cursor:default}
.orow.nolink:hover{background:transparent}
.orow.nolink.best:hover{background:var(--good-soft)}
@media (max-width:760px){
  .orow{grid-template-columns:28px 1fr auto;row-gap:3px;padding:13px 14px}
  .orow .vr{grid-column:2/-1;order:3}
  .orow .od{grid-column:2;order:4;justify-self:start;padding:3px 9px}
  .orow .ar{grid-column:3;order:4;justify-self:end;min-height:30px;padding:0 10px}
}



/* ---- price history ---- */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px 12px;margin-top:10px}
.hist-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.hist-top>b{font-size:26px;font-weight:800;letter-spacing:-.03em}
.hp{font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:var(--pill)}
.hp.good{background:var(--good-soft);color:var(--good)}
.hp.warn{background:var(--surface2);color:var(--body)}
.hist-sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.hist-c{position:relative;margin-top:8px;touch-action:pan-y}
.hist-c svg{display:block;width:100%;height:210px;overflow:visible;cursor:crosshair}
.hist-c svg:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:8px}
.hist .hg{stroke:var(--line);stroke-width:1}
.hist .ht{fill:var(--muted);font:500 12px var(--mono)}
.hist .harea{fill:var(--brand);opacity:.08}
.hist .hl{fill:none;stroke:var(--brand);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.hist .hgap{fill:none;stroke:var(--brand);stroke-width:1.5;stroke-dasharray:3 4;opacity:.6}
.hist .hlow{fill:var(--good);stroke:var(--surface);stroke-width:2}
.hist .hnow{fill:var(--brand);stroke:var(--surface);stroke-width:2}
.hist .hlab{font:700 11.5px var(--ui)}
.hist .hlab.good{fill:var(--good)}
.hist .hx{stroke:var(--text);stroke-width:1;stroke-dasharray:2 3;opacity:.45}
.hist .hd{fill:var(--text);stroke:var(--surface);stroke-width:2}
.hist-tip{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 12px));background:var(--text);color:var(--bg);
  border-radius:var(--r-md);padding:7px 10px;font-size:12px;line-height:1.35;white-space:nowrap;display:grid;gap:1px;box-shadow:var(--shadow-m);z-index:2}
.hist-tip b{font-size:14px}
.hist-tip.below{transform:translate(-50%,14px)}
.hist-tip .dn,.hist-tip .up{font-weight:700}

/* ---- expandable offer list + all-offers page ---- */
.allofflink{margin-top:10px;font-size:0.875rem}
.allofflink a{color:var(--brand);font-weight:700;border-bottom:1px solid currentColor;padding-bottom:1px}
.ofhead{display:flex;align-items:center;gap:18px;margin:14px 0 6px}
.ofhead .t{width:76px;height:92px;background:var(--shot);border-radius:var(--r-md);padding:8px;flex:none;overflow:hidden}
.ofhead .t img{width:100%;height:100%;object-fit:contain}
.ofhead h1{font-size:clamp(24px,3.4vw,38px);font-weight:800;letter-spacing:-.035em}
.ofsub{color:var(--muted);font-size:0.875rem;margin-top:5px}
.ofsub b{color:var(--text)}
.offilters{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.ofg{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.ofl{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  width:110px;flex:none}
.ofc{height:34px;padding:0 13px;border-radius:var(--pill);border:1px solid var(--line2);background:var(--surface);
  font-size:0.844rem;font-weight:600;cursor:pointer}
.ofc:hover{border-color:var(--text)}
.ofc.on{background:var(--text);color:var(--bg);border-color:var(--text)}
/* The colour row on the all-offers page is the same swatch the product page uses, so the two
   pages ask the question the same way. .cs already draws and sizes them; the only difference is
   that these sit in a filter row beside an "All" chip, so they need its 34px height and its gap. */
.ofcs{display:inline-flex;gap:7px;flex-wrap:wrap;align-items:center}
.ofcs button{width:34px;height:34px}
@media (max-width:600px){.ofl{width:100%}}

/* stock status on each offer */
.orow .ins,.orow .oos,.orow .unk{display:block;font-style:normal;font-size:0.75rem;font-weight:600;margin-top:2px}
.orow .ins{color:var(--good)}
/* Out of stock was muted grey - the quietest thing on the row, under a price you cannot buy.
   It is the one fact that makes the rest of the row useless, so it is the loudest. */
.orow .oos{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:var(--pill);
  background:var(--bad);color:#fff;font-size:0.75rem;font-weight:800;letter-spacing:.02em;
  text-transform:uppercase}
.orow .unk{color:var(--muted);font-weight:500}
/* and the row itself steps back: a price nobody can take should not read as an offer */
.orow:has(.oos){opacity:.62}
.orow:has(.oos) .pr{text-decoration:line-through;text-decoration-thickness:2px}

/* return control */
.navrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 2px}
.backbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--pill);
  border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:0.875rem;flex:none}
.backbtn:hover{border-color:var(--text);background:var(--surface2)}
.backbtn span{font-size:1rem;line-height:1}
.navrow .crumb{padding:0}

/* Reduced motion is about things MOVING, not about things fading: a cross-fade has no
   direction and no displacement. So keyframe animations and every transform transition still
   go, and opacity is the one property left free - which is what makes the hero and the card
   colour changes dissolve rather than cut for anyone with the setting on. */
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-property:opacity!important}
  /* Two exceptions, because reduced motion is about MOVEMENT. A price changing colour and a
     card fading in move nothing at all, and they are the only signal that the number you just
     changed the configuration for is a different number. Blanketing them out left the product
     page silent on the one interaction it exists for. */
  .fx-flash{animation:fxflash .8s ease-out!important}
  .grid.gridin>*{animation:gridinFade .2s ease both!important}
}
/* ================= a finger, not a mouse pointer =================
   Measured at 375 px: the plus that adds a card to a comparison was 26x26, the language buttons
   38x25, the theme switch and the page numbers 34x34, and the only part of a card that opened
   the product was the 22 px line of its title. A fingertip covers about 9 mm, which is why 44 px
   is the figure everyone settles on.

   Two different fixes, because the controls have two different problems. The ones that look
   right at the size they are drawn keep their size and get a bigger TARGET - an invisible 44 px
   square centred on them. The ones that are simply short get taller. Both only under
   (pointer: coarse), so nothing about the desktop layout moves. */
@media (pointer: coarse){
  .ctabs .ctab, .fmore, .pg, .toggle, .fbar summary, .nav a, #langs button,
  .ft-links a, .topnav .logo, .fapply button,
  .backbtn, .bs button, .cchip{min-height:44px}
  /* the pager was 44 tall and 34 wide - a target is both measurements or neither */
  .pager .pg{min-width:44px}
  /* Only the thumb of a range takes the pointer, and an 18 px thumb is the one control on this
     site you have to DRAG. Bigger thumb, taller strip, track re-centred on both. */
  .rng{height:30px}
  .rng .track,.rng .fill{top:14px}
  .rng input{top:1px;height:28px}
  .rng input::-webkit-slider-thumb{width:26px;height:26px}
  .rng input::-moz-range-thumb{width:24px;height:24px}
  .fav::after, .srch-go::after, .th::after, #langs button::after{
    content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;
    transform:translate(-50%,-50%);border-radius:50%}
  .th, #langs button{position:relative}
  /* The whole card opens the product, not just the title. .pcard is already positioned, and the
     plus is lifted above the stretched link so it still adds to the comparison instead. */
  .pcard h2 a::after{content:'';position:absolute;inset:0;z-index:1}
  .fav{z-index:3}
}

@media (max-width:640px){

  .nav{order:2;flex:none;margin-left:auto}
  .nav a{padding:8px 5px;font-size:0.8125rem}

  .mast-r{display:contents}
  .th{order:3;margin-left:0}

  .mbar-n{margin-left:auto;color:var(--muted);font-size:13px}
  .mbar-s{min-width:0;flex:0 1 auto}

  .mbar-n{white-space:nowrap}

    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat}
  @media (max-width:420px){.mbar-n{display:none}}

}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
/* a fold's cover screen (280px): the logo and three nav links (catalogue, compare, blog) do not
   fit one row - the nav takes a row of its own under the logo. Last in the sheet so it wins. */

/* Armenian is written, not shouted (owner, 2026-09-26). IBM Plex Mono has no Armenian letters, so
   these small labels fell back to widely spaced capitals of another font: hard to read, and wide
   enough to wrap on a phone. Russian and English keep their small capitals. */
:lang(hy) :is(.spot-e,.spot-bot small,.cv-bar span,.soon-tag,.soon .po,.dl small,.cq h3,.badge,.eyebrow,/* A figure the data itself flags as unconfirmed. Quiet - it qualifies the number,it does not

.orow .oos){text-transform:none;letter-spacing:.01em}

const BLOG=[{"id":"apple-september-2026","date":"2026-09-24","cta":{"href":"#/p/apple-iphone-18-pro","hy":"iPhone 18 Pro-ի գները","ru":"Цены на iPhone 18 Pro","en":"iPhone 18 Pro prices"},"sources":[{"name":"Apple Newsroom: iPhone 18 Pro and iPhone 18 Pro Max","url":"https://www.apple.com/newsroom/2026/09/apple-debuts-iphone-18-pro-and-iphone-18-pro-max/"},{"name":"Apple Newsroom: iPhone Duo","url":"https://www.apple.com/newsroom/2026/09/apple-unveils-iphone-duo/"},{"name":"Apple Newsroom: John Ternus to become CEO","url":"https://www.apple.com/newsroom/2026/04/tim-cook-to-become-apple-executive-chairman-john-ternus-to-become-apple-ceo/"},{"name":"MacRumors: September 9 event","url":"https://www.macrumors.com/guide/apple-september-2026-what-to-expect/"},{"name":"Benzinga: AirPods 5, Watch Series 12 and Ultra 4","url":"https://www.benzinga.com/markets/tech/26/09/61696812/apple-announced-airpods-5-watch-ultra-4-and-watch-series-12"}],"en":{"title":"What Apple showed on 9 September: iPhone 18 Pro, the foldable iPhone Duo, new Watches and AirPods 5","lead":"Apple's “Surprise and shine” event was the first under its new CEO, John Ternus. Here is what was announced, and what it costs in Armenia today.","body":["## A new CEO on stage","John Ternus, who led Apple's hardware engineering, became chief executive on 1 September; Tim Cook is now executive chairman of the board. The event in Cupertino on 9 September was his first launch.","## iPhone 18 Pro and iPhone 18 Pro Max","- The A20 Pro chip, made on a 2 nm process, with a new vapor chamber that holds its performance for longer.","- A 48 MP main camera with a variable aperture, from f/1.48 to f/4, a first for iPhone.","- Longer battery life: Apple rates the 18 Pro at up to 36 hours of video and the Pro Max at up to 45.","- A smaller Dynamic Island that shows up to three Live Activities at once.","- 2 TB of storage now on the smaller Pro as well, and four colours: burgundy, glacier, silver and black.","In the US they start at $1,199 and $1,299, $100 more than last year. In Armenia today: iPhone 18 Pro from {{price:apple-iphone-18-pro}}, iPhone 18 Pro Max from {{price:apple-iphone-18-pro-max}}.","## iPhone Duo, the first foldable iPhone","A 5.4-inch screen outside and a 7.6-inch screen inside; opened, it is the thinnest iPhone yet. It starts at $1,999 in the US and goes on sale in October. It is not sold in Armenia yet.","## No regular iPhone 18 this autumn","Apple did not show a standard iPhone 18. Reports say the more affordable models move to spring 2027, so the iPhone 17 stays the current base model.","## Apple Watch and AirPods","- Apple Watch Series 12, from $399: a new health-sensing system with larger ECG electrodes, and the ceramic case returns.","- Apple Watch Ultra 4, from $799.","- AirPods 5, from $129: active noise cancellation on both models, and Live Translation.","In Armenia today: Watch Series 12 from {{price:apple-watch-series-12-gps-42mm}}, Watch Ultra 4 from {{price:apple-watch-ultra-4-gps-plus-cellular-plus-band}}, AirPods 5 from {{price:apple-airpods-5}}."]},"ru":{"title":"Что Apple показала 9 сентября: iPhone 18 Pro, складной iPhone Duo, новые часы и AirPods 5","lead":"Презентация «Surprise and shine» стала первой при новом генеральном директоре Apple Джоне Тернусе. Что показали и сколько это стоит в Армении сегодня.","body":["## Новый глава на сцене","Джон Тернус, руководивший разработкой железа Apple, стал генеральным директором 1 сентября, а Тим Кук теперь исполнительный председатель совета директоров. Презентация 9 сентября в Купертино — его первая.","## iPhone 18 Pro и iPhone 18 Pro Max","- Чип A20 Pro по 2-нм техпроцессу и новая испарительная камера, которая дольше удерживает производительность.","- Основная камера 48 Мп с переменной диафрагмой от f/1.48 до f/4 — впервые в iPhone.","- Дольше от батареи: Apple заявляет до 36 часов видео для 18 Pro и до 45 для Pro Max.","- Уменьшенный Dynamic Island, который показывает до трёх Live Activities одновременно.","- 2 ТБ памяти теперь и в меньшем Pro, и четыре цвета: burgundy, glacier, silver и black.","В США цены начинаются с $1 199 и $1 299 — на $100 больше, чем год назад. В Армении сегодня: iPhone 18 Pro от {{price:apple-iphone-18-pro}}, iPhone 18 Pro Max от {{price:apple-iphone-18-pro-max}}.","## iPhone Duo — первый складной iPhone","Внешний экран 5,4 дюйма, внутренний — 7,6. В раскрытом виде это самый тонкий iPhone. В США от $1 999, продажи начнутся в октябре; в Армении его пока нет.","## Обычного iPhone 18 этой осенью нет","Apple не показала обычный iPhone 18. По данным СМИ, более доступные модели перенесены на весну 2027 года, так что базовой моделью остаётся iPhone 17.","## Apple Watch и AirPods","- Apple Watch Series 12 от $399: новая система датчиков здоровья с увеличенными электродами ЭКГ и возвращение керамического корпуса.","- Apple Watch Ultra 4 от $799.","- AirPods 5 от $129: активное шумоподавление в обеих моделях и Live Translation.","В Армении сегодня: Watch Series 12 от {{price:apple-watch-series-12-gps-42mm}}, Watch Ultra 4 от {{price:apple-watch-ultra-4-gps-plus-cellular-plus-band}}, AirPods 5 от {{price:apple-airpods-5}}."]},"hy":{"title":"Ինչ ցույց տվեց Apple-ը սեպտեմբերի 9-ին․ iPhone 18 Pro, ծալվող iPhone Duo, նոր ժամացույցներ և AirPods 5","lead":"Apple-ի «Surprise and shine» շնորհանդեսն առաջինն էր ընկերության նոր գործադիր տնօրեն Ջոն Տերնուսի օրոք։ Ահա թե ինչ ներկայացվեց և որքան արժե այն Հայաստանում այսօր։","body":["## Նոր ղեկավար բեմում","Ջոն Տերնուսը, որը ղեկավարում էր Apple-ի սարքերի ինժեներական մշակումը, գործադիր տնօրեն դարձավ սեպտեմբերի 1-ին, իսկ Թիմ Քուքն այժմ տնօրենների խորհրդի գործադիր նախագահն է։ Սեպտեմբերի 9-ի շնորհանդեսը Կուպերտինոյում նրա առաջինն էր։","## iPhone 18 Pro և iPhone 18 Pro Max","- A20 Pro չիպ՝ 2 նմ տեխնոլոգիայով, և նոր գոլորշային խցիկ, որն ավելի երկար է պահում արտադրողականությունը։","- 48 ՄՊ հիմնական տեսախցիկ՝ փոփոխական դիաֆրագմայով՝ f/1.48-ից մինչև f/4։ Սա առաջինն է iPhone-ում։","- Ավելի երկար մարտկոց․ Apple-ը 18 Pro-ի համար նշում է մինչև 36 ժամ տեսանյութ, Pro Max-ի համար՝ մինչև 45։","- Ավելի փոքր Dynamic Island, որը միաժամանակ ցույց է տալիս մինչև երեք Live Activity։","- 2 ՏԲ հիշողություն այժմ նաև փոքր Pro-ում, և չորս գույն՝ burgundy, glacier, silver և black։","ԱՄՆ-ում դրանց գինը սկսվում է $1,199-ից և $1,299-ից՝ նախորդ տարվանից $100-ով ավելի։ Հայաստանում այսօր՝ iPhone 18 Pro՝ {{price:apple-iphone-18-pro}}-ից, iPhone 18 Pro Max՝ {{price:apple-iphone-18-pro-max}}-ից։","## iPhone Duo՝ առաջին ծալվող iPhone-ը","Արտաքին էկրանը 5.4 դյույմ է, ներքինը՝ 7.6։ Բացված վիճակում այն մինչ օրս ամենաբարակ iPhone-ն է։ ԱՄՆ-ում գինը սկսվում է $1,999-ից, վաճառքը կսկսվի հոկտեմբերին։ Հայաստանում այն դեռ չի վաճառվում։","## Սովորական iPhone 18 այս աշնանը չկա","Apple-ը չներկայացրեց սովորական iPhone 18։ Ըստ լրատվամիջոցների՝ ավելի մատչելի մոդելները տեղափոխվել են 2027-ի գարուն, ուստի հիմնական մոդելը մնում է iPhone 17-ը։","## Apple Watch և AirPods","- Apple Watch Series 12՝ $399-ից․ առողջության չափման նոր համակարգ՝ ԷՍԳ-ի ավելի մեծ էլեկտրոդներով, և վերադառնում է կերամիկական իրանը։","- Apple Watch Ultra 4՝ $799-ից։","- AirPods 5՝ $129-ից․ ակտիվ աղմկազերծում երկու մոդելներում էլ և Live Translation։","Հայաստանում այսօր՝ Watch Series 12՝ {{price:apple-watch-series-12-gps-42mm}}-ից, Watch Ultra 4՝ {{price:apple-watch-ultra-4-gps-plus-cellular-plus-band}}-ից, AirPods 5՝ {{price:apple-airpods-5}}-ից։"]},"cover":"images/blog/apple-september-2026.webp"},{"id":"iphone-17-pro-vs-18-pro","date":"2026-09-24","cta":{"href":"#/p/apple-iphone-18-pro","hy":"iPhone 18 Pro-ի գները","ru":"Цены на iPhone 18 Pro","en":"iPhone 18 Pro prices"},"sources":[{"name":"Apple Newsroom: iPhone 18 Pro and iPhone 18 Pro Max","url":"https://www.apple.com/newsroom/2026/09/apple-debuts-iphone-18-pro-and-iphone-18-pro-max/"},{"name":"MacRumors: iPhone 17 Pro vs. iPhone 18 Pro","url":"https://www.macrumors.com/guide/iphone-17-pro-vs-18-pro/"},{"name":"Tom's Guide: iPhone 18 Pro Max vs iPhone 17 Pro Max","url":"https://www.tomsguide.com/phones/iphones/iphone-18-pro-max-vs-iphone-17-pro-max-comparison"},{"name":"AppleInsider: iPhone 18 Pro vs iPhone 17 Pro","url":"https://appleinsider.com/inside/iphone-18/vs/iphone-18-pro-vs-iphone-17-pro-flagships-compared"}],"en":{"title":"iPhone 17 Pro or iPhone 18 Pro: what actually changed","lead":"From the outside they are almost the same phone. The differences are inside, and in the price.","body":["## Design","The same size and shape; the 18 Pro is a few grams heavier (about 211 g against 206 g). The colours change: the 17 Pro came in Cosmic Orange, Deep Blue and Silver, the 18 Pro comes in Burgundy, Glacier, Silver and Black.","!fig:images/blog/iphone-17-18-pro-colours.webp|The iPhone 17 Pro colours (top) and the iPhone 18 Pro colours (bottom).","## Chip and cooling","A19 Pro (3 nm) against A20 Pro (2 nm). The 18 Pro also gets a redesigned vapor chamber, so it holds its speed for longer in games and video exports. The difference shows under long, heavy use rather than day to day.","## Camera","Both have three 48 MP cameras with a 4× telephoto. What is new is the main camera's variable aperture: f/1.48 for more light at night, down to f/4 for sharper group shots and landscapes. The 17 Pro's main camera is fixed at f/1.78. Video gets new tools as well, such as 4K Dolby Vision time-lapse.","## Battery","- 17 Pro: up to 33 hours of video · 18 Pro: up to 36.","- 17 Pro Max: up to 39 hours · 18 Pro Max: up to 45.","Apple quotes these for the eSIM-only models; the versions with a SIM tray are rated about two hours lower.","## Everything else","- A smaller Dynamic Island, with up to three Live Activities at once.","- Faster wired charging and a newer cellular modem.","- 2 TB of storage on the 6.3-inch Pro too, not only on the Pro Max.","## Price","In the US the 18 Pro costs $100 more than the 17 Pro did at launch ($1,199 against $1,099). In Armenia today:","- iPhone 17 Pro from {{price:apple-iphone-17-pro}}, iPhone 18 Pro from {{price:apple-iphone-18-pro}}: {{diff:apple-iphone-17-pro|apple-iphone-18-pro}} more.","- iPhone 17 Pro Max from {{price:apple-iphone-17-pro-max}}, iPhone 18 Pro Max from {{price:apple-iphone-18-pro-max}}: {{diff:apple-iphone-17-pro-max|apple-iphone-18-pro-max}} more.","These are the lowest prices for any build; the SIM tray and the storage change them, and each product page shows every option.","## Which one to buy","If you already have a 17 Pro, there is little reason to switch. From a 15 Pro or older, the 18 Pro is the bigger step: longer battery life and the better camera. If the price matters more than the newest camera, the 17 Pro is nearly the same phone for less."]},"ru":{"title":"iPhone 17 Pro или iPhone 18 Pro: что на самом деле изменилось","lead":"Снаружи это почти один и тот же телефон. Разница — внутри и в цене.","body":["## Дизайн","Размеры и форма те же; 18 Pro на несколько граммов тяжелее (около 211 г против 206 г). Меняются цвета: 17 Pro выпускался в Cosmic Orange, Deep Blue и Silver, 18 Pro — в Burgundy, Glacier, Silver и Black.","!fig:images/blog/iphone-17-18-pro-colours.webp|Цвета iPhone 17 Pro (вверху) и iPhone 18 Pro (внизу).","## Чип и охлаждение","A19 Pro (3 нм) против A20 Pro (2 нм). У 18 Pro ещё и переработанная испарительная камера, поэтому он дольше держит скорость в играх и при экспорте видео. Разница заметна под долгой нагрузкой, а не в обычном использовании.","## Камера","У обоих три камеры по 48 Мп с 4-кратным телеобъективом. Новое — переменная диафрагма основной камеры: f/1.48 для съёмки ночью и до f/4 для более резких групповых фото и пейзажей. У 17 Pro диафрагма основной камеры фиксированная, f/1.78. Видео тоже получило новые инструменты, например таймлапс в 4K Dolby Vision.","## Батарея","- 17 Pro: до 33 часов видео · 18 Pro: до 36.","- 17 Pro Max: до 39 часов · 18 Pro Max: до 45.","Apple указывает эти цифры для моделей только с eSIM; версии с лотком для SIM рассчитаны примерно на два часа меньше.","## Остальное","- Уменьшенный Dynamic Island, до трёх Live Activities одновременно.","- Более быстрая проводная зарядка и новый сотовый модем.","- 2 ТБ памяти теперь и в 6,3-дюймовом Pro, а не только в Pro Max.","## Цена","В США 18 Pro стоит на $100 больше, чем 17 Pro на старте ($1 199 против $1 099). В Армении сегодня:","- iPhone 17 Pro от {{price:apple-iphone-17-pro}}, iPhone 18 Pro от {{price:apple-iphone-18-pro}}: на {{diff:apple-iphone-17-pro|apple-iphone-18-pro}} дороже.","- iPhone 17 Pro Max от {{price:apple-iphone-17-pro-max}}, iPhone 18 Pro Max от {{price:apple-iphone-18-pro-max}}: на {{diff:apple-iphone-17-pro-max|apple-iphone-18-pro-max}} дороже.","Это самые низкие цены среди всех версий; тип SIM и объём памяти их меняют, все варианты — на странице каждого товара.","## Что выбрать","Если у вас уже 17 Pro, смысла меняться мало. С 15 Pro и более старых моделей 18 Pro — заметный шаг: дольше работает и лучше снимает. Если цена важнее новой камеры, 17 Pro — почти тот же телефон по более низкой цене."]},"hy":{"title":"iPhone 17 Pro, թե iPhone 18 Pro․ ինչն է իրականում փոխվել","lead":"Դրսից դրանք գրեթե նույն հեռախոսն են։ Տարբերությունը ներսում է և գնի մեջ։","body":["## Դիզայն","Չափերն ու ձևը նույնն են, 18 Pro-ն մի քանի գրամով ծանր է (մոտ 211 գ՝ 206 գ-ի դիմաց)։ Փոխվում են գույները․ 17 Pro-ն թողարկվել է Cosmic Orange, Deep Blue և Silver գույներով, 18 Pro-ն՝ Burgundy, Glacier, Silver և Black։","!fig:images/blog/iphone-17-18-pro-colours.webp|iPhone 17 Pro-ի գույները (վերևում) և iPhone 18 Pro-ի գույները (ներքևում)։","## Չիպ և սառեցում","A19 Pro (3 նմ)՝ A20 Pro-ի (2 նմ) դիմաց։ 18 Pro-ն ունի նաև վերամշակված գոլորշային խցիկ, ուստի խաղերում և տեսանյութ արտահանելիս ավելի երկար է պահում արագությունը։ Տարբերությունը նկատելի է երկար ծանրաբեռնվածության ժամանակ, ոչ թե առօրյա օգտագործման։","## Տեսախցիկ","Երկուսն էլ ունեն երեք 48 ՄՊ տեսախցիկ՝ 4x հեռաոսպնյակով։ Նորը հիմնական տեսախցիկի փոփոխական դիաֆրագման է՝ f/1.48 գիշերային լուսանկարների համար և մինչև f/4՝ ավելի հստակ խմբային լուսանկարների ու բնապատկերների համար։ 17 Pro-ի հիմնական տեսախցիկի դիաֆրագման ֆիքսված է՝ f/1.78։ Տեսանյութի համար էլ կան նոր գործիքներ, օրինակ՝ 4K Dolby Vision թայմլափս։","## Մարտկոց","- 17 Pro՝ մինչև 33 ժամ տեսանյութ · 18 Pro՝ մինչև 36։","- 17 Pro Max՝ մինչև 39 ժամ · 18 Pro Max՝ մինչև 45։","Apple-ը այս թվերը նշում է միայն eSIM ունեցող մոդելների համար․ SIM-ի սկուտեղով տարբերակները գնահատված են մոտ երկու ժամով պակաս։","## Մնացածը","- Ավելի փոքր Dynamic Island՝ միաժամանակ մինչև երեք Live Activity։","- Ավելի արագ լարային լիցքավորում և նոր բջջային մոդեմ։","- 2 ՏԲ հիշողությունն այժմ հասանելի է նաև 6.3 դյույմանոց Pro-ում, ոչ միայն Pro Max-ում։","## Գին","ԱՄՆ-ում 18 Pro-ն $100-ով թանկ է, քան 17 Pro-ն էր թողարկման պահին ($1,199՝ $1,099-ի դիմաց)։ Հայաստանում այսօր՝","- iPhone 17 Pro՝ {{price:apple-iphone-17-pro}}-ից, iPhone 18 Pro՝ {{price:apple-iphone-18-pro}}-ից․ {{diff:apple-iphone-17-pro|apple-iphone-18-pro}}-ով թանկ։","- iPhone 17 Pro Max՝ {{price:apple-iphone-17-pro-max}}-ից, iPhone 18 Pro Max՝ {{price:apple-iphone-18-pro-max}}-ից․ {{diff:apple-iphone-17-pro-max|apple-iphone-18-pro-max}}-ով թանկ։","Սրանք բոլոր տարբերակների մեջ ամենացածր գներն են․ SIM-ի տեսակը և հիշողության ծավալը փոխում են գինը, բոլոր տարբերակները՝ յուրաքանչյուր ապրանքի էջում։","## Որն ընտրել","Եթե արդեն ունեք 17 Pro, փոխելու իմաստը քիչ է։ 15 Pro-ից կամ ավելի հին մոդելից 18 Pro-ն նկատելի քայլ է՝ ավելի երկար մարտկոց և ավելի լավ տեսախցիկ։ Եթե գինն ավելի կարևոր է, քան նորագույն տեսախցիկը, 17 Pro-ն գրեթե նույն հեռախոսն է ավելի ցածր գնով։"]},"cover":"images/blog/iphone-17-pro-vs-18-pro.webp"},{"id":"tv-resolution-and-panels","date":"2026-09-24","cta":{"href":"#/c/tv","hy":"Բոլոր հեռուստացույցները","ru":"Все телевизоры","en":"All TVs"},"hy":{"title":"HD, Full HD, 4K, 8K, OLED, QLED, Mini-LED․ ինչ են նշանակում հեռուստացույցի պիտակները","lead":"Պատկերի մեծ մասը որոշում են երկու բան՝ որքան պիքսել ունի հեռուստացույցը և ինչ վահանակ է դրանք լուսավորում։","body":["## Լուծաչափ","- HD՝ 1366×768։ Այժմ հանդիպում է միայն փոքր, 32 դյույմանոց մոդելներում։","- Full HD՝ 1920×1080։ Բավարար է մոտ 40–43 դյույմ էկրանի համար։","- 4K (Ultra HD)՝ 3840×2160։ Ստանդարտ է 43 դյույմից սկսած, և 50 դյույմից մեծ գրեթե բոլոր հեռուստացույցները 4K են։","- 8K՝ 7680×4320։ Չորս անգամ ավելի շատ պիքսել, քան 4K-ն, բայց 8K բովանդակությունը դեռ շատ քիչ է։","Կոպիտ կանոն․ որքան մեծ է էկրանը և որքան մոտ եք նստում, այնքան կարևոր է լուծաչափը։ Երեք մետրից 43 դյույմանոց էկրանին Full HD-ի և 4K-ի տարբերությունը դժվար է նկատել, իսկ 65 դյույմանոցին՝ ակնհայտ է։","## Վահանակի տեսակը","- LED (LCD)՝ հեղուկ բյուրեղային վահանակ՝ լուսադիոդային հետնալուսավորությամբ։ Ամենատարածված և ամենամատչելի տարբերակը։","- QLED, NanoCell, QNED՝ նույնպես LCD, բայց քվանտային կետերի կամ նմանատիպ շերտով՝ ավելի հարուստ գույների համար։","- Mini-LED՝ LCD հազարավոր փոքրիկ լուսավորման գոտիներով։ Մութ հատվածները մնում են մութ, իսկ պայծառները կարող են շատ պայծառ լինել։","- OLED՝ յուրաքանչյուր պիքսել ինքն է լույս արձակում և սևի համար ամբողջովին անջատվում է։ Լավագույն կոնտրաստն ու դիտման անկյուններն են, բայց սովորաբար ամենաթանկն է՝ մեկ դյույմի հաշվով։","## Better.am-ում","Յուրաքանչյուր հեռուստացույցի քարտում երևում են էկրանի չափը, լուծաչափի դասը և վահանակի տեսակը, իսկ զտիչները թույլ են տալիս ընտրել ըստ չափի և լուծաչափի։"]},"ru":{"title":"HD, Full HD, 4K, 8K, OLED, QLED, Mini-LED: что означают надписи на телевизоре","lead":"Большую часть картинки определяют две вещи: сколько у телевизора пикселей и какая панель их подсвечивает.","body":["## Разрешение","- HD: 1366×768. Сейчас встречается только у небольших 32-дюймовых моделей.","- Full HD: 1920×1080. Достаточно примерно до 40–43 дюймов.","- 4K (Ultra HD): 3840×2160. Стандарт начиная с 43 дюймов; почти все телевизоры больше 50 дюймов — 4K.","- 8K: 7680×4320. В четыре раза больше пикселей, чем у 4K, но контента в 8K пока очень мало.","Грубое правило: чем больше экран и чем ближе вы сидите, тем важнее разрешение. С трёх метров разницу между Full HD и 4K на 43 дюймах заметить трудно, на 65 дюймах она очевидна.","## Тип панели","- LED (LCD): жидкокристаллическая панель со светодиодной подсветкой. Самый распространённый и доступный вариант.","- QLED, NanoCell, QNED: тоже LCD, но со слоем квантовых точек или похожей технологией для более насыщенных цветов.","- Mini-LED: LCD с тысячами крошечных зон подсветки. Тёмные участки остаются тёмными, а яркие могут быть очень яркими.","- OLED: каждый пиксель светится сам и полностью гаснет, показывая чёрный. Лучший контраст и углы обзора, но обычно самая высокая цена за дюйм.","## На Better.am","Карточка каждого телевизора показывает диагональ, класс разрешения и тип панели, а фильтры помогают выбрать по диагонали и разрешению."]},"en":{"title":"HD, Full HD, 4K, 8K, OLED, QLED, Mini-LED: what the TV labels mean","lead":"Two things decide most of a TV's picture: how many pixels it has and what kind of panel lights them.","body":["## Resolution","- HD: 1366×768. Found now only on small, 32-inch sets.","- Full HD: 1920×1080. Enough up to about 40–43 inches.","- 4K (Ultra HD): 3840×2160. The standard from 43 inches up; almost every set above 50 inches is 4K.","- 8K: 7680×4320. Four times the pixels of 4K, with very little 8K content to show on it yet.","A rough rule: the bigger the screen and the closer you sit, the more resolution matters. From three metres the difference between Full HD and 4K is hard to see on a 43-inch set and obvious on a 65-inch one.","## Panel type","- LED (LCD): a liquid-crystal panel lit from behind by LEDs. The most common and the most affordable.","- QLED, NanoCell, QNED: still LCD, with a quantum-dot or similar layer for richer colour.","- Mini-LED: LCD with thousands of tiny backlight zones, so dark parts of the picture stay dark and bright parts can be very bright.","- OLED: every pixel makes its own light and switches off completely for black. The best contrast and viewing angles, and usually the highest price per inch.","## On Better.am","Every TV card shows its size, resolution class and panel type, and the filters narrow the list by screen size and resolution."]},"cover":"images/blog/tv-resolution-and-panels.webp"},{"id":"esim-or-nano-sim","date":"2026-09-24","cta":{"href":"#/p/apple-iphone-17-pro","hy":"iPhone 17 Pro-ի գները","ru":"Цены на iPhone 17 Pro","en":"iPhone 17 Pro prices"},"hy":{"title":"iPhone eSIM-ով, թե Nano-SIM-ով․ որն ընտրել Հայաստանում","lead":"Վերջին iPhone Pro մոդելները Հայաստանում վաճառվում են երկու տարբերակով՝ Nano-SIM-ի սկուտեղով և առանց դրա (միայն eSIM)։ Եվ դրանց գները տարբեր են։","body":["## Ինչով են տարբերվում","Միայն eSIM տարբերակը ընդհանրապես սկուտեղ չունի․ ձեր համարը պահվում է հեռախոսում՝ որպես eSIM պրոֆիլ։ Nano-SIM տարբերակն ընդունում է ֆիզիկական քարտ և նույնպես աջակցում է eSIM։","## Նախքան eSIM ընտրելը","- Հարցրեք ձեր օպերատորին՝ արդյոք այն տրամադրում է eSIM, և ինչպես տեղափոխել համարը դրա վրա։","- Ճամփորդելիս զբոսաշրջային eSIM-երն աշխատում են երկու տարբերակներում էլ։","- Հեռախոսը փոխելիս eSIM-ը պետք է տեղափոխել նոր սարքին, իսկ քարտը բավական է պարզապես տեղափոխել։","## Գինը","Better.am-ի iPhone Pro էջերում SIM-ի ընտրությունը հիշողության ծավալի կողքին է, և յուրաքանչյուր խանութի գինը ցուցադրվում է ընտրված տարբերակի համար։ Այսպես տեսնում եք, թե այսօր որքան արժե տարբերությունը՝ առանց գուշակելու։"]},"ru":{"title":"iPhone с eSIM или с Nano-SIM: какой покупать в Армении","lead":"Последние iPhone Pro продаются в Армении в двух вариантах: с лотком для Nano-SIM и без него (только eSIM). И стоят они по-разному.","body":["## В чём разница","У версии только с eSIM вообще нет лотка: номер хранится в телефоне как профиль eSIM. Версия с Nano-SIM принимает физическую карту и тоже поддерживает eSIM.","## Прежде чем выбрать eSIM","- Узнайте у своего оператора, выдаёт ли он eSIM и как перенести на неё номер.","- В поездках туристические eSIM работают в обеих версиях.","- При смене телефона eSIM нужно перенести на новый аппарат, а карту достаточно переставить.","## Цена","На страницах iPhone Pro в Better.am выбор SIM стоит рядом с объёмом памяти, и цена каждого магазина показана для выбранной версии. Так видно, во что обходится разница сегодня, и гадать не приходится."]},"en":{"title":"eSIM or Nano-SIM iPhone: which one to buy in Armenia","lead":"Recent iPhone Pro models are sold in Armenia in two builds: with a Nano-SIM tray and without one (eSIM only). They are priced differently.","body":["## What differs","The eSIM-only build has no SIM tray at all: your number lives in the phone as an eSIM profile. The Nano-SIM build takes a physical card and supports eSIM as well.","## Before you choose eSIM","- Ask your operator whether it issues eSIMs and how to move your number to one.","- Travel eSIMs work on both builds.","- When you change phones, an eSIM has to be transferred to the new one; a card you simply move.","## The price","On Better.am's iPhone Pro pages the SIM choice sits next to storage, and every shop's price is shown for the build you pick. You see what the difference costs today instead of guessing."]},"cover":"images/blog/esim-or-nano-sim.webp"}];

// Filter steps are read off the items on screen. The old fixed lists ([4,6,8,12,16] RAM,
// [64,128,256,512] storage) could not offer the 24 GB and 2 TB the laptops brought in, and
// offered 64 GB to a category whose smallest phone is 128.
const steps = get => {
  // the smallest value matches everything that has the spec, so it only repeats "All"
  const v = [...new Set(inView().flatMap(get))].filter(n => typeof n === 'number' && n > 0).sort((a, b) => a - b).slice(1);
  if (v.length <= 6) return v;
  // ponytail: evenly sampled, which is plenty for a "this much or more" filter
  return [...new Set(Array.from({ length: 6 }, (_, i) => v[Math.round(i * (v.length - 1) / 5)]))];
};

const viewUnit = () => {

  // was dragging the whole watch category back to gigabytes.
  const p = inView().filter(q => (q.variants || []).some(v => v.storage != null));
  return p.length && p.every(q => q.variantUnit === 'mm') ? 'mm' : undefined;

    ? `<button class="toggle" data-f="${k}" aria-pressed="false">${esc(f.label())}</button>` : '';

function cardShow(btn) {
  const shot = btn.closest('.pshot'), img = shot && shot.querySelector('.pimg');
  if (!img || img.dataset.cur === btn.dataset.cdot) return;
  img.dataset.cur = btn.dataset.cdot;
  shot.querySelectorAll('.cdot').forEach(b => b.setAttribute('aria-pressed', b === btn));
  const card = btn.closest('.pcard'), name = card && card.querySelector('h2 a');
  const want = btn.dataset.cdot, pre = new Image();
  pre.src = want;
  img.classList.add('out');
  const swap = () => { if (img.dataset.cur !== want) return;
    img.src = want; img.alt = (name ? name.textContent + ', ' : '') + btn.dataset.cname; img.classList.remove('out'); };
  const ready = pre.decode ? pre.decode().catch(() => {}) : Promise.resolve();
  Promise.all([ready, new Promise(r => setTimeout(r, 110))]).then(swap);
}
document.addEventListener('pointerover', e => { const b = e.target.closest && e.target.closest('.cdot'); if (b) cardShow(b); });

let SEL = { id: null, color: null, storage: null, ram: null, esim: null, size: null, band: null, cell: null };
function initSel(p) {
  if (SEL.id === p.id) return;
  const offs = offersFor(p);
  // start on whatever the cheapest real offer actually is
  const both = offs.some(o => o.esim === true) && offs.some(o => o.esim === false);
  SEL = {
    id: p.id,
    esim: both ? false : null,
    color: (p.colors || []).find(c => sold(p, 'color', c)) || (p.colors || [])[0] || null,
    storage: (offs.find(o => o.storage != null) || {}).storage ?? (p.variants[0] || {}).storage ?? null,
    ram: null,
    // A MacBook Air M5 is one product in two screens. Start on the screen somebody is actually
    // selling, falling back to the first the catalogue lists.
    size: (offs.find(o => o.size != null) || {}).size ?? (p.variants.find(v => v.size != null) || {}).size ?? null,
    // An Ultra with a Milanese Loop is the same watch and 50,000 dearer, so the band is a choice
    // on one page rather than three products that differ by a strap.
    band: (p.variants.find(v => v.band) || {}).band ?? null,
    // A tablet sold both Wi-Fi only and Wi-Fi + Cellular opens on Wi-Fi, the one most people buy
    cell: offs.some(o => o.cell === true) && offs.some(o => o.cell === false) ? false : null
  };
  // RAM and storage are sold as a pair, so start on a combination that exists - and within the
  // chosen screen, because the 15 is not sold in every configuration the 13 is.
  const pool = SEL.size != null ? p.variants.filter(v => v.size === SEL.size) : p.variants;
  const v0 = pool.find(v => v.storage === SEL.storage) || pool[0] || p.variants[0];
  if (v0) { SEL.storage = v0.storage ?? SEL.storage; SEL.ram = v0.ram; } else SEL.ram = null;
  // Everything above picks a combination the CATALOGUE lists, which is not the same as one anybody
  // here sells. A MacBook Air M4 13-inch/16GB/512GB is a real Apple machine that no Armenian shop
  // stocks, and the page opened on it: a list price, and not one offer under it. If the opening
  // choice shows nothing, move it onto the cheapest offer that does exist - which is what the
  // comment at the top of this function always claimed it did.
  // The card quotes the cheapest offer, so the page opens on exactly that build - the iPhone 17
  // card said 354,000 (eSIM) and the page opened on Nano-SIM at 379,000, which reads as bait
  // (owner, 2026-10-02).
  if (offs.length) {
    const o = offs[0];                                    // offersFor is sorted cheapest first
    if (o.size != null) SEL.size = o.size;
    if (both && typeof o.esim === 'boolean') SEL.esim = o.esim;
    if (SEL.cell != null && typeof o.cell === 'boolean') SEL.cell = o.cell;
    const caps = (p.variants || []).map(v => v.storage).filter(v => v != null);
    // A shop that states no capacity is quoting the base model, the same reading visibleOffers uses
    SEL.storage = o.storage ?? (caps.length ? Math.min(...caps) : SEL.storage);
    const vm = (p.variants || []).find(v => v.storage === SEL.storage
      && (SEL.size == null || v.size == null || v.size === SEL.size));
    SEL.ram = o.ram ?? (vm ? vm.ram : null);
  }
}
// Narrow the offer list to the chosen options.
// RAM and storage decide the price, so those filters are HARD: if nothing matches, the answer is
// "no shop sells this configuration", not some other variant's price. Colour is soft, because it
// rarely changes the price and many listings omit it.
function visibleOffers(p) {
  let o = offersFor(p);
  if (SEL.storage != null && p.variants.length) {
    // Some shops (Mobile Centre) list no capacity. That price is for the base model, so it may
    // only stand in for the smallest tier - otherwise it would undercut a real 1 TB offer.
    const sizes = p.variants.map(v => v.storage).filter(v => v != null);
    const base = sizes.length ? Math.min(...sizes) : null;
    const anySize = p.variantUnit === 'mm';   // a watch listing states no case size; it sells all of them
    o = o.filter(v => v.storage === SEL.storage || (v.storage == null && (anySize || SEL.storage === base)));
  }
  if (SEL.ram != null) o = o.filter(v => v.ram == null || v.ram === SEL.ram);
  // Strict, unlike RAM: a 14-inch and a 16-inch are different machines at different prices, so the
  // button shows that screen's offers and nothing else - otherwise both buttons quote one number.
  // Only where the product really is sold in more than one screen, though: on a single-screen
  // laptop there is nothing to choose, and dropping an offer that merely never stated its size
  // would throw away a real price for no gain.
  const screens = new Set((p.variants || []).map(v => v.size).filter(v => v != null));
  if (SEL.size != null) {
    o = screens.size > 1 ? o.filter(v => v.size === SEL.size)
                         : o.filter(v => v.size == null || v.size === SEL.size);
  }
  if (SEL.band) o = o.filter(v => !v.band || v.band === SEL.band);
  // strict: an offer whose SIM build the shop never stated is not evidence for either button.
  // Treating "not stated" as "tray" put Pixel's 559 000 under Nano-SIM, below the 625 000 eSIM.
  if (SEL.esim != null) o = o.filter(v => v.esim === SEL.esim);
  if (SEL.cell != null) o = o.filter(v => v.cell === SEL.cell);
  // One shop listing the same phone in four colours at one price is one offer to a reader, not
  // four. The row shows shop, capacity, SIM build and price - never the colour, because there is
  // deliberately no colour picker here - so four identical-looking rows were four ways of saying
  // the same sentence. Collapse on what the row actually displays. This also fixes the shop count
  // and the price rail, which were counting colours as competing offers.
  // The url was in this key, and the url is the one thing the row does NOT display: Notebook
  // Centre gives each colour its own page, so three colours at one price were three different
  // keys and all three survived a filter written to remove exactly them. Key on what a reader
  // can see. The survivor is the colour picked above when the shop lists it - istyle gives every
  // colour its own link, and the button has to open the colour the reader chose, not the shop's
  // first one - and otherwise the shop's own first colour.
  const key = v => [v.shop, v.price, v.storage ?? '', v.ram ?? '', v.esim === true ? 'e' : v.esim === false ? 'n' : '?', v.cell ? 'c' : ''].join('|');
  const pick = new Map();
  for (const v of o) {
    const had = pick.get(key(v));
    if (!had || (SEL.color && had.color !== SEL.color && v.color === SEL.color)) pick.set(key(v), v);
  }
  return o.filter(v => pick.get(key(v)) === v);
}
// One row per shop: its cheapest offer for the configuration picked. The same shop listing a
// build twice (a colour with its own page, a SIM build the row does not show) used to take two of
// the five places at the top of the list, and two "Best price" labels.
const perShop = offs => { const seen = new Set(); return offs.filter(o => seen.has(o.shop) ? false : (seen.add(o.shop), true)); };
// The spread between shops, drawn to scale. Shops whose prices sit closer than a dot can be told
// apart merge into one marker with a count; hover or focus it to read which shops and what price.
// The two ends are named, because "354 000 - 439 000" alone does not say where to go.
function railHTML(rows) {
  if (rows.length < 2) return '';
  const lo = rows[0].price, hi = rows[rows.length - 1].price;
  if (hi === lo) return '';
  const pos = v => (v - lo) / (hi - lo) * 100;
  const groups = [];
  for (const o of rows) {
    const g = groups[groups.length - 1];
    if (g && pos(o.price) - pos(g[g.length - 1].price) < 7) g.push(o); else groups.push([o]);
  }
  const dots = groups.map((g, i) => {
    const at = i === 0 ? 0 : i === groups.length - 1 ? 100 : pos((g[0].price + g[g.length - 1].price) / 2);
    // 25/75, not 18/82: a centred label on a dot at 80% ran 2px past a 280px screen
    const side = at < 25 ? ' l' : at > 75 ? ' r' : '';
    const list = g.map(o => `${shopName(o.shop)} · ${money(o.price)} ֏`);
    return `<button type="button" class="rd${g.length > 1 ? ' cl' : ''}${i === 0 ? ' best' : ''}${i === groups.length - 1 ? ' top' : ''}${side}"
      style="left:${at.toFixed(1)}%" aria-label="${esc(list.join(', '))}">${g.length > 1 ? `<span class="rc">×${g.length}</span>` : ''}<span class="rt">${list.map(esc).join('<br>')}</span></button>`;
  }).join('');
  return `<div class="rail2"><span class="ln"></span>${dots}</div>
    <div class="ends2"><span><b class="num">${money(lo)} ֏</b>${esc(shopName(rows[0].shop))}</span>
      <span><b class="num">${money(hi)} ֏</b>${esc(shopName(rows[rows.length - 1].shop))}</span></div>`;
}

// Articles live in data/blog.json in all three languages; build.mjs inlines them as BLOG and also
// writes each one as a static page under b/ for search engines. "## " starts a heading, "- " a
// list item (consecutive ones make one list), anything else is a paragraph.
const postText = a => a[st.lang] || a.en;
// An article can quote today's price: {{price:<id>}} is the product's lowest price now, and
// {{diff:<a>|<b>}} how far apart two products are - so a post never goes stale when prices move.
const livePrice = id => { const p = byId(id); return p && hasReal(p) ? bestOf(p) : null; };
const LIVE = s => s.replace(/\{\{price:([\w-]+)\}\}/g, (m, id) => livePrice(id) != null ? amd(livePrice(id)) : '—')
  .replace(/\{\{diff:([\w-]+)\|([\w-]+)\}\}/g, (m, a, b) =>
    livePrice(a) != null && livePrice(b) != null ? amd(Math.abs(livePrice(b) - livePrice(a))) : '—');
function postBody(list) {
  let html = '', inList = false;
  for (const s of list) {
    const li = s.startsWith('- ');
    if (li && !inList) html += '<ul>';
    if (!li && inList) html += '</ul>';
    inList = li;
    // "!fig:<path>|<caption>" is a picture from images/blog with its caption
    const fig = /^!fig:(images\/blog\/[\w.-]+)\|(.*)$/.exec(s);
    html += fig ? `<figure class="post-fig"><img src="${esc(fig[1])}" alt="${esc(fig[2])}" loading="lazy" decoding="async"><figcaption>${esc(fig[2])}</figcaption></figure>`
      : s.startsWith('## ') ? `<h2>${esc(s.slice(3))}</h2>` : li ? `<li>${LIVE(esc(s.slice(2)))}</li>` : `<p>${LIVE(esc(s))}</p>`;
  }
  return html + (inList ? '</ul>' : '');
}
function blogView() {
  return `<div class="shell"><div class="navrow">${backLink('#/', t('nav.catalog'))}</div>
    <header class="bl-hd"><h1>${esc(t('nav.blog'))}</h1><p>${esc(x('blogSub'))}</p></header>
    <div class="bl-grid">${BLOG.map((a, i) => { const T = postText(a); return `<a class="bl-card${i ? '' : ' first'}" href="#/blog/${esc(a.id)}">
      ${a.cover ? `<span class="bl-im"><img src="${esc(a.cover.replace(/\.webp$/, '-card.webp'))}" alt="" loading="lazy" decoding="async"></span>` : ''}
      <time class="bl-d num" datetime="${esc(a.date)}">${esc(dmy(a.date))}</time>
      <h2>${esc(T.title)}</h2><p>${LIVE(esc(T.lead))}</p>
      <span class="bl-go">${esc(x('readL'))} →</span></a>`; }).join('')}</div></div>`;
}
function postView(a) {
  const T = postText(a), cta = a.cta && /^#\//.test(a.cta.href) ? a.cta : null;
  return `<div class="shell"><div class="navrow">${backLink('#/blog', x('allPosts'))}</div>
    <article class="post">
      <time class="bl-d num" datetime="${esc(a.date)}">${esc(dmy(a.date))}</time>
      <h1>${esc(T.title)}</h1>
      <p class="post-lead">${LIVE(esc(T.lead))}</p>
      ${a.cover ? `<img class="post-cover" src="${esc(a.cover)}" alt="${esc(T.title)}" decoding="async" fetchpriority="high">` : ''}
      ${postBody(T.body)}
      ${(a.sources || []).length ? `<p class="post-src">${esc(x('sourcesL'))}: ${a.sources.filter(s => /^https:\/\//.test(s.url)).map(s =>
        `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer nofollow">${esc(s.name)}</a>`).join(' · ')}</p>` : ''}
      ${cta ? `<p class="post-cta"><a class="btn" href="${esc(cta.href)}">${esc(cta[st.lang] || cta.en)} →</a></p>` : ''}
    </article>
    <aside class="post-more"><h2 class="sh">${esc(x('allPosts'))}</h2><div class="bl-list">${BLOG.filter(b => b !== a).map(b =>
      `<a href="#/blog/${esc(b.id)}"><time class="num">${esc(dmy(b.date))}</time><span>${esc(postText(b).title)}</span></a>`).join('')}</div></aside>
  </div>`;
}
function docView(key, paras) {
  return `<div class="shell"><div class="navrow">${backLink('#/', t('nav.catalog'))}</div>
    <article class="doc"><h1>${esc(t(key + '.title'))}</h1>
    ${paras.map(p => { const s = t(key + '.' + p); return s.startsWith('## ') ? `<h2>${esc(s.slice(3))}</h2>` : `<p>${esc(s)}</p>`; }).join('')}
    ${key === 'contact' && !/_HERE$/.test(t('contact.email')) ? (() => {
      // The page invites people to write; it needs somewhere for them to write TO. An address
      // starting with http is a link, anything else is an email - so swapping one for the other
      // is a change to data/strings.json and nothing else.
      const c = t('contact.email'), web = /^https?:\/\//i.test(c);
      return `<p><a href="${esc(web ? safeHref(c) : 'mailto:' + c)}"${web ? ' target="_blank" rel="noopener noreferrer"' : ''}>${esc(c.replace(/^https?:\/\//, ''))}</a></p>`;
    })() : ''}
    </article></div>`;
}

/* ================= construct: the same filters, asked as questions =================
   Every question is derived from the items in the chosen category, so a new category needs
   no code here. A question with only one possible answer is not asked - it is reported as a
   fact instead, because a question you cannot answer two ways is not a choice. */
const CQ = [
  ['ram',  'filter.ram',          p => (p.variants || []).map(v => v.ram),     v => v + ' ' + u('gb')],
  ['stor', 'filter.storage',      p => (p.variants || []).map(v => v.storage), v => gb(v, viewUnit())],
  ['hz',   'filter.refresh_rate', p => [p.display && p.display.refresh],       v => v + ' ' + u('hz')],
  ['batt', 'filter.battery',      p => [p.battery && p.battery.capacity],      v => money(v) + ' ' + u(st.cat === 'laptop' ? 'wh' : 'mah')]
];

function constructView() {
  const catOf = p => p.category || 'phone';
  const cats = [...new Set(DATA.map(catOf))];
  const label = c => (X[st.lang].cats || {})[c] || c;
  const pool = DATA.filter(p => st.cat && catOf(p) === st.cat);

  const catCards = cats.map(c => `<button class="ccard${st.cat === c ? ' on' : ''}" data-ccat="${esc(c)}"
      aria-pressed="${st.cat === c}"><b>${esc(label(c))}</b><span class="num">${DATA.filter(p => catOf(p) === c).length}</span></button>`).join('');

  const chip = (key, val, text, on) =>
    `<button class="cchip${on ? ' on' : ''}" data-cq="${esc(key)}" data-cqv="${esc(String(val))}" aria-pressed="${on}">${esc(text)}</button>`;

  let questions = '';
  const fixed = [];
  if (st.cat) {
    for (const [key, lbl, get, fmt] of CQ) {
      // the same rule the filter bar follows: a category is only asked what it can answer
      if (!askable(key)) continue;
      const vals = [...new Set(pool.flatMap(get).filter(v => v != null && v > 0))].sort((a, b) => a - b);
      if (vals.length < 2) continue;
      questions += `<section class="cq"><h3>${esc(t(key === 'stor' && viewUnit() === 'mm' ? 'f.case_size' : lbl))}</h3><div class="cqrow">`
        + chip(key, 0, x('any'), !st[key])
        + vals.map(v => chip(key, v, x('min') + ' ' + fmt(v), String(st[key]) === String(v))).join('')
        + `</div></section>`;
    }
    const sizes = askable('scr') ? [...new Set(pool.map(p => p.display && p.display.size).filter(v => v != null))].sort((a, b) => a - b) : [];
    if (sizes.length > 1) {
      questions += `<section class="cq"><h3>${esc(t('filter.screen_size'))}</h3><div class="cqrow">`
        + chip('scrmin', 0, x('any'), !st.scrmin)
        + sizes.map(v => chip('scrmin', v, x('min') + ' ' + v + String.fromCharCode(8243), String(st.scrmin) === String(v))).join('')
        + `</div></section>`;
    }
    const touches = askable('touch') ? [...new Set(pool.map(p => p.display && p.display.touch).filter(v => v != null))] : [];
    if (touches.length > 1) {
      questions += `<section class="cq"><h3>${esc(t('f.touch'))}</h3><div class="cqrow">`
        + chip('touch', 0, x('any'), !st.touch)
        + chip('touch', 1, t('common.yes'), st.touch === 1)
        + chip('touch', 2, t('common.no'), st.touch === 2)
        + `</div></section>`;
    }
    const brands = [...new Set(pool.map(p => p.brand))].sort();
    if (brands.length > 1) {
      questions += `<section class="cq"><h3>${esc(t('filter.brand'))}</h3><div class="cqrow">`
        + brands.map(b => `<button class="cchip${st.brands.includes(b) ? ' on' : ''}" data-cqb="${esc(b)}"
            aria-pressed="${st.brands.includes(b)}">${esc(b)}</button>`).join('')
        + `</div></section>`;
    }
    // what does not vary is stated once rather than asked
    // "Same across this category" is a claim about EVERY product in it, so every one has to state
    // the value. Counting only the products that said something announced "Touchscreen: Yes" over
    // 78 monitors on the strength of the 3 that are touchscreens - the 75 silent ones were dropped
    // from the count, and the only value left standing was the rare one.
    const one = (get, lbl, fmt) => {
      const all = pool.map(get), known = all.filter(x => x != null && x !== '');
      const v = [...new Set(known)];
      if (v.length === 1 && known.length === all.length) fixed.push(t(lbl) + ': ' + fmt(v[0]));
    };
    one(p => p.display && p.display.touch, 'f.touch', v => v ? t('common.yes') : t('common.no'));
    one(p => p.graphics && p.graphics.type, 'f.graphics', v => tr(v, st.lang));
    one(p => p.connectivity && p.connectivity.network, 'f.network', v => tr(v, st.lang));
    one(p => p.os, 'f.os', v => tr(v, st.lang));
  }

  const hits = st.cat ? results().length : 0;
  return `<div class="shell">
    <div class="navrow">${backLink('#/', t('nav.catalog'))}
      <nav class="crumb"><span>${esc(t('construct.title'))}</span></nav></div>
    <h1 class="cnh">${esc(t('construct.title'))}</h1>
    <p class="clead">${esc(t('construct.lead'))}</p>

    <h2 class="sh" style="margin-top:24px">${esc(t('construct.pick_cat'))}</h2>
    <div class="cgrid">${catCards}</div>

    ${st.cat ? `${questions}
      ${fixed.length ? `<p class="cfixed"><b>${esc(t('construct.fixed'))}:</b> ${fixed.map(esc).join('  ·  ')}</p>` : ''}
      <div class="cgo">
        ${hits
          ? `<a class="btn" href="#/c/${esc(st.cat)}">${esc(t('construct.show'))} <b class="num">${hits}</b></a>`
          : `<span class="cnone">${esc(t('construct.none'))}</span>
             <button class="btn ghost" data-rm="all">${esc(t('common.reset'))}</button>`}
      </div>` : ''}
  </div>`;
}

// When this price was last read off the shop's own page. The file carries one timestamp, which
// said every price was checked today - including the ones typed in by hand, which no crawl ever
// revisits, and which is how 23 of them rotted into 404s without anyone noticing. A row that was
// not read today says so, and one nobody can date says that instead of borrowing today's.
const seenTag = o => {
  // "not checked" is the wrong thing to say about a price a person read off the shelf at a shop
  // that will not print one. Ucom shows a build's price only after you have chosen the memory,
  // the RAM and the colour, so there is nothing on that page for a checker to read - and what CAN
  // be checked, that the link opens the product, tools/confirm-hand.mjs checks. A row that passes
  // gets no tag at all: the price is a person's, the link is verified, there is nothing to warn
  // about, and a badge saying "by hand" only invites the reader to distrust a good figure.
  if (!o.seen && o.pickOnSite) return '';
  if (!o.seen) return ` <i class="stale" title="${esc(x('handTip'))}">${esc(x('handSeen'))}</i>`;
  // today's rows carry their date too: a row with no date read as "unknown", not as fresh (owner, 2026-10-02)
  const d = o.seen.slice(8, 10) + '.' + o.seen.slice(5, 7);
  return ` <i class="stale" title="${esc(x('seenTip'))}">${esc(x('seenOn').replace('{d}', d))}</i>`;
};

/* ================= all offers for one model ================= */
// The product page shows offers for the CHOSEN colour/capacity. This page shows every offer
// the shops list for the model, and lets you slice it by shop, capacity and colour.
let OSEL = { id: null, storage: '', ram: '', size: '', esim: '', cell: '', color: '' };
// Arriving here from a product page you have already answered these questions - the capacity,
// the memory, the SIM build, the colour. Asking them again, with every chip back on "any", is
// the site forgetting what it was just told. So the first visit for a product inherits whatever
// the product page had selected; changing a chip here is still yours to change.
// ...but only for an axis this page actually shows a chip for. The product page filters softly
// on memory - an offer that never states its RAM is not evidence against the 12GB you picked -
// while this page filters strictly, and it only draws a group when there are two values to
// choose between. Inheriting SEL.ram = 12 onto a page with no memory chips left every offer
// filtered out by a control the reader could not see, let alone clear: the iPhone 17 Pro Max
// opened with nothing on it at all.
function initOSel(id, avail) {
  if (OSEL.id === id) return;
  const from = SEL.id === id ? SEL : null;
  const has = (k, v) => v !== '' && (avail[k] || []).some(a => String(a) === String(v));
  const take = (k, v) => has(k, v) ? String(v) : '';
  OSEL = { id,
    storage: take('storage', from && from.storage != null ? from.storage : ''),
    ram: take('ram', from && from.ram != null ? from.ram : ''),
    size: take('size', from && from.size != null ? from.size : ''),
    esim: take('esim', from && from.esim != null ? (from.esim ? 'e' : 'n') : ''),
    cell: take('cell', from && from.cell != null ? (from.cell ? 'c' : 'w') : ''),
    color: take('color', (from && from.color) || '') };
}

// AirPods Pro 3 ship in one configuration and one colour: there is no variant to state, so
// saying "variant not stated" reads as missing data rather than as the truth. Only ask the
// question of a product that actually has choices.
const hasChoices = p => {
  const v = (p && p.variants) || [];
  return new Set(v.map(z => z.storage)).size > 1 || new Set(v.map(z => z.ram)).size > 1
    || ((p && p.colors) || []).length > 1;
};
// One value across the whole product is not a choice, and writing it on every row just repeats
// the title: a MacBook Pro M5 Max is sold in one build, so all seven rows read "2 TB . 36 GB"
// and the column says nothing at all. An axis earns its place on the row only where the product
// really offers more than one of it. Counted over the variants AND the offers, because a shop
// sometimes lists a build the variant table never described - and one shop stating the RAM while
// the others stay silent is not a difference between them either.
const offerAxisVaries = (p, key) => {
  if (!p) return false;
  const vals = [...((p.variants || []).map(v => v[key])), ...(offersFor(p) || []).map(o => o[key])];
  return new Set(vals.filter(v => v != null)).size > 1;
};
function offerRow(o, lo, i, unit, cls, of, withColor) {
  // A row with no link was still an <a>, and safeHref turns a missing url into "#" - so it looked
  // clickable and clicking it threw you back to the front page. A price somebody read off a shelf
  // is worth showing; pretending it leads somewhere is not. No url, no link, and no arrow.
  const live = /^https?:\/\//i.test(String(o.url || ''));
  const best = o.price === lo ? ' best' : '';
  return `<li${cls ? ` class="${cls}"` : ''}>${live
      ? `<a class="orow${best}" href="${esc(safeHref(o.url))}" target="_blank" rel="noopener noreferrer">`
      : `<div class="orow nolink${best}">`}
    <span class="rk num">${String(i + 1).padStart(2, '0')}</span>
    <span class="sh">${esc(shopName(o.shop))}</span>
    <!-- Every axis the buyer is choosing between, in one order on every row: screen, capacity,
         memory, SIM build. A row that states only some of them is not tidier, it is ambiguous -
         two rows at different prices with nothing on them to say why. Anything the shop did not
         state is simply absent rather than guessed at. -->
    <span class="vr">${[
        o.size != null && offerAxisVaries(of, 'size') ? esc(inch(o.size)) : '',
        offerAxisVaries(of, 'storage') ? (o.storage ? esc(gb(o.storage, unit)) : (hasChoices(of) ? esc(x('variantUnknown')) : '')) : '',
        o.ram && offerAxisVaries(of, 'ram') ? esc(o.ram + ' ' + u('gb')) : '',
        o.cell != null && offerAxisVaries(of, 'cell') ? esc(cellLbl(o.cell)) : '',
        // The product page shows one row per build and collapses the colours behind it; this
        // page shows every one of them, and without the colour written down two rows from the
        // same shop at the same price are indistinguishable - they read as the listing being
        // duplicated rather than as the two different phones they are.
        withColor && o.color && offerAxisVaries(of, 'color') ? `<i class="ocol"><b style="--c:${swatch(o.color)}"></b>${esc(o.color)}</i>` : '',
      ].filter(Boolean).join(' · ')}${!(of && simChoice(of)) ? ''
        : o.esim === true ? ' <i class="esim">eSIM</i>'
        : o.esim === false ? ' <i class="esim nano">Nano-SIM</i>' : ''}${o.checkColor || (!o.color && ((of && of.colors) || []).length > 1)
        ? ` <i class="chk" title="${esc(x('checkColorHint'))}">${esc(t('offer.check_color'))}</i>` : ''}${seenTag(o)}</span>
    <span class="pr num">${money(o.price)} ֏</span>
    <!-- No stock line. "In stock" was the shop's word for it on the day we read the page and
         "stock not known" said nothing at all, so the column was two thirds noise. What a reader
         is here for is the cheapest price and how much every other shop adds to it. -->
    <span class="od num">${o.price === lo ? esc(x('bestShort')) : '+' + money(o.price - lo) + ' ֏'}</span>
    ${live ? `<span class="ar">${esc(x('goShop'))}<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 8.5 8.5 3.5M4.5 3.5h4v4"/></svg></span>` : '<span class="ar"></span>'}${live ? '</a>' : '</div>'}</li>`;
}

function offersView(p) {
  const all = offersFor(p);
  const stors = [...new Set(all.map(o => o.storage).filter(v => v != null))].sort((a, b) => a - b);
  const rams = [...new Set(all.map(o => o.ram).filter(v => v != null))].sort((a, b) => a - b);
  const sizes = [...new Set(all.map(o => o.size).filter(v => v != null))].sort((a, b) => a - b);
  // Three states, not two: a shop that never said which SIM build it sells is not evidence for
  // either, so '?' is its own choice rather than being folded into Nano-SIM.
  const sims = [...new Set(all.map(o => o.esim === true ? 'e' : o.esim === false ? 'n' : '?'))]
    .sort((a, b) => 'ne?'.indexOf(a) - 'ne?'.indexOf(b));
  // This page is where every colour a shop lists is visible, unlike the product page which shows
  // one row per build - so here the colour is worth choosing by. The list comes from the
  // CATALOGUE, not from the offers: the iPhone 17 Pro Max is sold in Cosmic Orange, Deep Blue and
  // Silver, and reading the offers instead also offered "Black" and "Blue" - one row each, both
  // pixel's own words for a phone Apple does not make in either. A filter is a promise that the
  // thing exists.
  const cols = (p.colors || []).filter(c => all.some(o => o.color === c));
  // a group is only drawn when there are two values to pick between, so that is also the test
  // for whether a choice carried over from the product page can be shown - and un-shown.
  const two = a => a.length > 1 ? a : [];
  const simVals = simChoice(p) ? sims : [];
  const cells = [...new Set(all.map(o => o.cell === true ? 'c' : o.cell === false ? 'w' : null).filter(Boolean))].sort().reverse();
  initOSel(p.id, { storage: two(stors), ram: two(rams), size: two(sizes), esim: two(simVals), cell: two(cells), color: two(cols) });
  // filtering is by what you are buying - capacity, memory, screen, SIM build - not by which shop
  const list = all.filter(o =>
    (!OSEL.storage || String(o.storage) === OSEL.storage) &&
    (!OSEL.ram || String(o.ram) === OSEL.ram) &&
    (!OSEL.size || String(o.size) === OSEL.size) &&
    (!OSEL.esim || (o.esim === true ? 'e' : o.esim === false ? 'n' : '?') === OSEL.esim) &&
    (!OSEL.cell || (o.cell ? 'c' : 'w') === OSEL.cell) &&
    // an offer naming no colour is sold in every colour - pixel lists one row per build, any colour
    (!OSEL.color || !o.color || o.color === OSEL.color))
    // one row per thing a reader can tell apart: istyle's two Flip 7 pages, pixel's am/en copies
    .filter((o, i, a) => { const k = v => [v.shop, v.price, v.storage, v.ram, v.esim, v.cell, v.color || (OSEL.color || '')].join('|');
      return a.findIndex(v => k(v) === k(o) || (!o.color && v.color && k({ ...v, color: '' }) === k(o))) === i; });
  const lo = list.length ? Math.min(...list.map(o => o.price)) : null;
  const hi = list.length ? Math.max(...list.map(o => o.price)) : null;

  const chips = (key, vals, label, fmt = v => v) => vals.length < 2 ? '' :
    `<div class="ofg"><span class="ofl">${esc(label)}</span>
      <button class="ofc${OSEL[key] === '' ? ' on' : ''}" data-of="${key}" data-ofv="">${esc(x('any'))}</button>
      ${vals.map(v => `<button class="ofc${String(OSEL[key]) === String(v) ? ' on' : ''}" data-of="${key}" data-ofv="${esc(String(v))}">${esc(fmt(v))}</button>`).join('')}</div>`;

  return `<div class="shell">
    <div class="navrow">${backLink('#/p/' + p.id, fullName(p))}
      <nav class="crumb"><span>${esc(x('allOffers'))}</span></nav></div>
    <div class="ofhead">
      <span class="t"><img src="${esc(colorPhoto(p, OSEL.color) || THUMB(p.id))}" alt="" loading="lazy"></span>
      <div>
        <h1>${esc(fullName(p))}${nameTag(p)}</h1>
        <p class="ofsub">${esc(nx(all.length, 'offersLbl') + ' ' + fromShops(shopCount(all)))}</p>
      </div>
    </div>
    <div class="offilters">
      ${chips('storage', stors, t('f.storage'), gb)}
      ${chips('ram', rams, t('f.ram'), v => v + ' ' + u('gb'))}
      ${chips('size', sizes, t('f.screen'), inch)}
      ${chips('esim', simVals, t('f.sim'), v => v === 'e' ? 'eSIM' : v === 'n' ? 'Nano-SIM' : x('variantUnknown'))}
      ${chips('cell', two(cells), x('connF'), v => cellLbl(v === 'c'))}
      ${cols.length < 2 ? '' : `<div class="ofg"><span class="ofl">${esc(t('f.color'))}</span>
        <button class="ofc${OSEL.color === '' ? ' on' : ''}" data-of="color" data-ofv="">${esc(x('any'))}</button>
        <span class="cs ofcs">${cols.map(c => `<button data-of="color" data-ofv="${esc(c)}" style="--c:${swatch(c)}"
          title="${esc(c)}" aria-label="${esc(c)}" aria-pressed="${OSEL.color === c}"
          class="${OSEL.color === c ? 'on' : ''}"></button>`).join('')}</span></div>`}
      <!-- the chip label is the shop's English word; the page is not -->
    </div>
    <div class="resbar"><h2>${esc(t('common.results_count').replace('{n}', list.length))}</h2>
      ${(() => {
        // A saving is only real between rows you could actually swap: same capacity.
        // Unfiltered, this list spans 256 GB to 2 TB and the spread would be meaningless.
        const tiers = new Set(list.map(o => o.storage ?? 'base'));
        return list.length > 1 && hi > lo && tiers.size === 1
          ? `<span class="cnt">${esc(x('saveUpTo'))} <b class="num">${money(hi - lo)} ֏</b></span>`
          : (tiers.size > 1 ? `<span class="cnt">${esc(x('pickCapacity'))}</span>` : '');
      })()}</div>
    ${list.length ? `<ol class="olist">${list.map((o, i) => offerRow(o, lo, i, p.variantUnit, '', p, true)).join('')}</ol>`
      : `<p class="empty" style="padding:30px 0"><b>${esc(x('noOffers'))}</b></p>`}
    <p class="note">${esc(x('priceSrc'))} · ${esc(x('updated'))} ${esc(updatedOn())}</p>
  </div>`;
}

/* ================= compare ================= */
// A mistyped or outdated product link used to fall through to the catalogue without a word.
function notFoundView() {
  const top = DATA.filter(hasReal).sort((a, b) => b.popularity - a.popularity).slice(0, 4);
  return `<div class="shell"><div class="empty nf">
    <h1 class="emptyh">${esc(x('nfT'))}</h1><p>${esc(x('nfS'))}</p>
    <a class="btn" href="#/">${esc(t('nav.catalog'))}</a></div>
