<style>
/* ================= tokens ================= */
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --surface2:#F1EBE1; --shot:#EFE9DF;
  --text:#161C28; --body:#4A5262; --muted:#828B9A;
  --line:#E6DFD4; --line2:#D9D0C2;
  --brand:#9E2B25; --brand-ink:#FFFFFF; --brand-soft:#F6E4E1; --brand-2:#7E1F1B;
  --apricot:#B8443C; --apricot-soft:#F7E5E3;
  --plum:#3E6B8A; --plum-soft:#E7EEF3;
  --good:#2F7A57; --good-soft:#E4F0EA; --bad:#C0392B;
  --hot:#161C28; --hot-soft:#EFE9DF;
  /* masthead shares the page surface: nav, hero and catalogue are one field */
  --nav:transparent; --nav-ink:var(--text); --nav-muted:var(--muted);
  --shadow-s:0 1px 2px rgba(20,19,20,.05);
  --shadow-m:0 2px 4px rgba(20,19,20,.04), 0 12px 28px -14px rgba(20,19,20,.16);
  --shadow-l:0 4px 10px rgba(20,19,20,.05), 0 28px 60px -28px rgba(20,19,20,.26);
  --r-xl:20px; --r-lg:14px; --r-md:10px; --r-sm:8px; --pill:50px;
  --ui:'Manrope','Noto Sans Armenian','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono','Noto Sans Armenian',ui-monospace,monospace;
  --maxw:1240px;
}
/* Two themes only: the cream one above and the dark one below. The black/orange third
   theme is gone; [data-theme="dark"] repeats the media block because a media query and
   an attribute selector cannot share a rule - keep the two lists identical. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151D; --surface:#1A1E29; --surface2:#232837;
    /* The photo tile stays LIGHT in dark mode. Product shots are cut out of a white
       studio backdrop, so a black phone, black headphones or a black Xbox on a #232837
       tile is a black shape on a black square - half the catalogue was invisible. */
    --shot:#EDEFF3;
    --text:#F2EEE7; --body:#B3BBC9; --muted:#8B93A3;
    --line:#282D3B; --line2:#38404F;
    --brand:#E4574F; --brand-ink:#12151D; --brand-soft:#3A1E1C; --brand-2:#F0726A;
    --apricot:#D9736B; --apricot-soft:#3A2220;
    --plum:#8FB6CE; --plum-soft:#1E2836;
    --good:#5FC79A; --good-soft:#16301F; --bad:#F08076;
    --hot:#F2EEE7; --hot-soft:#282D3B;
    --nav:transparent; --nav-ink:var(--text); --nav-muted:var(--muted);
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
    --shadow-l:0 4px 10px rgba(0,0,0,.35), 0 28px 60px -28px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
    --bg:#12151D; --surface:#1A1E29; --surface2:#232837;
    /* The photo tile stays LIGHT in dark mode. Product shots are cut out of a white
       studio backdrop, so a black phone, black headphones or a black Xbox on a #232837
       tile is a black shape on a black square - half the catalogue was invisible. */
    --shot:#EDEFF3;
    --text:#F2EEE7; --body:#B3BBC9; --muted:#8B93A3;
    --line:#282D3B; --line2:#38404F;
    --brand:#E4574F; --brand-ink:#12151D; --brand-soft:#3A1E1C; --brand-2:#F0726A;
    --apricot:#D9736B; --apricot-soft:#3A2220;
    --plum:#8FB6CE; --plum-soft:#1E2836;
    --good:#5FC79A; --good-soft:#16301F; --bad:#F08076;
    --hot:#F2EEE7; --hot-soft:#282D3B;
    --nav:transparent; --nav-ink:var(--text); --nav-muted:var(--muted);
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 2px 4px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.7);
    --shadow-l:0 4px 10px rgba(0,0,0,.35), 0 28px 60px -28px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* rem, not px: a reader who raises their browser's default text size gets a bigger UI.
   Structural values (borders, small gaps) stay in px on purpose. */
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:1rem;line-height:1.6;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance;line-height:1.18}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:where(a,button,input,select,summary,[tabindex]):focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
/* render() focuses the new page's heading so a screen reader announces it. That is not a
   keyboard action, so it must not draw a focus ring round the title. */
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;background:var(--surface);padding:10px 14px;border-radius:8px;z-index:99}
.skip:focus{left:10px;top:10px}
.shell{max-width:var(--maxw);margin:0 auto;padding:0 20px}
@media (max-width:600px){.shell{padding:0 14px}}
/* A 1240px column on a 2560px monitor is 660px of empty gutter each side and still only four
   cards per row. The content column grows in two steps instead, which the auto-fill grid below
   turns into more cards per row rather than wider ones. */
@media (min-width:1500px){:root{--maxw:1420px}}
@media (min-width:1920px){:root{--maxw:1680px}}

/* ============ masthead: nav, cover and catalogue are ONE ivory field ============ */
.mast{background:var(--bg);color:var(--text)}
.topnav{display:flex;align-items:center;gap:16px;height:74px}
.topnav .logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.03em;color:var(--text);flex:none}
.topnav .logo .m{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
.nav{display:flex;gap:2px;flex:none}
.nav a{padding:8px 12px;border-radius:0;font-weight:600;font-size:0.875rem;color:var(--muted);
  box-shadow:inset 0 -1px 0 transparent}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);box-shadow:inset 0 -2px 0 var(--brand)}
@media (max-width:900px){.nav{display:none}}
.srch{flex:1 1 auto;min-width:0;position:relative;max-width:340px}
.srch input{width:100%;height:40px;padding:0 15px 0 38px;border-radius:0;border:0;
  border-bottom:1px solid var(--line2);background:none;color:var(--text);font-size:0.875rem}
.srch input::placeholder{color:var(--muted)}
.srch input:focus{outline:none;border-bottom-color:var(--brand)}
.srch svg{position:absolute;left:12px;top:12px;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
.mast-r{display:flex;align-items:center;gap:2px;flex:none}
.langs{display:flex;align-items:center}
.langs button{background:none;border:0;color:var(--muted);cursor:pointer;padding:7px 7px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;line-height:1}
.langs button:hover{color:var(--text)}
.langs button[aria-pressed="true"]{color:var(--text);text-decoration:underline;text-underline-offset:4px;
  text-decoration-color:var(--brand);text-decoration-thickness:2px}
.th{width:34px;height:34px;background:none;border:0;color:var(--muted);cursor:pointer;
  display:grid;place-items:center;margin-left:4px}
.th svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.th:hover{color:var(--text)}
.cmpbtn{flex:none;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:var(--pill);
  border:1px solid var(--text);background:none;color:var(--text);font-weight:600;font-size:0.844rem;
  cursor:pointer;white-space:nowrap;margin-left:10px}
.cmpbtn.ghost{border-color:var(--line2);color:var(--body)}
.cmpbtn.ghost:hover{background:var(--surface2);color:var(--text);border-color:var(--text)}
.cmpbtn:hover{background:var(--text);color:var(--bg)}
.cmpbtn .c{min-width:20px;height:20px;padding:0 6px;border-radius:var(--pill);background:var(--brand);color:#fff;
  font-size:11.5px;font-weight:700;display:grid;place-items:center}
.cmpbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
@media (max-width:640px){.cmpbtn span.lbl{display:none}.cmpbtn{padding:0 11px}}
@media (max-width:820px){
  .topnav{flex-wrap:wrap;height:auto;padding-block:12px;gap:10px}
  .topnav .logo{order:1}.mast-r{order:2;margin-left:auto}
  .srch{order:3;flex:1 1 100%;max-width:none}
  .cmpbtn{margin-left:4px}
}

/* ---- cover: the phone overlaps the headline, apricot rule ties them ---- */
.mast-hero{padding-block:8px 0}
.cv-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--brand);display:flex;align-items:center;gap:10px}
.cv-eyebrow::after{content:"";flex:1;height:1px;background:var(--line2)}
.cv{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,330px);
  gap:10px;align-items:end;margin-top:18px}
.cv-h{font-size:clamp(40px,9vw,116px);font-weight:800;letter-spacing:-.055em;line-height:.86;
  position:relative;z-index:2;max-width:13ch}
.cv-h em{font-style:normal;color:var(--brand)}
.cv-m{position:relative;z-index:1;display:grid;place-items:end center;margin-bottom:-8px}
/* All hero slides share one grid cell; a timer moves the .on class and opacity does the rest.
   Under reduced motion the global rule drops the transition, so the picture cuts instead of
   fading - it still changes, which is the part that carries information. */
.cv-s{grid-area:1/1;display:grid;place-items:end center;opacity:0;pointer-events:none;
  transition:opacity .8s ease}
.cv-s.on{opacity:1;pointer-events:auto}
.cv-m img{max-height:400px;width:auto;filter:drop-shadow(0 26px 44px rgba(22,28,40,.24))}
/* Column 2 so they sit under the phone, not under the headline. */
.cv-dots{grid-column:2;display:flex;justify-content:center;gap:3px;margin-top:8px}
/* A 4px mark inside a 20px target: the button is the hit area, the ::before is all you see.
   The current slide grows sideways into a short bar instead of a big circle - it reads as
   "you are here" at a glance and still never gets taller than 4px. */
.cv-dots button{width:20px;height:20px;padding:0;border:0;background:none;cursor:pointer;
  display:grid;place-items:center}
.cv-dots button::before{content:"";width:3px;height:3px;border-radius:999px;background:var(--line2);
  transition:width .3s ease,background .3s ease}
.cv-dots button:hover::before{background:var(--muted)}
.cv-dots button.on::before{width:11px;background:var(--brand)}
.cv-sub{grid-column:1;color:var(--body);font-size:1.03rem;max-width:44ch;margin-top:20px;position:relative;z-index:2}
.cv-acts{grid-column:1;display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;position:relative;z-index:2}
.cv-bar{display:flex;flex-wrap:wrap;gap:8px 30px;align-items:baseline;
  border-top:2px solid var(--apricot);padding-top:14px;margin-top:26px}
.cv-bar div{display:flex;align-items:baseline;gap:8px}
.cv-bar b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.cv-bar span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (max-width:860px){
  .cv{grid-template-columns:1fr;gap:0;align-items:start}
  .cv-m{order:-1;place-items:center;margin-bottom:6px}
  .cv-dots{grid-column:1;order:-1;margin:0 0 10px}
  .cv-m img{max-height:220px}
  .cv-h{max-width:none}
}

/* ---- savings strip: real spread between shops, the thing only this site knows ---- */
.save-sec{margin-top:52px}
.save-hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.save-hd h2{font-size:26px;font-weight:800;letter-spacing:-.035em}
.save-hd p{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.save-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1000px){.save-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.save-grid{grid-template-columns:1fr}}
.sv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;
  transition:border-color .14s}
.sv:hover{border-color:var(--brand)}
.sv .t{background:var(--shot);border-radius:var(--r-md);height:86px;padding:8px;overflow:hidden}
.sv .t img{width:100%;height:100%;object-fit:contain}
/* these are <span>s: without display:block the name and the price share a line and the
   figure wraps mid-number ("...Pro 5G 49" / "900 D"). */
.sv>span:last-child{display:block;min-width:0}
.sv .nm{display:block;font-size:0.906rem;font-weight:700;line-height:1.25}
.sv .amt{display:block;font-size:23px;font-weight:800;letter-spacing:-.035em;color:var(--brand);
  margin-top:4px;white-space:nowrap}
.sv .amt small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);font-weight:400;margin-top:2px}
.sv .bar{display:block;position:relative;height:6px;border-radius:3px;background:var(--surface2);margin-top:10px;overflow:hidden}
.sv .bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--apricot)}
.sv .rng{display:flex;justify-content:space-between;white-space:nowrap;font-family:var(--mono);font-size:10px;
  color:var(--muted);margin-top:5px;letter-spacing:.05em}

/* ================= buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 26px;
  border-radius:var(--pill);border:1px solid transparent;background:var(--brand);color:var(--brand-ink);
  font-weight:700;font-size:0.906rem;cursor:pointer;white-space:nowrap;transition:transform .12s ease,background .12s ease}
.btn:hover{background:var(--brand-2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--line2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{height:38px;padding:0 16px;font-size:0.844rem}
.btn.block{width:100%}

/* ================= filter bar ================= */
/* category navigation: one always-visible row, current item marked */
/* construct: category cards, then one block per question */
.cnh{font-size:clamp(30px,4.6vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:18px 0 0}
.clead{color:var(--body);font-size:1.0625rem;max-width:58ch;margin:10px 0 0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.ccard{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--text);
  font-size:1rem;font-weight:700;text-align:left;transition:border-color .12s,background .12s,color .12s}
.ccard:hover{border-color:var(--text)}
.ccard.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.ccard .num{font-weight:600;font-size:0.875rem;opacity:.6}
.cq{margin-top:26px}
.cq h3{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px}
.cqrow{display:flex;flex-wrap:wrap;gap:8px}
.cchip{height:42px;padding:0 17px;border-radius:var(--pill);cursor:pointer;font-size:0.9375rem;font-weight:600;
  border:1.5px solid var(--line2);background:var(--surface);color:var(--text);transition:background .12s,border-color .12s,color .12s}
.cchip:hover{border-color:var(--text)}
.cchip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.cfixed{margin-top:26px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface2);
  color:var(--body);font-size:0.9375rem}
.cfixed b{color:var(--text)}
.cgo{margin:28px 0 10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cnone{color:var(--brand);font-weight:600;font-size:0.9375rem}
@media (max-width:640px){.cgrid{grid-template-columns:1fr 1fr}.ccard{padding:13px 14px;font-size:0.9375rem}}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:22px 0 4px}
.ctabs .ctab{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--pill);
  border:1px solid var(--line);background:var(--surface);color:var(--body);font-weight:600;font-size:0.9375rem;
  transition:border-color .12s,color .12s,background .12s}
.ctabs .ctab:hover{border-color:var(--line2);color:var(--text)}
.ctabs .ctab.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.ctabs .ctab b{font-weight:600;font-size:0.8125rem;opacity:.6}
@media (max-width:640px){.ctabs{gap:5px;margin-top:16px}.ctabs .ctab{height:34px;padding:0 12px;font-size:0.875rem}}
/* No overflow here: overflow-x:auto makes overflow-y compute to auto too, which clipped every
   filter dropdown to the 46px-tall bar on desktop. Wrapping costs a row and keeps them visible. */
.fbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:26px 0 0;padding-bottom:4px}
.fbar::-webkit-scrollbar{display:none}
.fdrop{position:relative;flex:none}
.fdrop>summary{list-style:none;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px;
  border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:0.875rem;
  cursor:pointer;white-space:nowrap;user-select:none}
.fdrop>summary::-webkit-details-marker{display:none}
.fdrop>summary:hover{border-color:var(--line2)}
.fdrop[open]>summary,.fdrop.on>summary{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.fdrop>summary svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .15s}
.fdrop[open]>summary svg{transform:rotate(180deg)}
.fdrop:not([open]) .panel{display:none}
.fdrop .panel{position:absolute;top:50px;left:0;z-index:50;min-width:250px;max-height:340px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-l);padding:8px}
.fdrop.r .panel{left:auto;right:0}
@media (max-width:640px){.fdrop .panel{position:fixed;left:10px;right:10px;top:auto;bottom:10px;min-width:0;max-height:60vh}}
.opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:0.906rem}
.opt:hover{background:var(--surface2)}
.opt input{width:17px;height:17px;accent-color:var(--brand);margin:0;flex:none}
.opt .n{margin-left:auto;font-size:12.5px;color:var(--muted)}
.fbar .spacer{flex:1 1 auto;min-width:4px}
.toggle{flex:none;display:inline-flex;align-items:center;height:42px;padding:0 15px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:0.875rem;cursor:pointer;white-space:nowrap}
.toggle[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.rngbox{padding:12px 10px 6px}
.rng{position:relative;height:26px}
.rng .track{position:absolute;left:0;right:0;top:12px;height:3px;border-radius:2px;background:var(--line2)}
.rng .fill{position:absolute;top:12px;height:3px;border-radius:2px;background:var(--brand)}
.rng input{position:absolute;left:0;top:4px;width:100%;height:18px;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;
  background:var(--surface);border:2px solid var(--brand);box-shadow:var(--shadow-s);cursor:pointer}
.rng input::-moz-range-thumb{pointer-events:auto;width:15px;height:15px;border-radius:50%;background:var(--surface);
  border:2px solid var(--brand);cursor:pointer}
.rngv{display:flex;justify-content:space-between;font-size:0.8125rem;font-weight:600;padding-top:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.note{font-size:0.8125rem;color:var(--muted);margin-top:12px}
.save{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--brand);margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 8px 0 13px;border-radius:999px;
  background:var(--brand-soft);color:var(--brand);border:0;font-size:0.8125rem;font-weight:600;cursor:pointer}
.chip x{font-size:15px;line-height:1;opacity:.65}
.chip:hover x{opacity:1}
.chip.clear{background:none;color:var(--muted);padding:0 12px}
.chip.clear:hover{color:var(--text)}

.resbar{display:flex;align-items:baseline;gap:10px;margin:22px 0 14px}
.resbar h2{font-size:26px;font-weight:800;letter-spacing:-.035em}
.resbar .cnt{font-size:0.875rem;color:var(--muted);font-weight:500}

/* ================= product grid ================= */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
/* auto-fill lands one card short on a tablet - 768px minus the shell padding and a scrollbar is
   just under what three 232px columns need - so the tablet range asks for three outright. */
@media (min-width:620px) and (max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;
  display:flex;flex-direction:column;position:relative;transition:box-shadow .16s ease,transform .16s ease,border-color .16s}
.pcard:hover{border-color:var(--text);box-shadow:none;transform:none}
.pshot{position:relative;background:var(--shot);border-radius:var(--r-md);height:190px;display:block;padding:14px;overflow:hidden}
@media (max-width:520px){.pshot{height:140px;padding:10px}}
.fav{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;cursor:pointer;z-index:2}
.fav svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;transition:transform .15s ease}
/* already compared: the plus turns into the x that removes it */
.fav[aria-pressed="true"] svg{transform:rotate(45deg)}
.fav:hover svg{stroke:var(--brand)}
.fav[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
.fav[aria-pressed="true"] svg{stroke:var(--brand-ink)}
/* a card that cannot join the current comparison fades back rather than disappearing */
.fav.off{opacity:.25;transition:opacity .35s ease}
.fav{transition:opacity .35s ease}
.badge{position:absolute;top:10px;left:10px;height:22px;padding:0 10px;border-radius:var(--pill);background:var(--text);
  color:var(--bg);font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;display:inline-flex;align-items:center;z-index:2;letter-spacing:.01em}
.pbody{padding:12px 4px 2px;display:flex;flex-direction:column;flex:1}

/* ================= compare ================= */
.cwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-s);
  margin-top:18px;overflow:clip}
.chead{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:var(--cols)}
.chead .pad{border-right:1px solid var(--line)}
@media (max-width:760px){.chead .pad,.cphotos .pad{display:none}}
.ccol{padding:11px 26px 11px 10px;text-align:center;position:relative;border-right:1px solid var(--line)}
/* The photos are their own row ABOVE the sticky bar, so they scroll out of view the way any
   other content does. Animating them in and out of the sticky header meant resizing a
   sticky element that sits on top of an 80-row grid, and every frame of that is a full
   relayout - which is what made scrolling stall. Nothing here animates, so nothing can stutter. */
.cphotos{display:grid;grid-template-columns:var(--cols);border-bottom:1px solid var(--line);background:var(--surface)}
.cphotos .pad{border-right:1px solid var(--line)}
.cphotos .c{padding:16px 10px;border-right:1px solid var(--line);display:grid;place-items:center}
.cphotos .c:last-child{border-right:0}
.cphotos img{max-height:clamp(84px,13vw,170px);width:auto;max-width:100%}
.ccol:last-child{border-right:0}
.ccol b{font-size:0.8125rem;font-weight:700;display:block;line-height:1.25}
.ccol .x{position:absolute;top:50%;right:5px;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);color:var(--muted);cursor:pointer;line-height:1;font-size:13px;display:grid;place-items:center}
.ccol .x:hover{color:var(--hot);border-color:var(--hot)}
.ctable{display:grid;grid-template-columns:var(--cols)}
.ctable .grp{grid-column:1/-1;background:var(--surface2);padding:9px 16px;font-size:12.5px;font-weight:800;
  letter-spacing:.03em;text-transform:none;color:var(--body);border-block:1px solid var(--line)}
.ctable .k,.ctable .c{padding:11px 12px;font-size:0.844rem;border-bottom:1px solid var(--line);min-height:44px;
  display:flex;align-items:center}
.ctable .k{color:var(--muted);font-size:12.5px;justify-content:flex-end;text-align:right;border-right:1px solid var(--line)}
.ctable .c{font-weight:600;justify-content:center;text-align:center;border-right:1px solid var(--line)}
.ctable .c:last-child{border-right:0}
.ctable .c.worse{color:var(--bad);font-weight:700}

/* ---- compare: the add button and the picker it opens ---- */
/* The refused-pick message, all that is left of the compare bar. Fixed, centred, fades. */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;margin:0;
  background:var(--text);color:var(--bg);padding:11px 20px;border-radius:var(--pill);
  font-size:0.9375rem;font-weight:600;box-shadow:var(--shadow-m);opacity:0;transition:opacity .25s ease;
  max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}
.addbtn{display:inline-flex;align-items:center;gap:7px}
/* The comparison arrives rather than appearing: columns and rows fade up together. Opacity and
   a small lift, so reduced motion keeps the fade and drops the movement. */
.cwrap .cphotos,.cwrap .chead,.cwrap .ctable{animation:cmpIn .34s cubic-bezier(.2,.7,.3,1) both}
.cwrap .chead{animation-delay:.04s}
.cwrap .ctable{animation-delay:.08s}
@keyframes cmpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* the rule above is killed under reduced motion, which would leave opacity:0 forever */
@media (prefers-reduced-motion:reduce){
  .cwrap .cphotos,.cwrap .chead,.cwrap .ctable{animation:none;opacity:1;transform:none}
}
.addslot{width:100%;min-height:84px;border:1.5px dashed var(--line2);border-radius:var(--r-md);
  background:none;cursor:pointer;display:grid;place-items:center;transition:border-color .2s ease,background .2s ease}
.addslot:hover{border-color:var(--brand);background:var(--brand-soft)}

.addlbl{color:var(--muted);font-weight:600}
.addbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
/* Opacity carries the fade, so it survives the reduced-motion rule; the small lift is the part
   that rule drops. Hiding is delayed in JS by the same 200ms, or the fade never runs. */
.cmodal{position:fixed;inset:0;z-index:60;background:rgba(12,16,24,.55);
  display:grid;place-items:center;padding:20px;opacity:0;transition:opacity .2s ease}
.cmodal.on{opacity:1}
.cmbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  width:min(560px,100%);max-height:min(80vh,640px);overflow:auto;padding:22px;position:relative;
  box-shadow:var(--shadow-m);transform:translateY(8px);transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.cmodal.on .cmbox{transform:none}
.cmbox h2{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:0 0 14px}
.cmx{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;
  background:var(--surface2);color:var(--muted);font-size:19px;cursor:pointer}
.cmx:hover{background:var(--brand);color:var(--brand-ink)}
#cmq{width:100%;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:var(--pill);
  background:var(--bg);color:var(--text);margin-bottom:12px}
.cmres{display:grid;gap:4px}

  width:100%;text-align:left;padding:7px 9px;border:0;border-radius:var(--r-md);

.cmrow i{font-style:normal;font-size:0.8125rem;color:var(--muted)}
.cmnone{color:var(--muted);font-size:0.875rem;padding:10px 2px}
.cmnow{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}

.cmnow .cmrow{cursor:default}

.cmnow .x{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;
  color:var(--muted);cursor:pointer;font-size:17px}

.pcard{cursor:pointer}

  .chead,.ctable,.cphotos{grid-template-columns:repeat(var(--n),1fr)}

/* Two groups, not one row with a stretchy spacer: when the row ran out of width the spacer

.cbar-l,.cbar-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}

  box-shadow:0 -8px 30px -14px rgba(20,28,64,.3)}

.pprice s{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--muted);letter-spacing:.07em;text-decoration:none;text-transform:uppercase}


/* every product thumbnail is presented in a fixed box and letterboxed the same way,
   so a wide front+back render and a narrow single-phone render read at the same scale */
/* Product thumbnails: the box owns the size, the image only fits inside it.
   max-* are belt-and-braces so a tall cutout can never spill over the table. */
.pshot img,.sim .t img,.ccol .t img,.tslot img{
  width:100%;height:100%;max-width:100%;max-height:100%;
  object-fit:contain;object-position:center}
/* Two stacked shots per card so the colour can crossfade; only opacity moves.
   1.4s and eased at both ends: at .7s the swap still read as a blink.
   The size must be spelled out: a replaced element with width:auto takes its INTRINSIC width,
   so inset alone left every cycling photo at natural size in the top-left corner instead of
   contained and centred the way the static cards are. */
.pshot[data-cyc]{--cyc-pad:14px}
.pshot[data-cyc] img{position:absolute;inset:var(--cyc-pad);
  width:calc(100% - 2 * var(--cyc-pad));height:calc(100% - 2 * var(--cyc-pad));
  object-fit:contain;object-position:center;opacity:0;
  transition:opacity 1.4s cubic-bezier(.4,0,.2,1)}
.pshot[data-cyc] img.on{opacity:1}
@media (max-width:520px){.pshot[data-cyc]{--cyc-pad:10px}}
.pshot,.sim .t,.ccol .t,.tslot{overflow:hidden}
/* the compare header must grow with its content, never clip the name onto the photo */
.ccol{min-width:0;height:auto}

  .ocards{grid-template-columns:1fr}
}
/* below this the two-up cards get too cramped to read */
@media (max-width:330px){.grid{grid-template-columns:1fr}}


/* ---- compare: the differences are the whole point, so make them read first ---- */
/* the row is no longer tinted end to end - only the losing VALUE is marked */
.ctable .k.row-diff{color:var(--text);font-weight:700}
.ctable .k.row-diff::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);
  margin-left:8px;flex:none}
.ctable .row-same{color:var(--muted)}
.ctable .c.row-same{font-weight:500}
.dcount,.scount{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;
  font-size:0.8125rem;font-weight:700}
.dcount{background:var(--brand-soft);color:var(--brand)}
.dcount i{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.scount{background:var(--surface2);color:var(--muted)}

/* ---- where to buy, as a ranked list ---- */
.olist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden}
.olist li+li{border-top:1px solid var(--line)}
.orow{display:grid;grid-template-columns:34px minmax(0,1.1fr) minmax(0,1.4fr) auto 110px 22px;
  gap:14px;align-items:center;padding:15px 18px;transition:background .12s}
.orow:hover{background:var(--surface2)}
.orow .rk{font-size:12px;color:var(--muted);font-weight:700}
.orow .sh{font-weight:700;font-size:0.97rem;overflow-wrap:anywhere}
.orow .vr{font-size:0.8125rem;color:var(--muted);overflow-wrap:anywhere}
.orow .pr{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.orow .dl{text-align:right;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.orow .ar{color:var(--muted);font-size:15px}
.orow:hover .ar{color:var(--brand)}
.orow.best{background:var(--good-soft)}
.orow.best .dl{color:var(--good)}
.orow.best .rk{color:var(--good)}
.orow.best:hover{background:var(--good-soft)}
@media (max-width:760px){
  .orow{grid-template-columns:28px 1fr auto;row-gap:3px;padding:13px 14px}
  .orow .vr{grid-column:2/-1;order:3}
  .orow .dl{grid-column:2/-1;order:4;text-align:left}
  .orow .ar{display:none}
}


/* warranty: linked only for shops that publish terms, named plainly for those that don't */
.warr{font-size:0.8125rem;color:var(--muted);margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.warr b{color:var(--text);font-weight:700}
.warr a{color:var(--brand);font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.warr a:hover{border-color:var(--brand);background:var(--brand-soft)}
.warr .nw{opacity:.75}

/* ---- price history ---- */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-top:10px}
.hist svg{width:100%;height:120px;display:block}
.hist .ha{fill:var(--apricot-soft);stroke:none}
.hist .hl{fill:none;stroke:var(--apricot);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hist .hd{fill:var(--brand)}
.hist-ax{display:flex;justify-content:space-between;gap:12px;margin-top:10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted)}
.hist-ax .dn{color:var(--good);font-weight:600}
.hist-ax .up{color:var(--brand);font-weight:600}

/* ---- expandable offer list + all-offers page ---- */
.olist .more{display:none}
.olist.all .more{display:list-item}
.expand{margin-top:10px;height:42px;padding:0 18px;border-radius:var(--pill);border:1px solid var(--line2);
  background:var(--surface);color:var(--text);font-weight:600;font-size:0.875rem;cursor:pointer}
.expand:hover{border-color:var(--text)}
.expand b{color:var(--brand)}
.allofflink{margin-top:10px;font-size:0.875rem}
.allofflink a{color:var(--brand);font-weight:700;border-bottom:1px solid currentColor;padding-bottom:1px}
.ofhead{display:flex;align-items:center;gap:18px;margin:14px 0 6px}
.ofhead .t{width:76px;height:92px;background:var(--shot);border-radius:var(--r-md);padding:8px;flex:none;overflow:hidden}
.ofhead .t img{width:100%;height:100%;object-fit:contain}
.ofhead h1{font-size:clamp(24px,3.4vw,38px);font-weight:800;letter-spacing:-.035em}
.ofsub{color:var(--muted);font-size:0.875rem;margin-top:5px}
.ofsub b{color:var(--text)}
.offilters{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.ofg{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.ofl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  width:110px;flex:none}
.ofc{height:34px;padding:0 13px;border-radius:var(--pill);border:1px solid var(--line2);background:var(--surface);
  font-size:0.844rem;font-weight:600;cursor:pointer}
.ofc:hover{border-color:var(--text)}
.ofc.on{background:var(--text);color:var(--bg);border-color:var(--text)}
@media (max-width:600px){.ofl{width:100%}}

/* stock status on each offer */
.orow .ins,.orow .oos{display:block;font-style:normal;font-size:0.6875rem;font-weight:600;margin-top:2px}
.orow .ins{color:var(--good)}
.orow .oos{color:var(--muted)}
.hist .hh{fill:none;stroke:var(--apricot);stroke-width:1;stroke-dasharray:3 3;opacity:.75;vector-effect:non-scaling-stroke}

/* return control */
.navrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 2px}
.backbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--pill);
  border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:0.875rem;flex:none}
.backbtn:hover{border-color:var(--text);background:var(--surface2)}
.backbtn span{font-size:1rem;line-height:1}
.navrow .crumb{padding:0}

/* Reduced motion is about things MOVING, not about things fading: a cross-fade has no
   direction and no displacement. So keyframe animations and every transform transition still
   go, and opacity is the one property left free - which is what makes the hero and the card
   colour changes dissolve rather than cut for anyone with the setting on. */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-property:opacity!important}}
</style></head><body>

const PMIN = Math.floor(Math.min(..._allPrices) / 5000) * 5000;
const PMAX = Math.ceil(Math.max(..._allPrices) / 5000) * 5000;

// so a stale range silently hides phones that drifted outside it. Remember the bounds the
// filter was set against and reset it whenever the catalogue's own range has changed.
if (!st.pmin || !st.pmax || st.bounds?.[0] !== PMIN || st.bounds?.[1] !== PMAX) {
  st.pmin = PMIN; st.pmax = PMAX;
}

st.cmp = st.cmp.filter(id => DATA.some(p => p.id === id)).slice(0, MAXCMP);

// Plot only days we actually recorded. One point is not a trend, so it says so instead.
function historyHTML(p) {
  const pts = HIST[p.id] || [];
  if (!pts.length) return '';
  if (pts.length < 2) return `<h2 class="sh">${esc(x('histT'))}</h2>
    <p class="note">${esc(x('noHist'))} · ${esc(x('trackSince'))} ${esc(dmy(pts[0].d))}</p>`;
  const W = 640, H = 120, pad = 8;
  const lo = Math.min(...pts.map(v => v.lo)), hi = Math.max(...pts.map(v => v.hi));
  const span = hi - lo || 1;
  const xs = i => pad + i * (W - pad * 2) / (pts.length - 1);
  const ys = v => pad + (1 - (v - lo) / span) * (H - pad * 2);
  // plot the whole daily range: cheapest line, dearest line, band between them
  const d = pts.map((v, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)} ${ys(v.lo).toFixed(1)}`).join(' ');
  const dHi = pts.map((v, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)} ${ys(v.hi).toFixed(1)}`).join(' ');
  const band = dHi + ' ' + pts.slice().reverse().map((v, i) =>
    `L${xs(pts.length - 1 - i).toFixed(1)} ${ys(v.lo).toFixed(1)}`).join(' ') + ' Z';
  const last = pts[pts.length - 1], first = pts[0];
  const delta = last.lo - first.lo;
  return `<h2 class="sh">${esc(x('histT'))}</h2>
    <div class="hist">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
        aria-label="${esc(x('histT'))}: ${money(first.lo)} - ${money(last.lo)} AMD">
        <path class="ha" d="${band}"/><path class="hh" d="${dHi}"/><path class="hl" d="${d}"/>
        <circle class="hd" cx="${xs(pts.length - 1).toFixed(1)}" cy="${ys(last.lo).toFixed(1)}" r="4"/>
      </svg>
      <div class="hist-ax">
        <span>${esc(dmy(first.d))} · ${money(first.lo)}–${money(first.hi)} ֏</span>
        <span class="${delta < 0 ? 'dn' : delta > 0 ? 'up' : ''}">${delta === 0 ? '—' : (delta < 0 ? '↓ ' : '↑ ') + money(Math.abs(delta)) + ' ֏'}</span>
        <span>${esc(dmy(last.d))} · ${money(last.lo)}–${money(last.hi)} ֏</span>
      </div>
    </div>`;
}
const updatedOn = () => P.generated ? P.generated.slice(8, 10) + '.' + P.generated.slice(5, 7) + '.' + P.generated.slice(0, 4) : '';

/* ================= filtering ================= */
function matches(p, s) {
  if (s.cat && (p.category || 'phone') !== s.cat) return false;   // same default inView()/catTabs() use
  const q = s.q.trim().toLowerCase();
  if (q && !(p.brand + ' ' + fullName(p) + ' ' + (p.chipset?.name || '')).toLowerCase().includes(q)) return false;
  if (s.brands.length && !s.brands.includes(p.brand)) return false;
  const pr = bestOf(p);
  if (pr < s.pmin || pr > s.pmax) return false;
  if (s.ram && !(p.variants || []).some(v => v.ram >= s.ram)) return false;
  if (s.stor && !(p.variants || []).some(v => v.storage >= s.stor)) return false;
  // an ACTIVE spec filter excludes anything without that spec: earbuds have no screen, so
  // they must not slip through a "120 Hz or more" filter merely by lacking the field
  if (s.batt && !(p.battery?.capacity >= s.batt)) return false;
  if (s.hz && !(p.display?.refresh >= s.hz)) return false;
  if (s.g5 && !/5G/i.test(p.connectivity?.network || '')) return false;
  if (s.nfc && !p.connectivity?.nfc) return false;
  const d = p.display?.size;
  if (s.scrmin && !(d >= s.scrmin)) return false;
  // 1 = must have a touchscreen, 2 = must not; 0 = do not care
  if (s.touch && p.display?.touch !== (s.touch === 1)) return false;
  if (s.scr) {
    if (d == null) return false;
    if (s.scr === 'lt63' && d >= 6.3) return false;
    if (s.scr === 'mid' && (d < 6.3 || d > 6.7)) return false;
    if (s.scr === 'gt67' && d <= 6.7) return false;
  }
  return true;
}
const spreadOf = p => { const o = offersFor(p); return o.length > 1 ? o[o.length - 1].price - o[0].price : 0; };
const SORTS = {
  popular: (a, b) => b.popularity - a.popularity,
  price_asc: (a, b) => bestOf(a) - bestOf(b),
  price_desc: (a, b) => bestOf(b) - bestOf(a),
  newest: (a, b) => (b.released || '').localeCompare(a.released || ''),
  brand: (a, b) => a.brand.localeCompare(b.brand) || fullName(a).localeCompare(fullName(b)),
  battery: (a, b) => (b.battery?.capacity || 0) - (a.battery?.capacity || 0),
  screen: (a, b) => (b.display?.size || 0) - (a.display?.size || 0),
  savings: (a, b) => spreadOf(b) - spreadOf(a),
  shops: (a, b) => shopCount(offersFor(b)) - shopCount(offersFor(a)),
  ram: (a, b) => topOf(b, 'ram') - topOf(a, 'ram'),
  storage: (a, b) => topOf(b, 'storage') - topOf(a, 'storage')
};

// A sort is only worth offering when the items on screen actually carry the number: "Battery"

const SORT_NEEDS = { battery: p => p.battery?.capacity, screen: p => p.display?.size,
  ram: p => topOf(p, 'ram'), storage: p => topOf(p, 'storage'), savings: p => spreadOf(p) };
const SORT_ALL = ['popular', 'price_asc', 'price_desc', 'savings', 'shops', 'newest', 'brand', 'ram', 'storage', 'battery', 'screen'];
if (!SORT_ALL.includes(st.sort)) st.sort = D.sort;   // a sort key we removed must not survive in saved state
const sortKeys = () => { const v = inView(); return SORT_ALL.filter(k => !SORT_NEEDS[k] || v.some(SORT_NEEDS[k])); };
const sortLabel = k => (X[st.lang].sorts && X[st.lang].sorts[k]) || t('sort.' + k);
const results = () => DATA.filter(p => matches(p, st)).sort(SORTS[st.sort] || SORTS.popular);
const cnt = extra => DATA.filter(p => matches(p, { ...st, ...extra })).length;

function cardFacts(p, v) {
  const f = [];
  if (p.display?.size) f.push(esc(p.display.size + String.fromCharCode(8243)));
  if (v.storage != null) f.push(esc((v.ram ? v.ram + '/' : '') + gb(v.storage, p.variantUnit)));

function biggestSavings(n = 3) {
  // A saving is only real if it is the SAME phone in the SAME capacity. Comparing a 256 GB
  // offer against a 2 TB one produces a huge number nobody can actually pocket, so the spread
  // is measured inside each storage tier and the best genuine one wins.
  return DATA.map(p => {
    const byTier = new Map();
    for (const o of offersFor(p)) {
      const k = (o.storage ?? 'base') + '|' + (o.ram ?? '');
      (byTier.get(k) || byTier.set(k, []).get(k)).push(o.price);
    }
    let best = null;
    for (const [tier, prices] of byTier) {
      if (prices.length < 2) continue;
      const lo = Math.min(...prices), hi = Math.max(...prices);
      if (hi > lo && (!best || hi - lo > best.gap)) {
        // tier is the internal "storage|ram" key; keep the capacity itself for the label, or it
        // gets formatted as a capacity and prints as "2048I36 GB"
        const [stor] = tier.split('|');
        best = { p, lo, hi, gap: hi - lo, storage: stor === 'base' ? null : +stor };
      }
    }
    return best;
  }).filter(Boolean).sort((a, b) => b.gap - a.gap).slice(0, n);
}

const slugOf = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

/* ---- spec text in the reader language -------------------------------------
   Spec VALUES live in phones.json in English. Rather than keep 22 x 2 translated
   copies, the descriptive vocabulary is translated once in data/terms.json and
   substituted here. Product names (Cortex, Adreno, Gorilla Glass, One UI, IP68)
   are deliberately left alone - they are names, not English words.
   TR_BEGIN (build.mjs extracts everything down to TR_END and self-tests it) */
const TERMKEYS = Object.keys(TERMS).filter(k => k !== '_note').sort((a, b) => b.length - a.length);
const TERMLOW = TERMKEYS.map(k => k.toLowerCase());
// no regex here: escaping kept breaking, and a letter test works for any alphabet
const wordChar = ch => (ch >= '0' && ch <= '9') || ch.toLowerCase() !== ch.toUpperCase();
function tr(v, lang) {
  if (!v || lang === 'en') return v;
  const col = lang === 'hy' ? 0 : 1;
  const src = String(v), low = src.toLowerCase();
  let out = '', pos = 0;
  scan: while (pos < src.length) {
    for (let n = 0; n < TERMKEYS.length; n++) {
      if (!low.startsWith(TERMLOW[n], pos)) continue;
      const k = TERMKEYS[n];
      const before = pos ? src[pos - 1] : ' ', after = src[pos + k.length] || ' ';
      if (wordChar(before) || wordChar(after)) continue;      // inside a longer word
      out += TERMS[k][col]; pos += k.length; continue scan;
    }
    out += src[pos++];
  }
  return out.split('  ').join(' ').trim();
}
/* TR_END */

/* ---- colour swatches ----------------------------------------------------
   Shops name colours freely ("Awesome Lime", "Titanium Jetblack", "Icy Blue"),
   so an exact lookup table goes stale the moment a new phone lands. SWATCH holds
   the brand-signature colours that must be right; everything else is resolved from
   the colour words in the name, with light/deep modifiers applied. */
const SWATCH = {
  'Cosmic Orange': '#C8622A', 'Deep Blue': '#24405F', 'Silver': '#D9DADE', 'Space Black': '#26262A',
  'Cloud White': '#EDEDEA', 'Light Gold': '#E4CFA8', 'Sky Blue': '#A9C4D9', 'Mist Blue': '#A9C4D9',
  'Sage': '#9DAE96', 'Lavender': '#C9BCE0', 'Ultramarine': '#4A56C8', 'Teal': '#3F9E93',
  'Starlight': '#E8E3DA', 'Midnight': '#1F2430', 'Moonstone': '#C9CBD1', 'Iris': '#7A7FD0',
  'Jade': '#4E9E7E', 'Porcelain': '#EFEBE4', 'Obsidian': '#22252A', 'Peony': '#E7A9BC',
  'Rose Gold': '#DDB1A0', 'Pink Gold': '#E5BBB0', 'Titanium Pinkgold': '#E0B9AE',
  'Titanium Black': '#2E2E32', 'Titanium Gray': '#8E8E93', 'Titanium Silverblue': '#A9B4C2',
  'Titanium Whitesilver': '#DCDCDE', 'Poco Yellow': '#F5CB00', 'Arctic Dawn': '#DDE6EF',
  'Blush': '#E9B4AC', 'Citrus': '#E7C24A', 'Indigo': '#4B5490'
};
// head-noun colour words, matched from the end of the name
const HUE = {
  black: '#1B1B1F', white: '#F0F0EE', silver: '#D9DADE', gray: '#8E8E93', grey: '#8E8E93',
  graphite: '#4A4A50', titanium: '#B7B8BC', obsidian: '#22252A', eclipse: '#1A1A1E', shadow: '#6E7076',
  blue: '#2E6FA3', navy: '#2A3A57', ocean: '#2A5F8F', sky: '#A9C4D9', cyan: '#4FB6C4', teal: '#3F9E93',
  ultramarine: '#4A56C8', iris: '#7A7FD0', starry: '#3E5C8A', icy: '#CFE0EC',
  green: '#3E8E5A', mint: '#B9E3C6', lime: '#C3D852', olive: '#6F7355', sage: '#9DAE96',
  jade: '#4E9E7E', nebula: '#4E7F63', emerald: '#2E7D5B',
  yellow: '#EFC94C', gold: '#D9B36A', lightning: '#E3C56B', sand: '#DCC9A8',
  orange: '#C8622A', coral: '#E4705E', peach: '#F0BFA0', red: '#C03A32',
  pink: '#EFB4C4', rose: '#D9A0A6', peony: '#E7A9BC',
  purple: '#7B5FA8', violet: '#7B5FA8', lavender: '#C9BCE0', aurora: '#8E6FB8', dreamy: '#9A7FC0',
  midnight: '#1F2430', starlight: '#E8E3DA', moonstone: '#C9CBD1', moonlight: '#E9E9E4',
  storm: '#3A3D42', porcelain: '#EFEBE4', natural: '#C9C1B6', desert: '#C2A288',
  cream: '#EFE6D5', charcoal: '#43464B', pistachio: '#BFD3A0', cobalt: '#3B4FA8',
  lilac: '#C3AEDA', icyblue: '#BBD6E8'
};
// Materials, not colours. "Black Titanium" and "Natural Titanium" both end in the material,
// so a plain last-word-wins scan painted every Apple Watch Ultra swatch the same grey.
// These only answer when no real colour word is present ("Titanium" on its own).
// 'shadow' sits last in Samsung's "Blue Shadow" / "Silver Shadow" but qualifies the colour
// rather than naming it, exactly like the material words do.
const MATERIAL = new Set(['titanium', 'aluminium', 'aluminum', 'ceramic', 'steel', 'glass', 'leather', 'shadow']);
const _hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const _mix = (h, amt) => {           // amt > 0 lightens toward white, < 0 darkens
  const t = amt > 0 ? 255 : 0, k = Math.abs(amt);
  return '#' + _hex(h).map(v => Math.round(v + (t - v) * k).toString(16).padStart(2, '0')).join('');
};
function swatch(name) {
  if (SWATCH[name]) return SWATCH[name];
  const words = String(name || '').toLowerCase().replace(/[^a-z]+/g, ' ').trim().split(' ').filter(Boolean);
  let base = null, material = null;
  // scan from the end: colour names put the head noun last ("Coral Green" is green)
  for (let i = words.length - 1; i >= 0 && !base; i--) {
    const w = words[i];
    if (MATERIAL.has(w)) { material = material || HUE[w] || null; continue; }
    if (HUE[w]) { base = HUE[w]; break; }
    // compounds the shops write as one word: jetblack, pinkgold, jadegreen, whitesilver
    let bestLen = 0;
    for (const k in HUE) if (w.endsWith(k) && k.length > bestLen) { base = HUE[k]; bestLen = k.length; }
  }
  if (!base) base = material;
  if (!base) return '#9AA0A6';
  if (words.some(w => ['light', 'icy', 'ice', 'pale'].includes(w))) base = _mix(base, .34);
  if (words.some(w => ['deep', 'dark', 'midnight', 'jet', 'obsidian', 'storm'].includes(w))) base = _mix(base, -.3);
  return base;
}

const CIMG = (typeof COLORIMG !== 'undefined' && COLORIMG) || {};
const colorPhoto = (p, c) => (c && CIMG[p.id] && CIMG[p.id][slugOf(c)]) || null;
// 'main' is a copy of one of the colours under a different filename, so it would show twice
const cycShots = id => [...new Set(Object.entries(CIMG[id] || {}).filter(([k]) => k !== 'main').map(([, v]) => v))];

// Cards with more than one colour photo walk through them. One timer for the whole grid, and a
// card only advances while it is on screen: crossfading rows nobody is looking at is wasted work
// on a slow machine. Opacity only, so there is no layout to redo.
// Every card used to flip on the same 3s beat, so the whole grid blinked at once. Each card
// now carries its own due time with a random gap, which desynchronises them for free - one
// timer still drives the lot, it just asks each card whether its own moment has come.
const CYC_MIN = 4500, CYC_SPREAD = 4000;
const cycDue = () => performance.now() + CYC_MIN + Math.random() * CYC_SPREAD;
setInterval(() => {
  if (document.hidden) return;
  const cards = $$('[data-cyc]');
  if (!cards.length) return;          // compare, offers, privacy: nothing to cycle, read no layout
  const now = performance.now();
  for (const el of cards) {
    const r = el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) continue;
    // first sight of a card: give it a random moment rather than the next tick
    if (!el._cycDue) { el._cycDue = cycDue(); continue; }
    if (now < el._cycDue) continue;
    el._cycDue = cycDue();
    const shots = cycShots(el.dataset.cyc);
    const im = el.querySelectorAll('img');
    if (shots.length < 2 || im.length < 2) continue;
    const cur = im[0].classList.contains('on') ? im[0] : im[1];
    const nxt = cur === im[0] ? im[1] : im[0];
    const i = (+el.dataset.cycI || 0) + 1;
    el.dataset.cycI = i;
    nxt.src = shots[i % shots.length];
    nxt.classList.add('on');
    cur.classList.remove('on');
  }
}, 500);

let SEL = { id: null, color: null, storage: null, ram: null };
function initSel(p) {
  if (SEL.id === p.id) return;
  const offs = offersFor(p);
  // start on whatever the cheapest real offer actually is
  SEL = {
    id: p.id,
    color: (offs.find(o => o.color) || {}).color || (p.colors || [])[0] || null,
    storage: (offs.find(o => o.storage != null) || {}).storage ?? (p.variants[0] || {}).storage ?? null,
    ram: null
  };
  // RAM and storage are sold as a pair, so start on a combination that exists
  const v0 = p.variants.find(v => v.storage === SEL.storage) || p.variants[0];
  SEL.ram = v0 ? v0.ram : null;
}
// Narrow the offer list to the chosen options.
// RAM and storage decide the price, so those filters are HARD: if nothing matches, the answer is
// "no shop sells this configuration", not some other variant's price. Colour is soft, because it
// rarely changes the price and many listings omit it.
function visibleOffers(p) {
  let o = offersFor(p);
  if (SEL.storage != null && p.variants.length) {
    // Some shops (Mobile Centre) list no capacity. That price is for the base model, so it may
    // only stand in for the smallest tier - otherwise it would undercut a real 1 TB offer.
    const sizes = p.variants.map(v => v.storage).filter(v => v != null);
    const base = sizes.length ? Math.min(...sizes) : null;
    const anySize = p.variantUnit === 'mm';   // a watch listing states no case size; it sells all of them
    o = o.filter(v => v.storage === SEL.storage || (v.storage == null && (anySize || SEL.storage === base)));
  }
  if (SEL.ram != null) o = o.filter(v => v.ram == null || v.ram === SEL.ram);
  if (SEL.color) {
    const m = o.filter(v => !v.color || v.color === SEL.color);
    if (m.length) o = m;
  }
  return o;
}
function railHTML(offs) {
  if (offs.length < 2) return '';
  const lo = offs[0].price, hi = offs[offs.length - 1].price;
  if (hi === lo) return '';
  const dots = offs.map(o => `<span class="dt${o.price === lo ? ' b' : ''}" style="left:${((o.price - lo) / (hi - lo) * 100).toFixed(1)}%" title="${esc(shopName(o.shop))} · ${money(o.price)} ֏"></span>`).join('');
  return `<div class="rail" role="img" aria-label="${esc(x('saveUpTo'))} ${money(hi - lo)} AMD"><span class="ln"></span>${dots}</div>
    <div class="ends"><span class="num">${money(lo)} ֏</span><span class="num">${money(hi)} ֏</span></div>
    <div class="save">${esc(x('saveUpTo'))} <b class="num">${money(hi - lo)} ֏</b></div>`;
}

        <div class="pside">
          <p class="lede2">${esc(summary)}</p>
          ${cols.length ? `<div class="og"><label>${esc(t('sec.colors'))} <b id="colName">${esc(tr(SEL.color || '', st.lang))}</b></label>
            <div class="cs">${cols.map(c => `<button data-color="${esc(c)}" class="${c === SEL.color ? 'on' : ''}" style="--c:${esc(swatch(c))}" title="${esc(tr(c, st.lang))}" aria-label="${esc(tr(c, st.lang))}" aria-pressed="${c === SEL.color}"></button>`).join('')}</div></div>` : ''}
          ${rams.length > 1 ? `<div class="og"><label>${esc(t('f.ram'))}</label>
            <div class="bs">${rams.map(r => `<button data-ram="${r}" class="${r === SEL.ram ? 'on' : ''}" aria-pressed="${r === SEL.ram}">${r} ${esc(u('gb'))}</button>`).join('')}</div></div>` : ''}
          ${stors.length ? `<div class="og"><label>${esc(t(p.variantUnit === 'mm' ? 'f.case_size' : 'f.storage'))}</label>
            <div class="bs">${stors.map(sv => `<button data-storage="${sv}" class="${sv === SEL.storage ? 'on' : ''}" aria-pressed="${sv === SEL.storage}">${esc(gb(sv, p.variantUnit))}</button>`).join('')}</div></div>` : ''}
          <div class="pprice2">

/* ================= construct: the same filters, asked as questions =================
   Every question is derived from the items in the chosen category, so a new category needs
   no code here. A question with only one possible answer is not asked - it is reported as a
   fact instead, because a question you cannot answer two ways is not a choice. */
const CQ = [
  ['ram',  'filter.ram',          p => (p.variants || []).map(v => v.ram),     v => v + ' ' + u('gb')],
  ['stor', 'filter.storage',      p => (p.variants || []).map(v => v.storage), v => gb(v)],
  ['hz',   'filter.refresh_rate', p => [p.display && p.display.refresh],       v => v + ' ' + u('hz')],
  ['batt', 'filter.battery',      p => [p.battery && p.battery.capacity],      v => money(v) + ' ' + u('mah')]
];

function constructView() {
  const catOf = p => p.category || 'phone';
  const cats = [...new Set(DATA.map(catOf))];
  const label = c => (X[st.lang].cats || {})[c] || c;
  const pool = DATA.filter(p => st.cat && catOf(p) === st.cat);

  const catCards = cats.map(c => `<button class="ccard${st.cat === c ? ' on' : ''}" data-ccat="${esc(c)}"
      aria-pressed="${st.cat === c}"><b>${esc(label(c))}</b><span class="num">${DATA.filter(p => catOf(p) === c).length}</span></button>`).join('');

  const chip = (key, val, text, on) =>
    `<button class="cchip${on ? ' on' : ''}" data-cq="${esc(key)}" data-cqv="${esc(String(val))}" aria-pressed="${on}">${esc(text)}</button>`;

  let questions = '';
  const fixed = [];
  if (st.cat) {
    for (const [key, lbl, get, fmt] of CQ) {
      const vals = [...new Set(pool.flatMap(get).filter(v => v != null && v > 0))].sort((a, b) => a - b);
      if (vals.length < 2) continue;
      questions += `<section class="cq"><h3>${esc(t(lbl))}</h3><div class="cqrow">`
        + chip(key, 0, x('any'), !st[key])
        + vals.map(v => chip(key, v, x('min') + ' ' + fmt(v), String(st[key]) === String(v))).join('')
        + `</div></section>`;
    }
    const sizes = [...new Set(pool.map(p => p.display && p.display.size).filter(v => v != null))].sort((a, b) => a - b);
    if (sizes.length > 1) {
      questions += `<section class="cq"><h3>${esc(t('filter.screen_size'))}</h3><div class="cqrow">`
        + chip('scrmin', 0, x('any'), !st.scrmin)
        + sizes.map(v => chip('scrmin', v, x('min') + ' ' + v + String.fromCharCode(8243), String(st.scrmin) === String(v))).join('')
        + `</div></section>`;
    }
    const touches = [...new Set(pool.map(p => p.display && p.display.touch).filter(v => v != null))];
    if (touches.length > 1) {
      questions += `<section class="cq"><h3>${esc(t('f.touch'))}</h3><div class="cqrow">`
        + chip('touch', 0, x('any'), !st.touch)
        + chip('touch', 1, t('common.yes'), st.touch === 1)
        + chip('touch', 2, t('common.no'), st.touch === 2)
        + `</div></section>`;
    }
    const brands = [...new Set(pool.map(p => p.brand))].sort();
    if (brands.length > 1) {
      questions += `<section class="cq"><h3>${esc(t('filter.brand'))}</h3><div class="cqrow">`
        + brands.map(b => `<button class="cchip${st.brands.includes(b) ? ' on' : ''}" data-cqb="${esc(b)}"
            aria-pressed="${st.brands.includes(b)}">${esc(b)}</button>`).join('')
        + `</div></section>`;
    }
    // what does not vary is stated once rather than asked
    const one = (get, lbl, fmt) => {
      const v = [...new Set(pool.map(get).filter(x => x != null && x !== ''))];
      if (v.length === 1) fixed.push(t(lbl) + ': ' + fmt(v[0]));
    };
    one(p => p.display && p.display.touch, 'f.touch', v => v ? t('common.yes') : t('common.no'));
    one(p => p.graphics && p.graphics.type, 'f.graphics', v => tr(v, st.lang));
    one(p => p.connectivity && p.connectivity.network, 'f.network', v => tr(v, st.lang));
    one(p => p.os, 'f.os', v => tr(v, st.lang));
  }

  const hits = st.cat ? results().length : 0;
  return `<div class="shell">
    <div class="navrow">${backLink('#/', t('nav.catalog'))}
      <nav class="crumb"><span>${esc(t('construct.title'))}</span></nav></div>
    <h1 class="cnh">${esc(t('construct.title'))}</h1>
    <p class="clead">${esc(t('construct.lead'))}</p>

    <h2 class="sh" style="margin-top:24px">${esc(t('construct.pick_cat'))}</h2>
    <div class="cgrid">${catCards}</div>

    ${st.cat ? `${questions}
      ${fixed.length ? `<p class="cfixed"><b>${esc(t('construct.fixed'))}:</b> ${fixed.map(esc).join('  ·  ')}</p>` : ''}
      <div class="cgo">
        ${hits
          ? `<a class="btn" href="#/c/${esc(st.cat)}">${esc(t('construct.show'))} <b class="num">${hits}</b></a>`
          : `<span class="cnone">${esc(t('construct.none'))}</span>
             <button class="btn ghost" data-rm="all">${esc(t('common.reset'))}</button>`}
      </div>` : ''}
  </div>`;
}

function offerRow(o, lo, i, unit, cls) {
